name: Bug report
description: Ward did something wrong or failed.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ward init --preset standard --yes
        2. ward check --profile pre-push
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ward --version
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: ward doctor output
      description: Remove any paths or names you do not want to share.
      render: text
  - type: input
    id: agent
    attributes:
      label: Agent and version, if relevant
      placeholder: Claude Code 2.x, Cursor, Codex CLI…
