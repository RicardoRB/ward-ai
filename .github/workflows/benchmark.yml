name: Analysis benchmark

# Development-only baseline. It never runs on pull requests, and release.yml does not reference this module.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.5'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Build native executable
        run: ./mvnw -q -Pnative -DskipTests native:compile

      - name: Package the benchmark
        run: ./mvnw -q -pl ward-analysis-bench -am -DskipTests package

      - name: Run the benchmark
        run: >-
          java -jar ward-analysis-bench/target/ward-analysis-bench.jar
          --binary ward-cli/target/ward
          --manifest ward-analysis-bench/corpus.csv
          --out target/analysis-benchmark/result.json

      - name: Run the accuracy mode
        run: >-
          java -jar ward-analysis-bench/target/ward-analysis-bench.jar
          --binary ward-cli/target/ward
          --accuracy ward-analysis-bench/src/test/resources/accuracy
          --out target/analysis-benchmark/accuracy.json

      - name: Archive the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-benchmark
          path: |
            target/analysis-benchmark/result.json
            target/analysis-benchmark/accuracy.json
          if-no-files-found: warn
