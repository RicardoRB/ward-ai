name: Verify

# Shared by pull requests and releases. JVM tests cannot see native-image-only failures (for
# example, classes defined at run time), so alongside the JVM quality gates, each runner runs the
# terminal tests inside a native test image, builds the native executable, and drives its raw-key
# init wizard through a pseudo-terminal (POSIX) or smoke-runs it (Windows). The native checks and
# the compatibility matrices start with the quality gates instead of after them, which roughly halves
# the run; a failing gate no longer stops them.
on:
  workflow_call:
    inputs:
      native-runners:
        description: JSON array of runners for the native checks.
        type: string
        default: '["ubuntu-24.04", "macos-15", "windows-latest"]'
      harness-compatibility:
        description: Also run the deterministic agent-harness suites against the native executable.
        type: boolean
        default: false
      compatibility-matrices:
        description: Run the Node, Python, Swift and Java compatibility matrices. Pull requests into main run them; other pull requests skip them.
        type: boolean
        default: true

permissions:
  contents: read

env:
  # Maven 3.9 reads MAVEN_ARGS; -ntp keeps artifact downloads out of the job logs.
  MAVEN_ARGS: -ntp
  GITLEAKS_VERSION: 8.30.1
  # Only the vulnerability-parity job installs Trivy; no gate runs it.
  TRIVY_VERSION: 0.76.0

jobs:
  # Pull requests that change only website, openspec or Markdown files skip the native checks and
  # the compatibility matrices.
  changes:
    name: Code changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide whether the native checks run
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          code=true
          if [ "$EVENT" = pull_request ]; then
            changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
            if ! printf '%s\n' "$changed" | grep -qEv '^(website/|openspec/|.*\.md$)'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  quality:
    name: Ward ci profile
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # Its own key: the shorter matrix jobs finish first and would save setup-java's shared key
      # without the gate plugins (PMD, SpotBugs, PIT, ...). Saved separately so a failing gate keeps it.
      - name: Restore Maven cache
        id: maven-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-quality-${{ hashFiles('pom.xml', 'ward-*/pom.xml') }}
          restore-keys: maven-quality-

      # The native compile gate needs native-image, which only GraalVM ships. Its JAVA_HOME
      # replaces the Temurin one for the rest of this job; the Maven cache above still applies.
      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.5'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The Kotlin reference test compiles the mixed fixture with the pinned kotlinc release. The
      # archive is checked against its SHA-256 before it is unpacked.
      - name: Install Kotlin compiler
        env:
          KOTLIN_VERSION: 2.2.21
          KOTLIN_SHA256: a623871f1cd9c938946948b70ef9170879f0758043885bbd30c32f024e511714
        run: |
          set -eu
          kotlin_dir="$RUNNER_TEMP/kotlin"
          mkdir -p "$kotlin_dir"
          curl -sSfL --retry 5 --retry-all-errors -o "$kotlin_dir/kotlin-compiler.zip" \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          echo "${KOTLIN_SHA256}  $kotlin_dir/kotlin-compiler.zip" | sha256sum -c -
          unzip -q "$kotlin_dir/kotlin-compiler.zip" -d "$kotlin_dir"
          echo "WARD_KOTLINC=$kotlin_dir/kotlinc/bin/kotlinc" >> "$GITHUB_ENV"

      - name: Run the Kotlin resolution reference test
        run: >-
          ./mvnw -B -q -pl ward-cli -am
          -Dtest=KotlinResolutionReferenceTest
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dward.kotlinc.binary="$WARD_KOTLINC"
          test

      - name: Install Ward
        env:
          WARD_INSTALL_DIR: ${{ runner.temp }}/ward/bin
        run: |
          ./install.sh
          echo "$WARD_INSTALL_DIR" >> "$GITHUB_PATH"

      # Pull requests mutate only the domain and application classes they change, or whose test
      # changed; releases mutate everything. The pom.xml profile reads PIT_TARGET_CLASSES.
      - name: Limit mutation testing to changed classes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          # Renames at 100% similarity are moved files, not edits, so they are skipped. A path
          # filter would stop Git from pairing a moved file with its old path, so none is used.
          targets=$(git diff --name-status -M "origin/${BASE_REF}...HEAD" \
            | awk -F'\t' '$1 ~ /^(A|M)/ || ($1 ~ /^R/ && $1 != "R100") {print $NF}' \
            | grep -E '^(ward-cli/src/(main|test)/java/dev/ward/(domain|application)|ward-analysis-api/src/(main|test)/java/dev/ward/analysis/domain|ward-analysis-engine/src/(main|test)/java/dev/ward/analysis/(domain|application)|ward-lang-node/src/(main|test)/java/dev/ward/analysis/domain)/.*\.java$' \
            | sed -E -e 's#^(ward-cli|ward-analysis-api|ward-analysis-engine|ward-lang-node)/src/(main|test)/java/##' -e 's#(Test)?\.java$#*#' -e 's#/#.#g' \
            | sort -u | paste -sd, - || true)
          echo "Mutation targets: ${targets:-none}"
          echo "PIT_TARGET_CLASSES=${targets:-none.changed}" >> "$GITHUB_ENV"

      # --output keeps the text report on stdout for the job log.
      - name: Run quality gates
        run: ward check --profile ci --format sarif --output target/ward.sarif

      # Fork tokens cannot write security events; no file means Ward could not run at all.
      - name: Upload SARIF to code scanning
        if: >-
          always()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && hashFiles('target/ward.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: target/ward.sarif
          category: ward

      - name: Generate coverage report
        if: always()
        run: ./mvnw -B -q jacoco:report

      - name: Save Maven cache
        if: always() && steps.maven-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-quality-${{ hashFiles('pom.xml', 'ward-*/pom.xml') }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quality-reports
          path: |
            ward-cli/target/site/jacoco/
            ward-cli/target/pit-reports/
            target/ward.sarif
          if-no-files-found: ignore

  # Reads the Node and fixture pairs from the matrix data and skips
  # the matrix for pull requests that change only website, openspec or Markdown files.
  node-matrix-versions:
    name: Node matrix versions
    needs: changes
    if: inputs.compatibility-matrices && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    outputs:
      cells: ${{ steps.versions.outputs.cells }}
    steps:
      - uses: actions/checkout@v5

      - name: Read Node versions
        id: versions
        run: |
          set -eu
          cells=$(tail -n +2 ward-cli/src/test/resources/node-matrix/cells.csv | cut -d, -f1,2 | sort -u \
            | jq -R -sc 'split("\n") | map(select(length > 0) | split(",") | {node: .[0], fixture: .[1]})')
          echo "cells=$cells" >> "$GITHUB_OUTPUT"
          echo "Node cells: $cells"

  # One job per Node version and fixture. Each runs only the rows with that Node value and fixture.
  node-matrix:
    name: Node ${{ matrix.cell.node }} ${{ matrix.cell.fixture }} compatibility matrix
    needs: node-matrix-versions
    if: inputs.compatibility-matrices
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.node-matrix-versions.outputs.cells) }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            pom.xml
            ward-*/pom.xml

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.cell.node }}

      # Node 22 bundles npm 10.9, which crashes installing vitest 4.1.11 (npm/cli#9787); npm 11.6+
      # installs it. Only the Vue and Svelte cells need it, so the other fixtures keep their bundled npm.
      - name: Upgrade npm for Vitest 4.1.11
        if: matrix.cell.fixture == 'vue' || matrix.cell.fixture == 'svelte'
        run: npm install -g npm@11.21.1

      # Keyed on the catalog so a pinned version change refetches the packages.
      - name: Restore npm cache
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ matrix.cell.fixture }}-${{ hashFiles('ward-cli/src/main/java/dev/ward/infrastructure/init/node/NodePackageCatalog.java') }}

      - name: Build Ward
        run: ./mvnw -B -q package -DskipTests

      - name: Run ${{ matrix.cell.fixture }} cells for Node ${{ matrix.cell.node }}
        run: >-
          ./mvnw -B
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dtest=NodeCompatibilityMatrixTest
          -Dward.node.matrix=${{ matrix.cell.node }}
          -Dward.node.matrix.fixture=${{ matrix.cell.fixture }}
          -Dward.node.matrix.jar=target/ward.jar
          test

  # Reads the Python and fixture pairs from the matrix data and
  # skips the matrix for pull requests that change only website, openspec or Markdown files.
  python-matrix-versions:
    name: Python matrix versions
    needs: changes
    if: inputs.compatibility-matrices && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    outputs:
      cells: ${{ steps.versions.outputs.cells }}
    steps:
      - uses: actions/checkout@v5

      - name: Read Python versions
        id: versions
        run: |
          set -eu
          cells=$(tail -n +2 ward-cli/src/test/resources/python-matrix/cells.csv | cut -d, -f1,4 | sort -u \
            | jq -R -sc 'split("\n") | map(select(length > 0) | split(",") | {python: .[0], fixture: .[1]})')
          echo "cells=$cells" >> "$GITHUB_OUTPUT"
          echo "Python cells: $cells"

  # One job per Python version and fixture. Each runs only the rows with that version and fixture.
  python-matrix:
    name: Python ${{ matrix.cell.python }} ${{ matrix.cell.fixture }} compatibility matrix
    needs: python-matrix-versions
    if: inputs.compatibility-matrices
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.python-matrix-versions.outputs.cells) }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            pom.xml
            ward-*/pom.xml

      # The runner's interpreter is the cell's version, so uv and Poetry pick it up on the PATH.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.cell.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Poetry
        run: pipx install poetry

      - name: Build Ward
        run: ./mvnw -B -q package -DskipTests

      - name: Run ${{ matrix.cell.fixture }} cells for Python ${{ matrix.cell.python }}
        run: >-
          ./mvnw -B
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dtest=PythonCompatibilityMatrixTest
          -Dward.python.matrix=${{ matrix.cell.python }}
          -Dward.python.matrix.fixture=${{ matrix.cell.fixture }}
          -Dward.python.matrix.jar=target/ward.jar
          test

  # Runs the real Checkstyle, PMD, SpotBugs, Error Prone and NullAway on the fixtures of
  # every implemented Java rule and compares them with the committed parity report
  # (ward-cli/src/test/resources/parity/java-report.txt). Versions are pinned in resolve-tools.sh.
  java-parity:
    name: Java parity with the real tools
    if: inputs.compatibility-matrices
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            pom.xml
            ward-*/pom.xml

      - name: Resolve the tools
        run: ward-cli/src/test/resources/parity/resolve-tools.sh "$RUNNER_TEMP/parity-tools"

      - name: Compare the Java rules with the tools
        run: >-
          ./mvnw -B
          -pl ward-cli -am
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dtest=JavaParitySmokeTest
          -Dward.parity.tools="$RUNNER_TEMP/parity-tools"
          test

      - name: Compare the build policy rules with Maven Enforcer
        run: >-
          ./mvnw -B
          -pl ward-cli -am
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dtest=EnforcerParitySmokeTest
          -Dward.parity.enforcer=true
          test

  # Runs the real oasdiff on the base and revision of every OpenAPI breaking-change fixture and
  # compares its error-level results with the native rules; every difference must be listed in
  # ward-cli/src/test/resources/parity/oasdiff-approximations.txt.
  oasdiff-parity:
    name: OpenAPI breaking-change parity with oasdiff
    if: inputs.compatibility-matrices
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            pom.xml
            ward-*/pom.xml

      - name: Install oasdiff
        run: |
          curl -sSfL "https://github.com/oasdiff/oasdiff/releases/download/v1.37.0/oasdiff_1.37.0_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" oasdiff

      - name: Compare the breaking-change rules with oasdiff
        run: >-
          ./mvnw -B
          -pl ward-cli -am
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dtest=OasdiffParitySmokeTest
          -Dward.parity.oasdiff="$RUNNER_TEMP/oasdiff"
          test

  # Compiles the baseline and revision of every api-compat fixture (javac and kotlinc), runs the real
  # japicmp on them and compares its incompatible changes with the native check; every difference
  # must be listed in ward-cli/src/test/resources/parity/japicmp-report.txt.
  japicmp-parity:
    name: API compatibility parity with japicmp
    if: inputs.compatibility-matrices
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            pom.xml
            ward-*/pom.xml

      # The jar is checked against the SHA-1 that Maven Central publishes beside it.
      - name: Install japicmp
        run: |
          set -eu
          base="https://repo1.maven.org/maven2/com/github/siom79/japicmp/japicmp/0.23.1"
          jar="japicmp-0.23.1-jar-with-dependencies.jar"
          curl -sSfL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/japicmp.jar" "$base/$jar"
          echo "$(curl -sSfL --retry 5 --retry-all-errors "$base/$jar.sha1" | cut -d' ' -f1)  $RUNNER_TEMP/japicmp.jar" | sha1sum -c -

      - name: Install Kotlin compiler
        env:
          KOTLIN_VERSION: 2.2.21
          KOTLIN_SHA256: a623871f1cd9c938946948b70ef9170879f0758043885bbd30c32f024e511714
        run: |
          set -eu
          kotlin_dir="$RUNNER_TEMP/kotlin"
          mkdir -p "$kotlin_dir"
          curl -sSfL --retry 5 --retry-all-errors -o "$kotlin_dir/kotlin-compiler.zip" \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          echo "${KOTLIN_SHA256}  $kotlin_dir/kotlin-compiler.zip" | sha256sum -c -
          unzip -q "$kotlin_dir/kotlin-compiler.zip" -d "$kotlin_dir"
          echo "WARD_KOTLINC=$kotlin_dir/kotlinc/bin/kotlinc" >> "$GITHUB_ENV"

      - name: Compare the api-compat check with japicmp
        run: >-
          ./mvnw -B
          -pl ward-cli -am
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dtest=ApiCompatJapicmpParitySmokeTest
          -Dward.parity.japicmp="$RUNNER_TEMP/japicmp.jar"
          -Dward.kotlinc.binary="$WARD_KOTLINC"
          test

  # Runs the native vulnerabilities scan and the real Trivy (and pip-audit on the pip fixture) over the
  # dependency-inventory lockfiles with some versions replaced by vulnerable ones in a temporary copy,
  # and compares package, version and advisory id with the committed report
  # (ward-cli/src/test/resources/parity/vulnerability-report.txt). The test downloads the OSV archives.
  vulnerability-parity:
    name: Vulnerability parity with Trivy and pip-audit
    if: inputs.compatibility-matrices
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            pom.xml
            ward-*/pom.xml

      - name: Install Trivy
        run: |
          set -eu
          trivy_dir="$RUNNER_TEMP/trivy"
          trivy_asset="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          trivy_base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          mkdir -p "$trivy_dir"
          curl -sSfL --retry 5 --retry-all-errors -o "$trivy_dir/$trivy_asset" "$trivy_base/$trivy_asset"
          curl -sSfL --retry 5 --retry-all-errors -o "$trivy_dir/checksums.txt" "$trivy_base/trivy_${TRIVY_VERSION}_checksums.txt"
          (cd "$trivy_dir" && grep " $trivy_asset\$" checksums.txt | sha256sum -c -)
          tar -xzf "$trivy_dir/$trivy_asset" -C "$RUNNER_TEMP" trivy

      - name: Install pip-audit
        run: |
          python3 -m venv "$RUNNER_TEMP/pip-audit"
          "$RUNNER_TEMP/pip-audit/bin/pip" install pip-audit==2.9.0

      - name: Compare the vulnerabilities scan with Trivy and pip-audit
        run: >-
          ./mvnw -B
          -pl ward-cli -am
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dtest=VulnerabilityParitySmokeTest
          -Dward.parity.trivy="$RUNNER_TEMP/trivy"
          -Dward.parity.pip-audit="$RUNNER_TEMP/pip-audit/bin/pip-audit"
          test

  # Compares the declared licenses Ward reads for a Gradle project with the committed listing of the
  # Gradle license report plugin; Gradle first fills its module cache with the POMs.
  license-gradle-parity:
    name: License parity with the Gradle license report plugin
    if: inputs.compatibility-matrices
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            pom.xml
            ward-*/pom.xml

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.9.0'

      - name: Compare the declared licenses with the plugin's listing
        run: >-
          ./mvnw -B
          -pl ward-cli -am
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dtest=PomLicenseGradleParitySmokeTest
          -Dward.license.parity.gradle="$(command -v gradle)"
          test

  # Compares the Maven, PEP 440 and semver orders of domain/vulnerability with ComparableVersion
  # (the maven-artifact jar of the Maven wrapper), packaging and the npm semver package.
  version-order-parity:
    name: Version order parity with Maven, packaging and semver
    if: inputs.compatibility-matrices
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            pom.xml
            ward-*/pom.xml

      - name: Install the reference implementations
        run: |
          set -eu
          ./mvnw -B -q -v
          python3 -m venv "$RUNNER_TEMP/packaging"
          "$RUNNER_TEMP/packaging/bin/pip" install packaging==25.0
          mkdir -p "$RUNNER_TEMP/semver"
          npm install --prefix "$RUNNER_TEMP/semver" semver@7.6.3
          echo "MAVEN_ARTIFACT=$(ls "$HOME"/.m2/wrapper/dists/apache-maven-*/*/lib/maven-artifact-*.jar | head -1)" >> "$GITHUB_ENV"

      - name: Compare the version orders
        run: >-
          ./mvnw -B
          -pl ward-cli -am
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dtest=VersionOrderParityTest
          -Dward.parity.maven-artifact="$MAVEN_ARTIFACT"
          -Dward.parity.python="$RUNNER_TEMP/packaging/bin/python"
          -Dward.parity.semver="$RUNNER_TEMP/semver"
          test

  # Validates the generated SBOMs against the CycloneDX 1.6 JSON schema with cyclonedx-core-java.
  sbom-schema:
    name: SBOM schema validation
    if: inputs.compatibility-matrices
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            pom.xml
            ward-*/pom.xml

      - name: Resolve cyclonedx-core-java
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/cyclonedx"
          cat > "$RUNNER_TEMP/cyclonedx/pom.xml" <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0"><modelVersion>4.0.0</modelVersion>
            <groupId>x</groupId><artifactId>x</artifactId><version>1</version>
            <dependencies><dependency><groupId>org.cyclonedx</groupId><artifactId>cyclonedx-core-java</artifactId><version>11.0.1</version></dependency></dependencies>
          </project>
          POM
          ./mvnw -B -q -f "$RUNNER_TEMP/cyclonedx/pom.xml" dependency:build-classpath -Dmdep.outputFile="$RUNNER_TEMP/cyclonedx/classpath.txt"

      - name: Validate the SBOMs
        run: >-
          ./mvnw -B
          -pl ward-cli -am
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dtest=SbomSchemaSmokeTest
          -Dward.sbom.schema="$(cat "$RUNNER_TEMP/cyclonedx/classpath.txt")"
          test

  # Runs the real Spectral and the OWASP ruleset on the violating and passing fixtures of every
  # implemented OpenAPI lint rule and compares them with the committed report
  # (ward-cli/src/test/resources/parity/spectral-report.txt).
  spectral-parity:
    name: OpenAPI lint parity with Spectral
    if: inputs.compatibility-matrices
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            pom.xml
            ward-*/pom.xml

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Spectral
        run: >-
          npm install --prefix "$RUNNER_TEMP/spectral"
          @stoplight/spectral-cli@6.17.1
          @stoplight/spectral-owasp-ruleset@2.0.1

      - name: Compare the lint rules with Spectral
        run: >-
          ./mvnw -B
          -pl ward-cli -am
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dtest=SpectralParitySmokeTest
          -Dward.spectral.dir="$RUNNER_TEMP/spectral"
          test

  # Runs the real Gitleaks over the fixtures of every secret rule and compares it with the
  # committed report (ward-cli/src/test/resources/parity/gitleaks-report.txt).
  gitleaks-parity:
    name: Secret rule parity with Gitleaks
    if: inputs.compatibility-matrices
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            pom.xml
            ward-*/pom.xml

      - name: Install Gitleaks
        run: |
          curl -sSfL --retry 5 --retry-all-errors "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks

      - name: Compare the secret rules with Gitleaks
        run: >-
          ./mvnw -B
          -pl ward-cli -am
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dtest=GitleaksParitySmokeTest
          -Dward.parity.gitleaks="$RUNNER_TEMP/gitleaks"
          test

  # Reads the Xcode and fixture pairs and their runners from the
  # matrix data and skips the matrix for pull requests that change only website, openspec or Markdown
  # files.
  swift-matrix-versions:
    name: Swift matrix versions
    needs: changes
    if: inputs.compatibility-matrices && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    outputs:
      cells: ${{ steps.versions.outputs.cells }}
    steps:
      - uses: actions/checkout@v5

      - name: Read Xcode versions
        id: versions
        run: |
          set -eu
          cells=$(tail -n +2 ward-cli/src/test/resources/swift-matrix/cells.csv | cut -d, -f1,4 | sort -u \
            | awk -F, 'NR == FNR { runner[$1] = $2; next } { print $1 "," $2 "," runner[$1] }' \
                ward-cli/src/test/resources/swift-matrix/xcodes.csv - \
            | jq -R -sc 'split("\n") | map(select(length > 0) | split(",") | {xcode: .[0], fixture: .[1], runner: .[2]})')
          echo "cells=$cells" >> "$GITHUB_OUTPUT"
          echo "Swift cells: $cells"

  # One job per Xcode and fixture, on the macOS runner that xcodes.csv names for that Xcode.
  swift-matrix:
    name: Xcode ${{ matrix.cell.xcode }} ${{ matrix.cell.fixture }} compatibility matrix
    needs: swift-matrix-versions
    if: inputs.compatibility-matrices
    runs-on: ${{ matrix.cell.runner }}
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.swift-matrix-versions.outputs.cells) }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            pom.xml
            ward-*/pom.xml

      # Keyed on the tool catalog so a pinned version change refetches the packages.
      - name: Restore SwiftPM cache
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ matrix.cell.xcode }}-${{ matrix.cell.fixture }}-${{ hashFiles('ward-cli/src/main/java/dev/ward/infrastructure/init/swift/SwiftToolCatalog.java') }}

      - name: Build Ward
        run: ./mvnw -B -q package -DskipTests

      - name: Run ${{ matrix.cell.fixture }} cells for Xcode ${{ matrix.cell.xcode }}
        run: >-
          ./mvnw -B
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dtest=SwiftCompatibilityMatrixTest
          -Dward.swift.matrix=${{ matrix.cell.xcode }}
          -Dward.swift.matrix.fixture=${{ matrix.cell.fixture }}
          -Dward.swift.matrix.jar=target/ward.jar
          test

  # Reads the JDK and Gradle versions from the matrix data and
  # skips the matrix for pull requests that change only website, openspec or Markdown files.
  java-matrix-versions:
    name: Java matrix versions
    needs: changes
    if: inputs.compatibility-matrices && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    outputs:
      cells: ${{ steps.versions.outputs.cells }}
    steps:
      - uses: actions/checkout@v5

      - name: Read JDK versions
        id: versions
        run: |
          set -eu
          cells=$(tail -n +2 ward-cli/src/test/resources/java-matrix/jdks.csv \
            | jq -R -sc 'split("\n") | map(select(length > 0) | split(",") | {jdk: .[0], gradle: .[1]})')
          echo "cells=$cells" >> "$GITHUB_OUTPUT"
          echo "JDK cells: $cells"

  # One job per JDK. Ward runs on JDK 25; Maven, Gradle and every gate run on the cell's JDK.
  java-matrix:
    name: JDK ${{ matrix.cell.jdk }} compatibility matrix
    needs: java-matrix-versions
    if: inputs.compatibility-matrices
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.java-matrix-versions.outputs.cells) }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK ${{ matrix.cell.jdk }}
        id: cell-jdk
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.cell.jdk }}

      # Set up last, so JDK 25 is the default that builds and runs Ward.
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            pom.xml
            ward-*/pom.xml

      - name: Set up Gradle ${{ matrix.cell.gradle }}
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ matrix.cell.gradle }}

      # setup-gradle caches ~/.gradle; this keeps the Maven distribution the fixture wrapper fetches,
      # keyed on the catalogs so a pinned version change starts fresh.
      - name: Restore Maven Wrapper cache
        uses: actions/cache@v5
        with:
          path: ~/.m2/wrapper
          key: java-matrix-${{ matrix.cell.jdk }}-${{ hashFiles('ward-cli/src/main/java/dev/ward/domain/init/maven/ManagedPluginCatalog.java', 'ward-cli/src/main/java/dev/ward/domain/init/gradle/GradleToolCatalog.java') }}

      - name: Build Ward
        run: ./mvnw -B -q package -DskipTests

      - name: Run matrix cells for JDK ${{ matrix.cell.jdk }}
        run: >-
          ./mvnw -B
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dtest=JavaCompatibilityMatrixTest
          -Dward.java.matrix=${{ matrix.cell.jdk }}
          -Dward.java.matrix.jar=target/ward.jar
          -Dward.java.matrix.home=${{ steps.cell-jdk.outputs.path }}
          test

  native:
    name: Native checks (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.native-runners) }}
    runs-on: ${{ matrix.os }}
    # PowerShell splits -Dname.with.dots=value arguments; Git Bash runs the mvnw script on Windows.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Set up GraalVM 25.5
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.5'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      # native:test resolves its prefix per module, so ward-cli takes the analysis modules from the
      # local repository instead of the reactor. ward-cli depends on the ANTLR frontend and the Java,
      # TypeScript, JavaScript and Python rules, so those are installed too.
      - name: Install the analysis modules for the native build
        run: ./mvnw -B -q -DskipTests install -pl ward-analysis-api,ward-analysis-engine,ward-frontend-antlr,ward-lang-jvm,ward-lang-node,ward-lang-python,ward-lang-swift,ward-lang-openapi,ward-lang-android -am

      - name: Run terminal tests in a native test image
        run: >-
          ./mvnw -B -Pnative -pl ward-cli
          -Dtest='dev/ward/infrastructure/terminal/*Test,dev/ward/infrastructure/terminal/**/*Test'
          -Dsurefire.failIfNoSpecifiedTests=false
          test native:test

      - name: Build native executable
        run: ./mvnw -B -q -Pnative -pl ward-cli -DskipTests package native:compile

      - name: Drive init through a pseudo-terminal and run the ward gate
        if: runner.os != 'Windows'
        run: >-
          ./mvnw -B
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dtest=NativeInitTerminalSmokeTest,NativeWardGateSmokeTest,NativeFormatSmokeTest,NativeApiCompatSmokeTest
          -Dward.native.binary=target/ward
          test

      - name: Smoke-run the Windows executable
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          ward-cli/target/ward.exe --version
          ward-cli/target/ward.exe --help > /dev/null

      - name: Set up Bun
        if: inputs.harness-compatibility && runner.os != 'Windows'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Verify agent integrations against the native executable
        if: inputs.harness-compatibility && runner.os != 'Windows'
        run: compatibility/run-deterministic.sh ward-cli/target/ward
