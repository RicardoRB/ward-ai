name: Pull request

# Every pull request must pass the JVM quality gates (including JaCoCo coverage), build the native
# executable, and pass the native checks and agent-harness suites before it can merge.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    # verify.yml uploads SARIF on pull requests; a called job cannot exceed its caller's grant.
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/verify.yml
    with:
      # macos-15-intel is the slowest native runner and gates the PR; release still runs it.
      native-runners: '["ubuntu-24.04", "macos-15", "windows-latest"]'
      harness-compatibility: true
      # Matrices run only for pull requests into main; release-branch pull requests skip them.
      compatibility-matrices: ${{ github.base_ref == 'main' }}

  changelog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check CHANGELOG.md has a section for the pom version
        run: |
          set -euo pipefail
          version=$(sed -n 's:^    <version>\(.*\)</version>$:\1:p' pom.xml | head -1)
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version; add the changelog entries before merging." >&2
            exit 1
          fi
