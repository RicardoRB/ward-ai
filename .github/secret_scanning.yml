# Ward's own secret rules and their tests hold fake secrets and the literal prefixes the rules
# match. They are test data, so GitHub secret scanning and push protection skip these paths.
# Keep this list in step with .gitleaks.toml.
paths-ignore:
  - "ward-cli/src/main/resources/rules/secrets/**"
  - "ward-cli/src/test/resources/rules/secrets/**"
  - "ward-cli/src/test/resources/catalog/**"
  - "ward-cli/src/test/java/dev/ward/infrastructure/rule/SecretScan*Test.java"
