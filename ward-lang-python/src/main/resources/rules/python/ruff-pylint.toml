# Ruff's pylint-mirrored general rules (PL*, UP004) for Python that a node's text or kind decides.

[[rules]]
id = "ward:python/assert-on-string-literal"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["assert_stmt"]
text = "^assert\\s*[rRbBuUfF]{0,2}(?:'[^']*'|\"[^\"]*\")\\s*(?:,.*)?$"
message = "assert on a string literal is always true; assert a condition"
'''

[[rules]]
id = "ward:python/bad-open-mode"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["atom_expr"]
text = "^open\\((?:[^,()]|\\([^()]*\\))*,\\s*(?:mode\\s*=\\s*)?['\"](?![rwax](?:[bt]\\+?|\\+[bt]?)?['\"])[^'\"]*['\"]"
message = "open() is called with a mode that Python does not accept"
'''

[[rules]]
id = "ward:python/bad-staticmethod-argument"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["decorated"]
text = "^@staticmethod\\s*(?:async\\s*)?def\\s*\\w+\\s*\\(\\s*(?:self|cls)\\b"
message = "static method takes self or cls as its first argument"
'''

[[rules]]
id = "ward:python/binary-op-exception"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["or_test"]
with-child = ["'or'"]
parent-path = "test>except_clause"
message = "except clause joins exception types with 'or'; list them in a tuple"
'''

[[rules]]
id = "ward:python/comparison-with-itself"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["comparison"]
text = "^([A-Za-z_][\\w.]*)\\s*(?:==|!=|<=|>=|<|>)\\s*\\1$"
message = "comparison of a value with itself"
'''

[[rules]]
id = "ward:python/global-at-module-level"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["global_stmt"]
not-inside = ["funcdef", "classdef"]
message = "global statement at module level has no effect"
'''

[[rules]]
id = "ward:python/global-statement"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["global_stmt"]
message = "global statement; pass the value in or return it"
'''

[[rules]]
id = "ward:python/invalid-envvar-default"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["atom_expr"]
text = "^(?:os\\.)?(?:getenv|environ\\.get)\\((?:[^,()]|\\([^()]*\\))*,\\s*(?:-?\\d|True\\b|False\\b|\\[|\\{|\\()"
message = "environment variable default must be a string or None"
'''


[[rules]]
id = "ward:python/nan-comparison"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["comparison"]
text = "(?:==|!=|<=|>=|<|>)\\s*(?:math\\.nan|np\\.nan|numpy\\.nan|float\\(\\s*['\"][+-]?nan['\"]\\s*\\))|(?:math\\.nan|np\\.nan|numpy\\.nan|float\\(\\s*['\"][+-]?nan['\"]\\s*\\))\\s*(?:==|!=|<=|>=|<|>)"
message = "comparison with NaN is always false; use math.isnan()"
'''

[[rules]]
id = "ward:python/no-classmethod-decorator"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["expr_stmt"]
text = "^([A-Za-z_]\\w*)\\s*=\\s*classmethod\\(\\1\\)$"
message = "use the @classmethod decorator instead of assigning classmethod()"
'''

[[rules]]
id = "ward:python/no-staticmethod-decorator"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["expr_stmt"]
text = "^([A-Za-z_]\\w*)\\s*=\\s*staticmethod\\(\\1\\)$"
message = "use the @staticmethod decorator instead of assigning staticmethod()"
'''

[[rules]]
id = "ward:python/non-ascii-name"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["name"]
text = "[^\\x00-\\x7F]"
message = "identifier uses a non-ASCII character"
'''

[[rules]]
id = "ward:python/property-with-parameters"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["decorated"]
text = "^@property\\s*(?:async\\s*)?def\\s*\\w+\\s*\\(\\s*\\w+\\s*,"
message = "property getter takes parameters besides self"
'''

[[rules]]
id = "ward:python/redeclared-assigned-name"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["expr_stmt"]
text = "^(?:[A-Za-z_]\\w*\\s*,\\s*)*([A-Za-z_]\\w*)\\s*,\\s*(?:[A-Za-z_]\\w*\\s*,\\s*)*\\1\\s*=(?!=)"
message = "name is assigned twice in one assignment"
'''

[[rules]]
id = "ward:python/self-assigning-variable"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["expr_stmt"]
text = "^([A-Za-z_][\\w.]*)\\s*=\\s*\\1$"
message = "variable is assigned to itself"
'''

[[rules]]
id = "ward:python/shallow-copy-environ"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["atom_expr"]
text = "^copy\\.copy\\(\\s*os\\.environ\\s*\\)"
message = "copy.copy(os.environ) makes a shallow copy; use os.environ.copy()"
'''

[[rules]]
id = "ward:python/subprocess-popen-preexec-fn"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["atom_expr"]
text = "(?s)^subprocess\\.Popen\\(.*\\bpreexec_fn\\s*="
message = "preexec_fn is not safe with threads; avoid it in subprocess.Popen"
'''

[[rules]]
id = "ward:python/super-without-brackets"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["atom_expr"]
text = "^super\\.\\w"
message = "super is used without brackets; call super() to reach the parent"
'''

[[rules]]
id = "ward:python/nested-min-max"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["atom_expr"]
text = "^(min|max)\\((?:[^()]*,\\s*)?\\1\\("
message = "nested min or max call can be a single call with all the values"
'''

[[rules]]
id = "ward:python/too-many-boolean-expressions"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
options.max = { type = "integer", min = 1 }
body = '''
check = "count"
kinds = ["if_stmt"]
counted = ["'and'", "'or'"]
skip = ["block"]
max = 5
message = "if condition has {value} boolean operators; the limit is {max}"
'''

[[rules]]
id = "ward:python/too-many-branches"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
options.max = { type = "integer", min = 1 }
body = '''
check = "count"
kinds = ["funcdef"]
counted = ["if_stmt", "'elif'", "'else'", "'finally'", "for_stmt", "while_stmt", "except_clause", "case_block"]
skip = ["funcdef", "classdef", "test"]
max = 12
message = "function has {value} branches; the limit is {max}"
'''

[[rules]]
id = "ward:python/too-many-statements"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
options.max = { type = "integer", min = 1 }
body = '''
check = "count"
kinds = ["funcdef"]
counted = ["simple_stmt", "compound_stmt"]
skip = ["funcdef", "classdef"]
max = 50
message = "function has {value} statements; the limit is {max}"
'''

[[rules]]
id = "ward:python/too-many-nested-blocks"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
options.max = { type = "integer", min = 1 }
body = '''
check = "depth"
kinds = ["if_stmt", "for_stmt", "while_stmt", "try_stmt", "with_stmt"]
reset = ["funcdef", "classdef"]
max = 5
message = "block is nested {value} levels deep; the limit is {max}"
'''

[[rules]]
id = "ward:python/unnecessary-dict-index-lookup"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["for_stmt"]
text = "(?s)^for\\s*([A-Za-z_]\\w*)\\s*,\\s*[A-Za-z_]\\w*\\s*in\\s*([A-Za-z_][\\w.]*)\\.items\\(\\)\\s*:.*(?<![\\w.])\\2\\[\\1\\]"
message = "dictionary is indexed with the key that items() already yields"
'''

[[rules]]
id = "ward:python/unnecessary-list-index-lookup"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["for_stmt"]
text = "(?s)^for\\s*([A-Za-z_]\\w*)\\s*,\\s*[A-Za-z_]\\w*\\s*in\\s*enumerate\\(\\s*([A-Za-z_][\\w.]*)\\s*\\)\\s*:.*(?<![\\w.])\\2\\[\\1\\]"
message = "list is indexed with the index that enumerate() already yields"
'''

[[rules]]
id = "ward:python/unnecessary-direct-lambda-call"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["atom_expr"]
text = "^\\(\\s*lambda[^)]*\\)\\s*\\("
message = "lambda is called directly; use its body instead"
'''

[[rules]]
id = "ward:python/unnecessary-dunder-call"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["atom_expr"]
text = "\\.__(?:abs|add|and|bool|contains|delitem|eq|float|floordiv|ge|getitem|gt|iadd|iand|ifloordiv|ilshift|imatmul|imod|imul|int|invert|ior|ipow|irshift|isub|itruediv|ixor|le|len|lshift|lt|matmul|mod|mul|ne|neg|or|pos|pow|rshift|setitem|str|sub|truediv|xor)__\\("
message = "dunder method is called directly; use the operator or builtin instead"
'''

[[rules]]
id = "ward:python/useless-import-alias"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["import_as_name", "dotted_as_name"]
text = "^([A-Za-z_]\\w*)as\\1$"
message = "import alias repeats the imported name"
'''

[[rules]]
id = "ward:python/unspecified-encoding"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["atom_expr"]
text = "^(?:(?:io\\.)?open\\(|(?:pathlib\\.)?Path\\((?:[^()]|\\([^()]*\\))*\\)\\.(?:read_text|write_text|open)\\()(?![^)]*encoding\\s*=)(?![^)]*['\"][rwax]?\\+?b)(?![^)]*,\\s*(?!mode\\s*=)[A-Za-z_])"
message = "text file is opened without an explicit encoding"
'''

[[rules]]
id = "ward:python/useless-with-lock"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["with_stmt"]
text = "^with(?:threading\\.)?(?:Lock|RLock|Condition|Semaphore|BoundedSemaphore)\\(\\)"
message = "lock is created in a with statement and never shared; create it once and keep a reference"
'''

[[rules]]
id = "ward:python/useless-object-inheritance"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["classdef"]
text = "^class[A-Za-z_]\\w*\\(\\s*object\\s*\\)\\s*:"
message = "class inherits from object, which is implied in Python 3"
'''

