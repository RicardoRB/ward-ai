# Injection rules for Python: untrusted input from a web request reaches a sensitive call within one body.
# Each follows the taint specifications taint/python/ward-<weakness>.toml and taint/python/sources.toml.

[[rules]]
id = "ward:python/sql-injection"
language = "python"
capability = "DATAFLOW"
severity = "error"
category = "security"
presets = ["standard", "strict"]
body = '''
check = "taint"
specs = ["taint/python/sources.toml", "taint/python/ward-sql-injection.toml"]
message = "untrusted data from {source} is part of the SQL text that {sink} runs; pass it as a bound parameter instead"
'''

[[rules]]
id = "ward:python/command-injection"
language = "python"
capability = "DATAFLOW"
severity = "error"
category = "security"
presets = ["standard", "strict"]
body = '''
check = "taint"
specs = ["taint/python/sources.toml", "taint/python/ward-command-injection.toml"]
message = "untrusted data from {source} is part of the command that {sink} runs; pass an argument list and validate the value"
'''

[[rules]]
id = "ward:python/code-injection"
language = "python"
capability = "DATAFLOW"
severity = "error"
category = "security"
presets = ["standard", "strict"]
