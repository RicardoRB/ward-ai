# Checkstyle concepts for Python (#297). Each row is the Python form of one Checkstyle check that
# google_checks.xml or config/checkstyle.xml enables. Naming follows PEP 8: functions and parameters
# are snake_case, classes are CapWords.

[[rules]]
id = "ward:python/abbreviation-as-word-in-name"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "naming"
presets = ["standard", "strict"]
body = '''
check = "identifier-pattern"
kinds = ["classdef", "funcdef", "tfpdef"]
name = "NAME"
pattern = "^(?!.*[A-Z]{2}).*$"
message = "name '{value}' has more than one consecutive capital letter"
'''

[[rules]]
id = "ward:python/type-name"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "naming"
presets = ["standard", "strict"]
body = '''
check = "identifier-pattern"
kinds = ["classdef"]
name = "NAME"
pattern = "^[A-Z][a-zA-Z0-9]*$"
message = "class name '{value}' must be CapWords"
'''

[[rules]]
id = "ward:python/method-name"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "naming"
presets = ["standard", "strict"]
body = '''
check = "identifier-pattern"
kinds = ["funcdef"]
name = "NAME"
pattern = "^_*[a-z][a-z0-9_]*_*$"
message = "function name '{value}' must be snake_case"
'''

[[rules]]
id = "ward:python/parameter-name"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "naming"
presets = ["standard", "strict"]
body = '''
check = "identifier-pattern"
kinds = ["tfpdef"]
name = "NAME"
pattern = "^_*[a-z][a-z0-9_]*$"
message = "parameter name '{value}' must be snake_case"
'''

[[rules]]
id = "ward:python/avoid-star-import"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["import_from"]
text = '\*$'
message = "star import hides the names it binds; import them by name"
'''

[[rules]]
id = "ward:python/line-length"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
body = '''
check = "text-pattern"
target = "lines"
pattern = "^.{101,}$"
message = "line is longer than 100 characters"
'''

[[rules]]
id = "ward:python/regexp-singleline"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["standard", "strict"]
body = '''
check = "text-pattern"
target = "lines"
pattern = "\\s+$"
message = "trailing whitespace"
'''

[[rules]]
id = "ward:python/todo-comment"
language = "python"
capability = "SYNTAX"
severity = "warning"
category = "style"
presets = ["standard", "strict"]
body = '''
check = "text-pattern"
target = "lines"
pattern = "#\\s*TODO:"
message = "TODO comment; track the work in an issue instead"
'''

[[rules]]
id = "ward:python/one-statement-per-line"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["standard", "strict"]
body = '''
check = "text-pattern"
target = "lines"
pattern = "^(?:[^'\"#]|'[^']*'|\"[^\"]*\")*;"
message = "more than one statement on a line"
'''

[[rules]]
id = "ward:python/illegal-catch"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["except_clause"]
text = '^except(Exception|BaseException)(as\w+)?$'
message = "catching Exception or BaseException is too broad; name the exceptions to handle"
'''

[[rules]]
id = "ward:python/local-variable-name"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "naming"
presets = ["standard", "strict"]
body = '''
check = "identifier-pattern"
kinds = ["expr_stmt>'='", "expr_stmt>annassign"]
inside = ["funcdef"]
name = "NAME"
pattern = "^_*[a-z][a-z0-9_]*$"
message = "local variable name '{value}' must be snake_case"
'''

[[rules]]
id = "ward:python/magic-number"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["strict"]
body = '''
check = "forbidden-node"
kinds = ["NUMBER"]
inside = ["comparison>comp_op"]
text = "^(?!(?:0|1|2)$)"
message = "magic number in a comparison; name it as a constant"
'''

[[rules]]
id = "ward:python/missing-javadoc-method"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "docs"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["funcdef"]
text = "^def(?!_)\\w+\\((?:[^()]|\\([^()]*\\))*\\)(?:->[^:]*)?:(?![\\s]*['\"])"
message = "public function has no docstring"
'''

[[rules]]
id = "ward:python/missing-javadoc-type"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "docs"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["classdef"]
text = "^class(?!_)\\w+(?:\\((?:[^()]|\\([^()]*\\))*\\))?:(?![\\s]*['\"])"
message = "public class has no docstring"
'''

[[rules]]
id = "ward:python/hex-literal-case"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["strict"]
body = '''
check = "forbidden-node"
kinds = ["NUMBER", "INTEGER"]
text = "^0[xX][0-9a-fA-F]*[a-f]"
message = "hex digits must be upper case"
'''

[[rules]]
id = "ward:python/numerical-prefixes-infixes-suffixes-character-case"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["strict"]
body = '''
check = "forbidden-node"
kinds = ["NUMBER", "INTEGER"]
text = "^(?:0X|0O|0B|[0-9.]+E)"
message = "numeric prefix or exponent has the wrong character case"
'''

[[rules]]
id = "ward:python/trailing-comment"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["strict"]
body = '''
check = "text-pattern"
target = "lines"
pattern = "^(?:[^'\"#]|'[^']*'|\"[^\"]*\")*[^\\s#'\"](?:[^'\"#]|'[^']*'|\"[^\"]*\")*#"
message = "trailing comment; put the comment on its own line"
'''

[[rules]]
id = "ward:python/avoid-inline-conditionals"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["strict"]
body = '''
check = "forbidden-node"
kinds = ["test"]
text = "if.*else"
message = "inline conditional; use an if statement"
'''

[[rules]]
id = "ward:python/simplify-boolean-expression"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["strict"]
body = '''
check = "text-pattern"
target = "lines"
pattern = "(==|!=)\\s*(True|False)\\b|\\b(True|False)\\s*(==|!=)"
message = "comparison with a boolean literal; simplify the expression"
'''

[[rules]]
id = "ward:python/simplify-boolean-return"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["if_stmt"]
text = "^if[^:]*:(?:\\s*return(?:True|False)\\s*else:\\s*return(?:True|False)|\\s*(\\w[\\w.]*)\\s*=\\s*(?:True|False)\\s*else\\s*:\\s*\\1\\s*=\\s*(?:True|False))"
message = "if statement returns boolean literals; return the condition instead"
'''

[[rules]]
id = "ward:python/lambda-parameter-name"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "naming"
presets = ["strict"]
body = '''
check = "identifier-pattern"
kinds = ["lambdef"]
name = "NAME"
pattern = "^_*[a-z][a-z0-9_]*$"
message = "lambda parameter name '{value}' must be snake_case"
'''

[[rules]]
id = "ward:python/nested-if-depth"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["strict"]
body = '''
check = "depth"
kinds = ["if_stmt"]
reset = ["funcdef", "classdef"]
max = 1
message = "if statements are nested {value} levels deep; the limit is {max}"
'''

[[rules]]
id = "ward:python/nested-for-depth"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["strict"]
body = '''
check = "depth"
kinds = ["for_stmt"]
reset = ["funcdef", "classdef"]
max = 1
message = "for loops are nested {value} levels deep; the limit is {max}"
'''

[[rules]]
id = "ward:python/nested-try-depth"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["strict"]
body = '''
check = "depth"
kinds = ["try_stmt"]
reset = ["funcdef", "classdef"]
max = 1
message = "try statements are nested {value} levels deep; the limit is {max}"
'''


[[rules]]
id = "ward:python/constant-name"
language = "python"
capability = "SCOPES"
severity = "error"
category = "naming"
presets = ["standard", "strict"]
body = '''
check = "module-constant-name"
message = "module-level name '{value}' should be UPPER_CASE"
'''

[[rules]]
id = "ward:python/member-name"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "naming"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["expr_stmt"]
text = '^self\.(?!_*[a-z][a-z0-9_]*=)\w+='
message = "attribute name '{value}' should be snake_case"
'''

[[rules]]
id = "ward:python/static-variable-name"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "naming"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["expr_stmt"]
inside = ["classdef"]
not-inside = ["funcdef"]
text = '^(?![a-z_][a-z0-9_]*=|[A-Z_][A-Z0-9_]*=|__\w*__=)[A-Za-z_]\w*='
message = "class attribute name '{value}' should be snake_case or UPPER_CASE"
'''
