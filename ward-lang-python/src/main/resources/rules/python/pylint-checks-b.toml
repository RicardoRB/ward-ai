# Pylint checks, part B: special methods that return a literal of the wrong type.

[[rules]]
id = "ward:python/invalid-bool-returned"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "pylint"
presets = ["standard", "strict"]
body = '''
check = "dunder-return"
method = "__bool__"
returns = "bool"
message = "__bool__ does not return bool"
'''

