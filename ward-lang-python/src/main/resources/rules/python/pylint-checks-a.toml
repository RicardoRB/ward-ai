# Pylint checks, part A (#336): the standard Pylint rows whose text a single node decides.


[[rules]]
id = "ward:python/consider-using-sys-exit"
language = "python"
capability = "SCOPES"
severity = "error"
category = "coding"
presets = ["standard", "strict"]
body = '''
check = "sys-exit-call"
message = "use sys.exit() instead of exit() or quit()"
'''

[[rules]]
id = "ward:python/comparison-of-constants"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "coding"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["comparison"]
text = "^(\\d+(\\.\\d+)?|'[^']*'|\"[^\"]*\"|True|False|None)(==|!=|<=|>=|<|>)(\\d+(\\.\\d+)?|'[^']*'|\"[^\"]*\"|True|False|None)$"
message = "comparison between two literal constants; the result is known"
'''

[[rules]]
id = "ward:python/consider-using-from-import"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "coding"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["import_name"]
text = "^import[\\w.]*\\.(\\w+)as\\1$"
message = "import the name with from ... import instead of an aliased module import"
'''

[[rules]]
id = "ward:python/broad-exception-raised"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "coding"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["raise_stmt"]
text = "^raise(Exception|BaseException)(\\(|$)"
message = "raise a specific exception instead of Exception or BaseException"
'''

[[rules]]
id = "ward:python/consider-merging-isinstance"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "coding"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["or_test"]
text = "isinstance\\((\\w+),[^)]*\\)orisinstance\\(\\1,"
message = "merge isinstance checks on the same value into one call with a tuple of types"
'''

[[rules]]
id = "ward:python/consider-using-in"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "coding"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["or_test"]
text = "(\\w+)==[\\w.'\"]+or\\1==|(\\w+)!=[\\w.'\"]+and\\2!="
message = "use 'in' with a tuple instead of repeated equality checks on the same value"
'''

# shortcut: the check matches the structure of the and/or expression in an assignment or return, and recognises only literal truthy middle operands; Pylint infers them.
[[rules]]
id = "ward:python/consider-using-ternary"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "coding"
presets = ["standard", "strict"]
body = '''
check = "and-or-ternary"
message = "use a conditional expression instead of 'and'/'or'"
'''

[[rules]]
id = "ward:python/anomalous-unicode-escape-in-string"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "coding"
presets = ["standard", "strict"]
body = '''
check = "text-pattern"
target = "strings"
kinds = ["STRING"]
pattern = "^[bB]['\"](?:[^\\\\]|\\\\.)*?\\\\[uU]"
message = "anomalous unicode escape in a byte string; use a raw or text string instead"
'''

