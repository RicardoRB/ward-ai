# Python structural rules. Each row is one rule; the body is read by the metric matcher in
# ward-analysis-engine. Grammar kinds are the ANTLR Python 3 rule names.

[[rules]]
id = "ward:python/function-length"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "complexity/size"
presets = ["standard", "strict"]
options.max = { type = "integer", min = 1 }
body = "measure=lines; node=funcdef; max=60; name=name; message=function {name} spans {value} lines, the limit is {max}"

[[rules]]
id = "ward:python/parameter-count"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "complexity/size"
presets = ["standard", "strict"]
options.max = { type = "integer", min = 0 }
body = "measure=parameters; node=funcdef; max=5; name=name; path=parameters/typedargslist/tfpdef; receivers=self,cls; message=function {name} has {value} parameters, the limit is {max}"

[[rules]]
id = "ward:python/complexity"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "complexity/metrics"
presets = ["standard", "strict"]
options.max = { type = "integer", min = 1 }
body = "measure=decision-points; node=funcdef; max=10; name=name; nested=funcdef,classdef,lambdef; decisions=if_stmt,while_stmt,for_stmt,except_clause,case_block,comp_for,comp_if,if_stmt>elif,and_test>and,or_test>or,test>if; message=function {name} has complexity {value}, the limit is {max}"

[[rules]]
id = "ward:python/file-length"
language = "python"
capability = "SYNTAX"
severity = "error"
category = "complexity/size"
presets = ["standard", "strict"]
options.max = { type = "integer", min = 1 }
body = "measure=lines; node=file_input; max=500; message=file has {value} lines, the limit is {max}"

[[rules]]
id = "ward:python/naming"
language = "python"
capability = "SYNTAX"
severity = "warning"
category = "naming"
presets = ["standard", "strict"]
body = "measure=identifier-case; node=funcdef:snake,classdef:cap,expr_stmt:snake-or-upper; name=name; message={name} should be {expected}"
