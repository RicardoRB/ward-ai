# Redirects whose target is argument 0: Flask and Django helpers and the Django and Starlette response classes.

[[sinks]]
kind = "call"
name = "redirect"
arguments = [0]

[[sinks]]
kind = "call"
name = "HttpResponseRedirect"
arguments = [0]

[[sinks]]
kind = "call"
name = "HttpResponsePermanentRedirect"
arguments = [0]

[[sinks]]
kind = "call"
name = "RedirectResponse"
arguments = [0]

[[sanitizers]]
kind = "call"
name = "int"

[[sanitizers]]
kind = "call"
name = "float"

[[sanitizers]]
kind = "call"
name = "bool"

[[sanitizers]]
kind = "call"
name = "quote"
receiver = "urllib.parse"

[[sanitizers]]
kind = "call"
name = "url_has_allowed_host_and_scheme"


# A value that these encode can only be a part of the query string, never the host.
[[sanitizers]]
kind = "call"
name = "quote_plus"

[[sanitizers]]
kind = "call"
name = "urlencode"

# The path of a route of the application itself, whatever its arguments are.
[[sanitizers]]
kind = "call"
name = "reverse"

[[sanitizers]]
kind = "call"
name = "url_for"

# A value that only follows a literal "?" is part of the query, never of the scheme, host or path.
[[sanitizers]]
kind = "query-part"
name = "?"
