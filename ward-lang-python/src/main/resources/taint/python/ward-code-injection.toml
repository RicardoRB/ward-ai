# Dynamic code execution (the builtins, written bare or as builtins.x; a method named exec is not one): the source text that eval and exec run, and the import of a computed module.

[[sinks]]
kind = "call"
name = "eval"
qualifier = "<none>"
arguments = [0]

[[sinks]]
kind = "call"
name = "eval"
qualifier = "builtins"
arguments = [0]

[[sinks]]
kind = "call"
name = "exec"
qualifier = "<none>"
arguments = [0]

[[sinks]]
kind = "call"
name = "exec"
qualifier = "builtins"
arguments = [0]

[[sinks]]
kind = "call"
name = "import_module"
receiver = "importlib"
arguments = [0]

[[sinks]]
kind = "call"
name = "__import__"
arguments = [0]

[[sanitizers]]
kind = "call"
name = "int"

[[sanitizers]]
kind = "call"
name = "float"

[[sanitizers]]
kind = "call"
name = "bool"

