# SQL text that a DB-API cursor or connection (PEP 249, sqlite3, Django's connection.cursor(), a SQLAlchemy
# connection or session), Django's raw SQL or SQLAlchemy text() runs, which is argument 0. A cursor has no declared
# type, so the methods match a receiver whose text names a cursor or a connection, as in cursor, self.cursor,
# conn.cursor(), cur, conn, connection, db or session; an execute of any other object (an executor, a pipeline, a
# command) is not SQL. A name assigned from a call to cursor or connect in the same body is a database handle, so its
# methods are sinks under any name (receiver database-handle). Parameter values are bound by the driver.

[[sinks]]
kind = "call"
name = "execute"
qualifier = "*cursor"
arguments = [0]

