graph <module>
B0 [variableStatement@1, functionDeclaration@3] -> B1
  d:flag c:flag
B1 [exit]

graph run
B0 [singleExpression@4] -> B4:true B3:false
  p:a r:a
B1 [exit]
B2 [expressionStatement@5] -> B3
  s:call work(0)
B3 [singleExpression@7] -> B6:true B5:false
  r:a
B4 [singleExpression@4] -> B2:true B3:false
  s:call check(0)
B5 [singleExpression@7] -> B6
  s:call check(0)
B6 [variableStatement@7, expressionStatement@8] -> B1
  s:call done(0)

