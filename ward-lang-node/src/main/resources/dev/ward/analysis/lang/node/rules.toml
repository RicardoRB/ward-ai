presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["ifStatement", "iterationStatement", "singleExpression"]
text = '^(if\((true|false|null|\d+|"[^"]*"|\x27[^\x27]*\x27)\)|while\((false|null|\d+|"[^"]*"|\x27[^\x27]*\x27)\)|(true|false|null|\d+)\?)'
message = "unexpected constant condition"
'''

