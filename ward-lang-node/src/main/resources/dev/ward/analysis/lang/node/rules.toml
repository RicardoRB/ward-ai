[[rules]]
id = "ward:typescript/valid-typeof"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "problem"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression"]
with-child = ["'==='", "'!=='", "'=='", "'!='"]
text = '^(typeof[\w$.]+(===|!==|==|!=)(?<q>["\x27])(?!(undefined|object|boolean|number|string|function|symbol|bigint)\k<q>)|(?<r>["\x27])(?!(undefined|object|boolean|number|string|function|symbol|bigint)\k<r>)[^"\x27]*\k<r>(===|!==|==|!=)typeof)'
message = "invalid typeof comparison value"
'''

