# Structural rules for TypeScript and JavaScript. Each rule runs on the shared syntax tree.
# Bodies hold the limit as max=<positive integer>; an empty body uses the ESLint core default.

[[rules]]
id = "ward:typescript/function-length"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "sizes"
presets = ["standard", "strict"]
options.max = { type = "integer", min = 1 }
