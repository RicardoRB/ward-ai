# SQL sinks of the Semgrep p/javascript rules: query text handed to a database client.
# shortcut: a sink matches the method name on any receiver, so a query call on an unrelated object is matched too. Knex builders are in semgrep-knex.toml.

[[sinks]]
kind = "call"
name = "query"
arguments = [0]

[[sinks]]
kind = "call"
name = "execute"
arguments = [0]

[[sanitizers]]
kind = "call"
name = "parseInt"

[[sanitizers]]
kind = "call"
name = "parseFloat"

[[sanitizers]]
kind = "call"
name = "Number"
