# XML sinks of the Semgrep p/javascript rules: untrusted XML text handed to a parser that may expand entities.
# shortcut: matches the parser method by name on any receiver, so a parse call on an unrelated object is matched too.

[[sinks]]
kind = "call"
name = "parse"
arguments = [0]

[[sinks]]
kind = "call"
name = "write"
arguments = [0]

[[sinks]]
kind = "call"
name = "toJson"
arguments = [0]

[[sinks]]
kind = "call"
name = "parseXml"
arguments = [0]

[[sinks]]
kind = "call"
name = "parseXmlString"
arguments = [0]
