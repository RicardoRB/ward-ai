# CORS sinks of the Semgrep p/javascript rules: a response header whose value is request-controlled.
# shortcut: matches any header name; the Semgrep rule restricts the name to the Access-Control headers.

[[sinks]]
kind = "call"
name = "set"
qualifier = "res"
arguments = [1]

[[sinks]]
kind = "call"
name = "header"
qualifier = "res"
arguments = [1]

[[sinks]]
kind = "call"
name = "setHeader"
qualifier = "res"
arguments = [1]

[[sinks]]
kind = "call"
name = "set"
qualifier = "response"
arguments = [1]

[[sinks]]
kind = "call"
name = "header"
qualifier = "response"
arguments = [1]

[[sinks]]
kind = "call"
name = "setHeader"
qualifier = "response"
arguments = [1]
