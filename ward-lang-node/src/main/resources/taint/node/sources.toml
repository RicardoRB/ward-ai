# Stored data: the rows that an ORM reads hold what users wrote into the database earlier, so a
# value read from a row is untrusted like a request member (a second-order flow). The names are the
# read methods of Sequelize (findByPk, findOne, findAll, findAndCountAll, findOrCreate), TypeORM
# (findOneBy, findBy, findOneOrFail, findOneByOrFail, findAndCount, findOne) and Prisma
# (findUnique, findFirst, findMany and their OrThrow forms); Mongoose shares findOne.

[[sources]]
kind = "call"
name = "findByPk"
assumed = "a row that an ORM reads is assumed to hold what a user stored"

