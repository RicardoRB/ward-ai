# Code-evaluation sinks of the Semgrep p/javascript rules: a string that the engine evaluates as code.
# shortcut: a sink matches by name, so an object's own eval-like method with the same name is matched too.

[[sinks]]
kind = "call"
name = "eval"
arguments = [0]

[[sinks]]
kind = "call"
name = "setTimeout"
arguments = [0]

[[sinks]]
kind = "call"
name = "setInterval"
arguments = [0]

[[sinks]]
kind = "call"
name = "<init>"
qualifier = "Function"
arguments = [0]
