# Response-header sinks of the Semgrep p/javascript rules: request-controlled text reaches a response header call.
# shortcut: matches any header name; the Semgrep rule restricts the name to X-Frame-Options.

[[sinks]]
kind = "call"
name = "set"
qualifier = "res"
arguments = [0, 1]

[[sinks]]
kind = "call"
name = "header"
qualifier = "res"
arguments = [0, 1]

[[sinks]]
kind = "call"
name = "setHeader"
qualifier = "res"
arguments = [0, 1]

[[sinks]]
kind = "call"
name = "set"
qualifier = "response"
arguments = [0, 1]

[[sinks]]
kind = "call"
name = "header"
qualifier = "response"
arguments = [0, 1]

[[sinks]]
kind = "call"
name = "setHeader"
qualifier = "response"
arguments = [0, 1]
