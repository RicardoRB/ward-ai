# HTML-string sinks of the Semgrep p/javascript rules: untrusted event data built into a string with util.format or concat.
# shortcut: the Semgrep rule matches the HTML-tag concatenation itself; here the string-building call is matched, and the tag is not checked.

[[sinks]]
kind = "call"
name = "format"
arguments = [0, 1, 2, 3]

[[sinks]]
kind = "call"
name = "concat"
arguments = [0]
