# Outbound request sinks of the Semgrep p/javascript rules: a server-side request to a request-controlled URL.
# shortcut: matches the request-library call by name and qualifier; a fetch call matches by name alone.

[[sinks]]
kind = "call"
name = "request"
qualifier = "request"
arguments = [0]

[[sinks]]
kind = "call"
name = "get"
qualifier = "request"
arguments = [0]

[[sinks]]
kind = "call"
name = "post"
qualifier = "request"
arguments = [0]

[[sinks]]
kind = "call"
name = "get"
qualifier = "axios"
arguments = [0]

[[sinks]]
kind = "call"
name = "post"
qualifier = "axios"
arguments = [0]

[[sinks]]
kind = "call"
name = "fetch"
arguments = [0]
