# Lambda sources of the Semgrep p/javascript rules: fields of the event that an AWS Lambda handler receives.
# shortcut: matches the event's members by the name event, not by its parameter type.

[[sources]]
kind = "member"
name = "body"
qualifier = "event"

[[sources]]
kind = "member"
name = "queryStringParameters"
qualifier = "event"

[[sources]]
kind = "member"
name = "pathParameters"
qualifier = "event"

[[sources]]
kind = "member"
name = "headers"
qualifier = "event"

[[sources]]
kind = "member"
name = "multiValueQueryStringParameters"
qualifier = "event"
