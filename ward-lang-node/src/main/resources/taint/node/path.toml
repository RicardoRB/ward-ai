# File path sinks: fs and fs/promises functions open the path they are given, as argument 0.
# path.join and path.resolve are not sinks: they keep the untrusted segment in the result.

[[sinks]]
kind = "call"
name = "readFile"
receiver = "fs"
arguments = [0]

