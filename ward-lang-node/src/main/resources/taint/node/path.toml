# basename keeps only the last segment of a path.
[[sanitizers]]
kind = "call"
name = "basename"
receiver = "path"

# Numeric conversions cannot carry markup or a path separator.

[[sanitizers]]
kind = "call"
name = "Number"

[[sanitizers]]
