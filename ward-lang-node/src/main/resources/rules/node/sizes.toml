# Structural rules of the "sizes" category for TypeScript and JavaScript. Each rule runs on the shared syntax tree.

[[rules]]
id = "ward:typescript/function-length"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "complexity"
presets = ["standard", "strict"]
options.max = { type = "integer", min = 1 }
body = ""

