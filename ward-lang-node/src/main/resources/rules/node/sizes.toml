[[rules]]
id = "ward:typescript/line-length"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "complexity"
presets = ["standard", "strict"]
body = '''
check = "text-pattern"
target = "lines"
pattern = "^.{101,}$"
message = "line is longer than 100 characters"
'''

