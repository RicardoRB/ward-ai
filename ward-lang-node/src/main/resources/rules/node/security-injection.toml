# Injection rules for JavaScript and TypeScript: untrusted input from a request reaches a sensitive call within one function.
# Each follows the taint specifications taint/node/ward-<weakness>.toml and taint/node/sources.toml.

[[rules]]
id = "ward:javascript/sql-injection"
language = "JAVASCRIPT"
capability = "DATAFLOW"
severity = "ERROR"
category = "security"
presets = ["standard", "strict"]
body = '''
check = "taint"
specs = ["taint/node/sources.toml", "taint/node/ward-sql-injection.toml"]
message = "untrusted data from {source} is part of the SQL text of {sink}; pass it as a bound parameter instead"
'''

[[rules]]
id = "ward:typescript/sql-injection"
language = "TYPESCRIPT"
capability = "DATAFLOW"
severity = "ERROR"
category = "security"
presets = ["standard", "strict"]
body = '''
check = "taint"
specs = ["taint/node/sources.toml", "taint/node/ward-sql-injection.toml"]
message = "untrusted data from {source} is part of the SQL text of {sink}; pass it as a bound parameter instead"
'''

[[rules]]
id = "ward:javascript/nosql-injection"
language = "JAVASCRIPT"
