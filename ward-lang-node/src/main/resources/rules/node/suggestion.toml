language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "suggestion"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["tryStatement"]
text = '^(?!.*finally)[\s\S]*catch\(([\w$]+)\)\{throw\1;?\}$'
message = "unnecessary try/catch wraps the block"
'''

