# ESLint core rules of type "suggestion" (#326). Node text has no whitespace: match tokens, not spaces.

[[rules]]
id = "ward:typescript/require-await"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "style"
presets = ["standard", "strict"]
body = '''
check = "required-node"
kinds = ["functionDeclaration>'async'", "arrowFunctionDeclaration>'async'", "propertyMemberDeclaration>propertyMemberBase>'async'"]
descendant = ["'await'"]
skip = ["functionDeclaration", "anonymousFunction", "arrowFunctionDeclaration"]
message = "async function has no 'await' expression"
'''

[[rules]]
id = "ward:javascript/require-await"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "style"
presets = ["standard", "strict"]
body = '''
check = "required-node"
kinds = ["functionDeclaration>'async'", "anonymousFunction>'async'", "arrowFunctionDeclaration>'async'", "methodDefinition>'async'"]
descendant = ["'await'"]
skip = ["functionDeclaration", "anonymousFunction", "arrowFunctionDeclaration"]
message = "async function has no 'await' expression"
'''

[[rules]]
id = "ward:typescript/no-unused-labels"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "style"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["labelledStatement"]
text = '^(\w+):(?![\s\S]*(?:break|continue)\1(?![\w$]))'
message = "label is defined but never used"
'''

