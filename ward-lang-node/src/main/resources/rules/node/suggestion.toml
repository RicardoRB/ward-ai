# Structural rules of the "suggestion" category for TypeScript and JavaScript. Each rule runs on the shared syntax tree.

[[rules]]
id = "ward:typescript/no-with"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "suggestion"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["withStatement"]
message = "unexpected use of with statement"
'''

