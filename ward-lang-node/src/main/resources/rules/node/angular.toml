# angular-eslint rules of TypeScript (tsRecommended, standard preset) for issue #328. Defaults are from
# @angular-eslint 22.6.0. Each body runs the decorated-class check (see DecoratedClassCheck).

[[rules]]
id = "ward:typescript/contextual-lifecycle"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "angular"
presets = ["standard", "strict"]
body = '''
check = "node-decorated-class"
kinds = ["propertyName"]
parent = ["propertyMemberDeclaration"]
member-has = ["callSignature"]
classes = { '^@(Component|Directive)\b' = '^ngDoBootstrap$', '^@(Injectable|Pipe|Service)\b' = '^ng(AfterContentChecked|AfterContentInit|AfterViewChecked|AfterViewInit|DoBootstrap|DoCheck|OnChanges|OnInit)$', '^@NgModule\b' = '^ng(AfterContentChecked|AfterContentInit|AfterViewChecked|AfterViewInit|DoCheck|OnChanges|OnDestroy|OnInit)$' }
message = "angular does not call this lifecycle method in this kind of class"
'''

[[rules]]
id = "ward:typescript/no-empty-lifecycle-method"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "angular"
presets = ["standard", "strict"]
body = '''
check = "node-decorated-class"
kinds = ["propertyMemberDeclaration"]
class-decorator = '^@(Component|Directive|Injectable|NgModule|Pipe|Service)\b'
member-has = ["callSignature"]
text = '^(?:public|protected|private|static|async|override|readonly|abstract)*ng(?:AfterContentChecked|AfterContentInit|AfterViewChecked|AfterViewInit|DoBootstrap|DoCheck|OnChanges|OnDestroy|OnInit)\(.*\{\}$'
message = "lifecycle method is empty; remove it"
'''

[[rules]]
id = "ward:typescript/no-input-rename"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "angular"
presets = ["standard", "strict"]
options.allowed-names = { type = "string-list" }
body = '''
check = "node-decorated-class"
kinds = ["decorator"]
parent = ["decoratorList"]
alias = "^@Input\\((?:['\"]|\\{alias:['\"])([^'\"]*)"
allowed-names = []
aria = true
message = "input binding should not be aliased"
'''

[[rules]]
id = "ward:typescript/no-inputs-metadata-property"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "angular"
presets = ["standard", "strict"]
body = '''
check = "node-decorated-class"
kinds = ["propertyAssignment"]
class-decorator = '^@(Component|Directive)\b'
text = '^inputs:'
in-class-decorator = true
not-inside-text = '^hostDirectives:'
message = "use @Input rather than the inputs metadata property"
'''

