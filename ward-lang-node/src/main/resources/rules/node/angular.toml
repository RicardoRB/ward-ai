[[rules]]
id = "ward:typescript/no-output-on-prefix"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "angular"
presets = ["standard", "strict"]
body = '''
check = "node-decorated-class"
kinds = ["propertyName", "decorator"]
member-decorator = '^@Output\b'
text = "^on(?:[^a-z]|$)|^@Output\\((?:['\"]on(?:[^a-z]|$)|\\{alias:['\"]on(?:[^a-z]|$))"
message = "output binding should not be named 'on' or prefixed with it"
'''

[[rules]]
id = "ward:typescript/no-output-rename"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "angular"
presets = ["standard", "strict"]
body = '''
check = "node-decorated-class"
kinds = ["decorator"]
parent = ["decoratorList"]
alias = "^@Output\\((?:['\"]|\\{alias:['\"])([^'\"]*)"
message = "output binding should not be aliased"
'''

[[rules]]
id = "ward:typescript/no-outputs-metadata-property"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "angular"
presets = ["standard", "strict"]
body = '''
check = "node-decorated-class"
kinds = ["propertyAssignment"]
class-decorator = '^@(Component|Directive)\b'
text = '^outputs:'
in-class-decorator = true
not-inside-text = '^hostDirectives:'
message = "use @Output rather than the outputs metadata property"
'''

[[rules]]
id = "ward:typescript/prefer-inject"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "angular"
presets = ["standard", "strict"]
body = '''
check = "node-decorated-class"
kinds = ["formalParameterArg"]
class-decorator = '^@(Component|Directive|Injectable|Pipe|Service)\b'
inside = ["constructorDeclaration"]
not-child = ["accessibilityModifier"]
text = "^(?!@(?:Inject|Optional|Self|SkipSelf|Host)\\()[^:]*:(?!(?:string|number|boolean|bigint|symbol|any|unknown)(?:=.*)?$)"
message = "inject the dependency with inject() rather than a constructor parameter"
'''

[[rules]]
id = "ward:typescript/prefer-on-push-component-change-detection"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "angular"
presets = ["standard", "strict"]
options.allow-explicit-on-push = { type = "boolean" }
body = '''
check = "node-decorated-class"
kinds = ["propertyAssignment"]
class-decorator = '^@Component\b'
in-class-decorator = true
text = '^changeDetection:ChangeDetectionStrategy\.'
exempt = '^changeDetection:ChangeDetectionStrategy\.OnPush$'
exempt-when = "allow-explicit-on-push"
allow-explicit-on-push = true
message = "change detection setting is redundant or opts out of OnPush"
'''

[[rules]]
id = "ward:typescript/prefer-standalone"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "angular"
presets = ["standard", "strict"]
options.allow-explicit-standalone = { type = "boolean" }
body = '''
check = "node-decorated-class"
kinds = ["propertyAssignment"]
class-decorator = '^@(Component|Directive|Pipe)\b'
in-class-decorator = true
text = '^standalone:'
exempt = '^standalone:true$'
exempt-when = "allow-explicit-standalone"
allow-explicit-standalone = true
message = "components, directives and pipes are standalone by default"
'''

[[rules]]
id = "ward:typescript/use-lifecycle-interface"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "WARNING"
category = "angular"
presets = ["standard", "strict"]
body = '''
check = "node-decorated-class"
kinds = ["propertyName"]
parent = ["propertyMemberDeclaration"]
class-decorator = '^@(Component|Directive|Injectable|NgModule|Pipe|Service)\b'
member-has = ["callSignature"]
member-not-text = '^(?:public|protected|private|static|async|readonly|abstract)*override(?=ng)'
heritage-missing = { ngAfterContentChecked = "AfterContentChecked", ngAfterContentInit = "AfterContentInit", ngAfterViewChecked = "AfterViewChecked", ngAfterViewInit = "AfterViewInit", ngDoBootstrap = "DoBootstrap", ngDoCheck = "DoCheck", ngOnChanges = "OnChanges", ngOnDestroy = "OnDestroy", ngOnInit = "OnInit" }
message = "class does not implement the lifecycle interface of this method"
'''

[[rules]]
id = "ward:typescript/use-pipe-transform-interface"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "angular"
presets = ["standard", "strict"]
body = '''
check = "node-decorated-class"
kinds = ["identifier"]
parent = ["classDeclaration"]
class-decorator = '^@Pipe\b'
implements-not = "PipeTransform"
message = "pipes should implement the PipeTransform interface"
'''
