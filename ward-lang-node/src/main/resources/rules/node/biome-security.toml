# Biome rules of the security group for TypeScript and JavaScript (catalog rows of #329).

[[rules]]
id = "ward:javascript/no-blank-target"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "security"
presets = ["standard", "strict"]
options.allow-domains = { type = "string-list" }
options.allow-no-referrer = { type = "boolean" }
body = '''
allow-domains = []
allow-no-referrer = true
check = "node-jsx-blank-target"
message = "avoid target=\"_blank\" without rel=\"noopener\"; the opened page could reach window.opener"
'''

[[rules]]
id = "ward:javascript/no-dangerously-set-inner-html"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "security"
presets = ["strict"]
body = '''
check = "forbidden-node"
kinds = ["jsxAttribute"]
text = '^dangerouslySetInnerHTML(?:=|$)'
message = "avoid the dangerouslySetInnerHTML prop; it injects unescaped HTML"
'''
