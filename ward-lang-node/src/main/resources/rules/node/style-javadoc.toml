'''


[[rules]]
id = "ward:typescript/multiline-comment-leading-asterisk-presence"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "misc"
presets = ["standard", "strict"]
body = '''
check = "text-pattern"
target = "comments"
pattern = '^/\*(?!\*)[^\n]*\n(?:[^\n]*\n)*?[ \t]*[^ \t*\n/]'
message = "comment line does not start with a leading asterisk"
'''


[[rules]]
id = "ward:javascript/multiline-comment-leading-asterisk-presence"
language = "JAVASCRIPT"
capability = "SYNTAX"
