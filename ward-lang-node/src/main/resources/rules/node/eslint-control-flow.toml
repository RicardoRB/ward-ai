[[rules]]
id = "ward:typescript/no-constant-binary-expression"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "problem"
presets = ["standard", "strict"]
body = '''
check = "node-no-constant-binary-expression"
operand-message = "Unexpected constant binary expression. Compares constantly with the other side of the operator."
short-circuit-message = "Unexpected constant truthiness or nullishness on the left-hand side of a short-circuit expression."
'''

