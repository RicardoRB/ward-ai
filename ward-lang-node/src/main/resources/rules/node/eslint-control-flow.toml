[[rules]]
id = "ward:typescript/no-unsafe-optional-chaining"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "problem"
presets = ["standard", "strict"]
options.disallow-arithmetic-operators = { type = "boolean" }
body = '''
check = "node-no-unsafe-optional-chaining"
disallow-arithmetic-operators = false
message = "Unsafe usage of optional chaining. If it short-circuits with 'undefined' the evaluation will throw TypeError."
arithmetic-message = "Unsafe arithmetic operation on optional chaining. It can result in NaN."
'''

[[rules]]
id = "ward:javascript/no-unsafe-optional-chaining"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "problem"
presets = ["standard", "strict"]
options.disallow-arithmetic-operators = { type = "boolean" }
body = '''
check = "node-no-unsafe-optional-chaining"
disallow-arithmetic-operators = false
message = "Unsafe usage of optional chaining. If it short-circuits with 'undefined' the evaluation will throw TypeError."
arithmetic-message = "Unsafe arithmetic operation on optional chaining. It can result in NaN."
'''

