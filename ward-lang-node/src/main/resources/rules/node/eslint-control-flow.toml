[[rules]]
id = "ward:typescript/preserve-caught-error"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "suggestion"
presets = ["standard", "strict"]
options.require-catch-parameter = { type = "boolean" }
body = '''
check = "node-preserve-caught-error"
require-catch-parameter = false
missing-cause-message = "There is no `cause` attached to the symptom error being thrown."
partial-message = "The caught error is destructured, so the error it holds is lost."
missing-parameter-message = "The caught error is not named, so no cause can be attached to the error being thrown."
incorrect-cause-message = "The symptom error is being thrown with an incorrect `cause`."
'''

