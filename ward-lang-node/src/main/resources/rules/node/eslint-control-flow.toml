[[rules]]
id = "ward:javascript/no-unexpected-multiline"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "problem"
presets = ["standard", "strict"]
body = '''
check = "node-no-unexpected-multiline"
'''
