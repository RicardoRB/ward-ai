# Control-flow rules of the ESLint core rules (issue #326), for TypeScript and JavaScript.

[[rules]]
id = "ward:typescript/no-constructor-return"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "problem"
presets = ["standard", "strict"]
body = '''
check = "node-no-constructor-return"
message = "unexpected return value from constructor"
'''

[[rules]]
id = "ward:javascript/no-constructor-return"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "problem"
presets = ["standard", "strict"]
body = '''
check = "node-no-constructor-return"
message = "unexpected return value from constructor"
'''

