[[rules]]
id = "ward:typescript/no-redeclare"
language = "TYPESCRIPT"
capability = "SCOPES"
severity = "ERROR"
category = "suggestion"
presets = ["standard", "strict"]
options.builtin-globals = { type = "boolean" }
body = '''
check = "node-no-redeclare"
builtin-globals = true
env = ["es2024", "browser", "node"]
message = "'{value}' is already defined."
builtin-message = "'{value}' is already defined as a built-in global variable."
'''

