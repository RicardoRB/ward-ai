[[rules]]
id = "ward:typescript/no-use-before-define"
language = "TYPESCRIPT"
capability = "SCOPES"
severity = "ERROR"
category = "problem"
presets = ["standard", "strict"]
options.functions = { type = "boolean" }
options.classes = { type = "boolean" }
options.variables = { type = "boolean" }
options.allow-named-exports = { type = "boolean" }
options.enums = { type = "boolean" }
options.typedefs = { type = "boolean" }
options.ignore-type-references = { type = "boolean" }
body = '''
check = "node-no-use-before-define"
functions = true
classes = true
variables = true
allow-named-exports = false
enums = true
typedefs = true
ignore-type-references = true
message = "'{value}' was used before it was defined."
'''

