# typescript-eslint rules that read the native type facts of TypeScript: the rule runs only when the resolver answers, and reports nothing for an unknown type.

[[rules]]
id = "ward:typescript/await-thenable"
language = "TYPESCRIPT"
capability = "TYPES"
severity = "ERROR"
category = "correctness/types"
presets = ["standard", "strict"]
options.allow-mixed-promise-arrays = { type = "boolean" }
body = '''
check = "node-await-thenable"
allow-mixed-promise-arrays = false
message = "await has no effect on a value that is not a promise"
'''

[[rules]]
id = "ward:typescript/no-for-in-array"
language = "TYPESCRIPT"
capability = "TYPES"
severity = "ERROR"
category = "correctness/types"
presets = ["standard", "strict"]
body = '''
check = "node-no-for-in-array"
message = "for-in loop over an array visits index strings; use for-of or an index loop"
'''

[[rules]]
id = "ward:typescript/no-array-delete"
language = "TYPESCRIPT"
capability = "TYPES"
severity = "ERROR"
category = "correctness/types"
presets = ["standard", "strict"]
body = '''
check = "node-no-array-delete"
message = "delete leaves a hole in the array; use splice to remove the element"
'''

[[rules]]
id = "ward:typescript/no-floating-promises"
language = "TYPESCRIPT"
capability = "TYPES"
severity = "ERROR"
category = "correctness/types"
presets = ["standard", "strict"]
options.ignore-void = { type = "boolean" }
options.ignore-iife = { type = "boolean" }
body = '''
check = "node-no-floating-promises"
ignore-void = true
ignore-iife = false
message = "promise is neither awaited, returned, nor handled with catch"
'''

[[rules]]
id = "ward:typescript/no-misused-promises"
language = "TYPESCRIPT"
capability = "TYPES"
severity = "ERROR"
category = "correctness/types"
presets = ["standard", "strict"]
options.checks-conditionals = { type = "boolean" }
options.checks-spreads = { type = "boolean" }
options.checks-void-return = { type = "boolean" }
body = '''
check = "node-no-misused-promises"
checks-conditionals = true
checks-spreads = true
checks-void-return = true
message = "promise where a value is expected; await it or handle its result"
'''

[[rules]]
id = "ward:typescript/only-throw-error"
language = "TYPESCRIPT"
capability = "TYPES"
severity = "ERROR"
category = "correctness/types"
presets = ["standard", "strict"]
options.allow = { type = "string-list" }
options.allow-rethrowing = { type = "boolean" }
options.allow-throwing-any = { type = "boolean" }
options.allow-throwing-unknown = { type = "boolean" }
body = '''
check = "node-only-throw-error"
allow = []
allow-rethrowing = true
allow-throwing-any = true
allow-throwing-unknown = true
message = "throw an Error object, not a value of this type"
'''

[[rules]]
id = "ward:typescript/no-unsafe-assignment"
language = "TYPESCRIPT"
capability = "TYPES"
severity = "ERROR"
category = "correctness/types"
presets = ["standard", "strict"]
body = '''
check = "node-no-unsafe-assignment"
message = "unsafe assignment of an any value to a typed variable"
'''

[[rules]]
id = "ward:typescript/no-unsafe-call"
language = "TYPESCRIPT"
capability = "TYPES"
severity = "ERROR"
category = "correctness/types"
presets = ["standard", "strict"]
body = '''
check = "node-no-unsafe-call"
message = "unsafe call of an any value"
'''

[[rules]]
id = "ward:typescript/no-unsafe-member-access"
language = "TYPESCRIPT"
capability = "TYPES"
severity = "ERROR"
category = "correctness/types"
presets = ["standard", "strict"]
body = '''
check = "node-no-unsafe-member-access"
message = "unsafe member access on an any value"
'''

[[rules]]
id = "ward:typescript/no-unsafe-return"
language = "TYPESCRIPT"
capability = "TYPES"
severity = "ERROR"
category = "correctness/types"
presets = ["standard", "strict"]
body = '''
check = "node-no-unsafe-return"
message = "unsafe return of an any value"
'''

[[rules]]
id = "ward:typescript/no-unsafe-argument"
language = "TYPESCRIPT"
capability = "TYPES"
severity = "ERROR"
category = "correctness/types"
presets = ["standard", "strict"]
body = '''
check = "node-no-unsafe-argument"
message = "unsafe argument of type any"
'''

[[rules]]
id = "ward:typescript/no-unsafe-unary-minus"
language = "TYPESCRIPT"
capability = "TYPES"
severity = "ERROR"
category = "correctness/types"
presets = ["standard", "strict"]
body = '''
check = "node-no-unsafe-unary-minus"
message = "unsafe unary minus on an any value"
'''

[[rules]]
id = "ward:typescript/restrict-plus-operands"
language = "TYPESCRIPT"
capability = "TYPES"
severity = "ERROR"
category = "correctness/types"
presets = ["standard", "strict"]
options.allow-any = { type = "boolean" }
options.allow-boolean = { type = "boolean" }
options.allow-nullish = { type = "boolean" }
options.allow-number-and-string = { type = "boolean" }
options.allow-regexp = { type = "boolean" }
options.skip-compound-assignments = { type = "boolean" }
body = '''
check = "node-restrict-plus-operands"
allow-any = true
allow-boolean = true
allow-nullish = true
allow-number-and-string = true
allow-regexp = true
skip-compound-assignments = false
message = "operands of + must be primitive values of compatible types"
'''

[[rules]]
id = "ward:typescript/restrict-template-expressions"
language = "TYPESCRIPT"
capability = "TYPES"
severity = "ERROR"
category = "correctness/types"
presets = ["standard", "strict"]
options.allow = { type = "string-list" }
options.allow-any = { type = "boolean" }
options.allow-array = { type = "boolean" }
options.allow-boolean = { type = "boolean" }
options.allow-nullish = { type = "boolean" }
options.allow-number = { type = "boolean" }
options.allow-regexp = { type = "boolean" }
options.allow-never = { type = "boolean" }
body = '''
check = "node-restrict-template-expressions"
allow = ["Error", "URL", "URLSearchParams"]
allow-any = true
allow-array = false
allow-boolean = true
allow-nullish = true
allow-number = true
allow-regexp = true
allow-never = false
message = "template placeholder must be a string, a number or another allowed value"
'''

[[rules]]
id = "ward:typescript/no-unnecessary-type-assertion"
language = "TYPESCRIPT"
capability = "TYPES"
severity = "ERROR"
category = "style/suggestions"
presets = ["standard", "strict"]
body = '''
check = "node-no-unnecessary-type-assertion"
message = "this assertion does not change the type of the expression"
'''

[[rules]]
id = "ward:typescript/unbound-method"
language = "TYPESCRIPT"
capability = "TYPES"
severity = "ERROR"
category = "correctness/types"
presets = ["standard", "strict"]
body = '''
check = "node-unbound-method"
message = "method is read without being called, so it loses its object as this; call it or bind it"
'''

[[rules]]
id = "ward:typescript/no-base-to-string"
language = "TYPESCRIPT"
capability = "TYPES"
severity = "ERROR"
category = "style/suggestions"
presets = ["standard", "strict"]
body = '''
check = "node-no-base-to-string"
message = "object does not declare its own toString and prints as [object Object]"
'''

[[rules]]
id = "ward:typescript/no-unsafe-enum-comparison"
language = "TYPESCRIPT"
capability = "TYPES"
severity = "ERROR"
category = "style/suggestions"
presets = ["standard", "strict"]
body = '''
check = "node-no-unsafe-enum-comparison"
message = "comparison of an enum value with a value of another type"
'''
