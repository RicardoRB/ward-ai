[[rules]]
id = "ward:javascript/no-empty-pattern"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "problem"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["objectLiteral", "arrayLiteral"]
parent = ["assignable"]
text = '^(\{\}|\[\])$'
