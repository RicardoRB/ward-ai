[[rules]]
id = "ward:javascript/no-dupe-args"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "problem"
presets = ["standard", "strict"]
body = '''
check = "duplicate"
kinds = ["formalParameterList"]
items = ["formalParameterArg"]
key = "assignable"
message = "duplicate parameter '{value}'"
'''
