[[rules]]
id = "ward:typescript/for-direction"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "problem"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["iterationStatement"]
text = '^for\((?:var|let|const)?(?<v>\w+)(?:=[^;]*)?;\k<v>(?:<|<=)[^;]*;(?:\k<v>--|--\k<v>|\k<v>-=\d+)\)|^for\((?:var|let|const)?(?<w>\w+)(?:=[^;]*)?;\k<w>(?:>|>=)[^;]*;(?:\k<w>\+\+|\+\+\k<w>|\k<w>\+=\d+)\)'
message = "the loop counter moves away from its limit"
'''

[[rules]]
id = "ward:typescript/no-case-declarations"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "suggestion"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["variableStatement", "classDeclaration", "functionDeclaration"]
parent-path = "statement>statementList>caseClause|defaultClause"
text = '^(let|const|class|function|async)'
message = "lexical declaration in a case clause; wrap the clause in a block"
'''

[[rules]]
id = "ward:typescript/no-empty-pattern"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "problem"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["objectLiteral", "arrayLiteral"]
parent = ["variableDeclaration", "bindingPattern"]
text = '^(\{\}|\[\])$'
message = "unexpected empty destructuring pattern"
'''

[[rules]]
id = "ward:typescript/no-dupe-args"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "problem"
presets = ["standard", "strict"]
body = '''
check = "duplicate"
kinds = ["parameterList"]
items = ["parameter"]
key = "identifierOrPattern"
message = "duplicate parameter '{value}'"
'''

[[rules]]
