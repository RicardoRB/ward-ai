text = '^for\((?:var|let|const)?(?<v>\w+)(?:=[^;]*)?;\k<v>(?:<|<=)[^;]*;(?:\k<v>--|--\k<v>|\k<v>-=\d+)\)|^for\((?:var|let|const)?(?<w>\w+)(?:=[^;]*)?;\k<w>(?:>|>=)[^;]*;(?:\k<w>\+\+|\+\+\k<w>|\k<w>\+=\d+)\)'
message = "the loop counter moves away from its limit"
'''

[[rules]]
id = "ward:javascript/no-case-declarations"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "suggestion"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["variableStatement", "classDeclaration", "functionDeclaration"]
parent-path = "statement>statementList>caseClause|defaultClause"
text = '^(let|const|class|function|async)'
message = "lexical declaration in a case clause; wrap the clause in a block"
