[[rules]]
id = "ward:javascript/weak-cipher"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "security"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression"]
text = '^(?:\w+\.)?create(?:Cipher|Cipheriv|Decipher|Decipheriv)\([\"\x27`](?i:des|des-[\w-]+|des3|rc2|rc2-[\w-]+|rc4|rc4-[\w-]+|bf|bf-[\w-]+|blowfish)[\"\x27`],(?:[^()]|\([^()]*\))*\)$'
message = "DES, 3DES, RC2, RC4 and Blowfish are broken or too weak; use aes-256-gcm"
'''

