message = "an RSA key of 1536 bits or fewer is too short; use at least 2048 bits"
'''

[[rules]]
id = "ward:javascript/insecure-random"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "WARNING"
category = "security"
presets = ["strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression"]
text = '^Math\.random\(\)$'
message = "Math.random is predictable; use crypto.randomBytes or crypto.randomUUID for tokens, keys and identifiers"
'''

