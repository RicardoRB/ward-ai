[[rules]]
id = "ward:javascript/static-iv"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "security"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression"]
text = '^(?:\w+\.)?create(?:Cipheriv|Decipheriv)\(.*,(?:"[^"]*"|\x27[^\x27]*\x27|Buffer\.alloc\(\d+\)|Buffer\.from\([\"\x27`][^"\x27]*[\"\x27`](?:,[\"\x27`]\w+[\"\x27`])?\))(?:,\{[^{}]*\})?\)$'
message = "a fixed initialization vector repeats across messages and leaks patterns; use crypto.randomBytes for each message"
'''

[[rules]]
id = "ward:typescript/static-iv"
