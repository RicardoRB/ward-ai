[[rules]]
id = "ward:javascript/insecure-random"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "WARNING"
category = "security"
presets = ["strict"]
body = '''
check = "forbidden-node"
kinds = ["variableDeclaration", "propertyAssignment", "functionDeclaration", "methodDefinition", "fieldDefinition", "singleExpression"]
text = '(?s)^(?:\w+\s+|\*\s*)*[\w$.]*(?:(?i:token|secret|passw(?:or)?d|salt|nonce|session|csrf|uuid)|[Kk]ey(?![a-z])|KEY|(?:\bid|[a-z0-9]Id|_id|[a-z]ID)(?![a-z]))[\w$]*\s*[=:(].*?Math\.random\(\)'
message = "Math.random is predictable and this name holds a token, key, secret, salt, session or identifier; use crypto.randomBytes or crypto.randomUUID"
'''

[[rules]]
id = "ward:typescript/insecure-random"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "WARNING"
category = "security"
presets = ["strict"]
body = '''
check = "forbidden-node"
kinds = ["variableDeclaration", "propertyAssignment", "functionDeclaration", "propertyMemberDeclaration", "singleExpression"]
text = '(?s)^(?:\w+\s+|\*\s*)*[\w$.]*(?:(?i:token|secret|passw(?:or)?d|salt|nonce|session|csrf|uuid)|[Kk]ey(?![a-z])|KEY|(?:\bid|[a-z0-9]Id|_id|[a-z]ID)(?![a-z]))[\w$]*\s*[=:(].*?Math\.random\(\)'
message = "Math.random is predictable and this name holds a token, key, secret, salt, session or identifier; use crypto.randomBytes or crypto.randomUUID"
'''

[[rules]]
id = "ward:javascript/unfinished-aead"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "WARNING"
category = "security"
presets = ["strict"]
body = '''
check = "forbidden-node"
kinds = ["functionBody"]
text = '^(?!.*\.final\()(?!.*return(?:\w+\.)?create)(?=.*\.update\().*\bcreate(?:Cipheriv|Decipheriv)\([\"\x27`][\w-]*(?i:-gcm|-ccm|-ocb|chacha20-poly1305)[\"\x27`]'
message = "this authenticated cipher is never finished: the authentication tag is checked only by final(), so call it and handle its error"
'''

[[rules]]
id = "ward:javascript/weak-gcm-tag-length"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "security"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression"]
text = '^(?:\w+\.)?create(?:Cipheriv|Decipheriv)\([\"\x27`][\w-]*-gcm[\"\x27`],.*\bauthTagLength:(?:[0-9]|1[01])\b.*\)$|^(?:\w+\.)?createDecipheriv\([\"\x27`][\w-]*-gcm[\"\x27`],(?:[^,(){}]|\([^()]*\))+,(?:[^,(){}]|\([^()]*\))+(?:,\{(?:(?!authTagLength)[^{}])*\})?\)$'
message = "a GCM tag shorter than 12 bytes, or a decipher that accepts any length, makes forgery cheap; pass authTagLength: 16"
'''

[[rules]]
id = "ward:javascript/weak-argon2-parameters"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "security"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression"]
text = '^(?:\w+\.)?argon2\.hash\(.*,\{[^{}]*(?:\bmemoryCost:(?:\d{1,4}|1[0-8]\d{3}|19[0-3]\d{2}|194[0-4]\d|1945[0-5]|2\*\*(?:\d|1[0-3]))(?![\d*])|\btimeCost:[01]\b)[^{}]*\}\)$'
message = "these Argon2 parameters are too cheap to slow password guessing; use at least 19456 KiB of memory and a timeCost of 2"
'''

