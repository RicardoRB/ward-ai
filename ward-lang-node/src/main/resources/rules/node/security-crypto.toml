[[rules]]
id = "ward:javascript/weak-key-size"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "security"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression"]
text = '^(?:\w+\.)?generateKeyPair(?:Sync)?\([\"\x27`]rsa[\"\x27`],\{[^{}]*modulusLength:(?:512|768|1024|1536)\b[^{}]*\}(?:,(?:[^()]|\([^()]*\))*)?\)$'
message = "an RSA key of 1536 bits or fewer is too short; use at least 2048 bits"
'''

