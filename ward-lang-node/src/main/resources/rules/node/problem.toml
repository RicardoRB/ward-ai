# Structural rules of the "problem" category for TypeScript and JavaScript. Each rule runs on the shared syntax tree.

[[rules]]
id = "ward:typescript/no-debugger"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "problem"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["debuggerStatement"]
message = "unexpected debugger statement"
'''

[[rules]]
id = "ward:javascript/no-debugger"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "problem"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["debuggerStatement"]
message = "unexpected debugger statement"
'''

[[rules]]
id = "ward:typescript/no-async-promise-executor"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "problem"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression"]
with-child = ["'new'"]
text = '^newPromise\(async(\(|function)'
message = "promise executor must not be an async function"
'''

[[rules]]
id = "ward:javascript/no-async-promise-executor"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "problem"
presets = ["standard", "strict"]
