[[rules]]
id = "ward:typescript/use-isnan"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "problem"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression"]
with-child = ["'==='", "'!=='", "'=='", "'!='", "'<='", "'>='", "'<'", "'>'"]
text = '^(Number\.)?NaN(===|!==|==|!=|<=|>=|<|>)|(===|!==|==|!=|<=|>=|<|>)(Number\.)?NaN$'
