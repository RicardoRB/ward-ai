language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "problem"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["elementList"]
text = '^(,|[^\x22\x27\x60\[\]]*?,,)'
message = "unexpected comma in middle of array"
'''

