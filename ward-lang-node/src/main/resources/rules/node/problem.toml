[[rules]]
id = "ward:typescript/no-prototype-builtins"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "problem"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression"]
with-child = ["arguments"]
text = '^[\w$.]+\.(hasOwnProperty|isPrototypeOf|propertyIsEnumerable)\('
message = "do not call Object.prototype methods directly on an object"
'''

