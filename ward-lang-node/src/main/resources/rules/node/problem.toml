kinds = ["singleExpression"]
with-child = ["'new'"]
text = '^newPromise\(async(\(|function)'
message = "promise executor must not be an async function"
'''

[[rules]]
id = "ward:typescript/no-compare-neg-zero"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "problem"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression"]
with-child = ["'==='", "'!=='", "'=='", "'!='", "'<='", "'>='", "'<'", "'>'"]
text = '-0$'
message = "do not compare against -0"
'''

[[rules]]
id = "ward:javascript/no-compare-neg-zero"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
