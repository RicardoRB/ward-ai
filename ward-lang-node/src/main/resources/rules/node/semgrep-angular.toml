# AngularJS rules of the Semgrep p/javascript pack: untrusted text in an element, and trust bypasses of $sce and DomSanitizer.
# Each rule is a taint check from request or browser data to the sink; upstream rule ids are in catalog/semgrep.toml.

[[rules]]
id = "ward:javascript/detect-angular-element-taint"
language = "JAVASCRIPT"
capability = "DATAFLOW"
severity = "WARNING"
category = "security"
presets = ["standard", "strict"]
body = '''
check = "taint"
specs = ["taint/node/sources.toml", "taint/node/semgrep-angular.toml"]
message = "untrusted data from {source} reaches the element markup set by {sink}"
'''

[[rules]]
id = "ward:javascript/angular-bypasssecuritytrust"
language = "JAVASCRIPT"
capability = "DATAFLOW"
severity = "WARNING"
category = "security"
presets = ["standard", "strict"]
body = '''
check = "taint"
specs = ["taint/node/sources.toml", "taint/node/semgrep-angular-bypass.toml"]
message = "untrusted data from {source} is trusted without sanitizing by {sink}"
'''

[[rules]]
id = "ward:javascript/detect-angular-trust-as-method"
language = "JAVASCRIPT"
capability = "DATAFLOW"
severity = "WARNING"
category = "security"
presets = ["standard", "strict"]
body = '''
check = "taint"
specs = ["taint/node/sources.toml", "taint/node/semgrep-angular-trust.toml"]
message = "untrusted data from {source} is marked as trusted by {sink}"
'''
