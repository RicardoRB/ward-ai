[[rules]]
id = "ward:typescript/variable-declaration-usage-distance"
language = "TYPESCRIPT"
capability = "SCOPES"
severity = "ERROR"
category = "coding"
presets = ["standard", "strict"]
options.allowed-distance = { type = "integer", min = 1, parameter = "max" }
body = '''
check = "node-variable-distance"
max = 3
message = "distance between declaration of {value} and its first usage is more than {max}"
'''

[[rules]]
id = "ward:javascript/variable-declaration-usage-distance"
language = "JAVASCRIPT"
capability = "SCOPES"
severity = "ERROR"
category = "coding"
