[[rules]]
id = "ward:typescript/variable-declaration-usage-distance"
language = "TYPESCRIPT"
capability = "SCOPES"
severity = "ERROR"
category = "coding"
presets = ["standard", "strict"]
options.allowed-distance = { type = "integer", min = 1, parameter = "max" }
