# Response-header rules of the Semgrep p/javascript pack: request data that controls a CORS or X-Frame-Options header.
# Each rule is a taint check from request data to the header call; upstream rule ids are in catalog/semgrep.toml.

[[rules]]
id = "ward:javascript/cors-misconfiguration"
language = "JAVASCRIPT"
capability = "DATAFLOW"
severity = "WARNING"
category = "security/web"
presets = ["standard", "strict"]
body = '''
check = "taint"
specs = ["taint/node/sources.toml", "taint/node/semgrep-cors.toml"]
message = "untrusted data from {source} sets the CORS header by {sink}"
'''

[[rules]]
id = "ward:javascript/x-frame-options-misconfiguration"
language = "JAVASCRIPT"
capability = "DATAFLOW"
severity = "WARNING"
category = "security/web"
presets = ["standard", "strict"]
body = '''
check = "taint"
specs = ["taint/node/sources.toml", "taint/node/semgrep-headers.toml"]
message = "untrusted data from {source} controls the X-Frame-Options header by {sink}"
'''
