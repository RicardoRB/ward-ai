[[rules]]
id = "ward:typescript/no-string-case-mismatch"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "problem"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression"]
text = '^[\w$.]+\.toLowerCase\(\)(===?|!==?)[\"\x27][^\"\x27]*[A-Z]|^[\w$.]+\.toUpperCase\(\)(===?|!==?)[\"\x27][^\"\x27]*[a-z]'
message = "the comparison can never match because of the letter case of the literal"
'''

[[rules]]
