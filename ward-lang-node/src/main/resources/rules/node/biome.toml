# Biome rules for TypeScript and JavaScript that have no ESLint counterpart, as node text checks.

[[rules]]
id = "ward:typescript/no-adjacent-spaces-in-regex"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "suggestion"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["RegularExpressionLiteral"]
text = '^/[^/]*  '
message = "use a quantifier such as {2} instead of repeated spaces in a regular expression"
'''

[[rules]]
id = "ward:javascript/no-adjacent-spaces-in-regex"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "suggestion"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["RegularExpressionLiteral"]
text = '^/[^/]*  '
message = "use a quantifier such as {2} instead of repeated spaces in a regular expression"
'''

[[rules]]
id = "ward:javascript/no-confusing-labels"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "suggestion"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["labelledStatement"]
text = '^[\w$]+:(?!for\(|while\(|do|switch)'
message = "a label should only mark a loop"
'''

[[rules]]
id = "ward:typescript/no-const-enum"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "problem"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["enumDeclaration"]
text = '^(declare)?constenum'
message = "avoid const enum; use a regular enum or a union of literals"
'''

[[rules]]
id = "ward:typescript/no-assign-in-expressions"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "problem"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["ifStatement", "iterationStatement"]
text = '^(if|while)\([\w$.]+=[^=>]'
message = "do not assign inside a condition"
'''

[[rules]]
id = "ward:javascript/no-assign-in-expressions"
