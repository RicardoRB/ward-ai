[[rules]]
id = "ward:typescript/no-misrefactored-shorthand-assign"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "problem"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression"]
text = '^([\w$.]+)(\+|-|\*|/|%|&|\||\^|<<|>>)=\1\2'
message = "the shorthand assignment repeats its target; write it without the target on the right"
'''

