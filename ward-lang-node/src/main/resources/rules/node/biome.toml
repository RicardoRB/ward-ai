[[rules]]
id = "ward:typescript/no-useless-continue"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "suggestion"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["iterationStatement"]
text = '^(for|while)\(.*continue;?\}$'
message = "the final continue of a loop body has no effect; remove it"
'''

