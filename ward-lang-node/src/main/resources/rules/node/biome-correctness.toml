# Biome rules of the correctness group for TypeScript and JavaScript (catalog rows of #329).

[[rules]]
id = "ward:typescript/no-constant-math-min-max-clamp"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "node-constant-clamp"
message = "this Math.min and Math.max combination always returns the same value"
'''

[[rules]]
id = "ward:javascript/no-constant-math-min-max-clamp"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "node-constant-clamp"
message = "this Math.min and Math.max combination always returns the same value"
'''

[[rules]]
id = "ward:typescript/no-unused-function-parameters"
language = "TYPESCRIPT"
capability = "SCOPES"
severity = "WARNING"
category = "correctness"
presets = ["standard", "strict"]
options.ignore-rest-siblings = { type = "boolean" }
body = '''
check = "node-unused-parameter"
ignore-rest-siblings = true
message = "parameter '{value}' is never used"
'''

[[rules]]
id = "ward:javascript/no-unused-function-parameters"
language = "JAVASCRIPT"
capability = "SCOPES"
severity = "WARNING"
category = "correctness"
presets = ["standard", "strict"]
options.ignore-rest-siblings = { type = "boolean" }
body = '''
check = "node-unused-parameter"
ignore-rest-siblings = true
message = "parameter '{value}' is never used"
'''

[[rules]]
id = "ward:typescript/no-unreachable-super"
language = "TYPESCRIPT"
capability = "CFG"
severity = "ERROR"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "node-unreachable-super"
message = "this constructor must call super() exactly once, before this is read, on every code path"
'''

[[rules]]
id = "ward:javascript/no-unreachable-super"
language = "JAVASCRIPT"
capability = "CFG"
severity = "ERROR"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "node-unreachable-super"
message = "this constructor must call super() exactly once, before this is read, on every code path"
'''


[[rules]]
id = "ward:javascript/no-void-elements-with-children"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "node-void-element-children"
elements = ["area", "base", "br", "col", "embed", "hr", "img", "input", "link", "meta", "param", "source", "track", "wbr", "keygen", "menuitem"]
message = "a void element cannot have children; remove them"
'''

[[rules]]
id = "ward:typescript/no-void-elements-with-children"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "node-void-element-children"
elements = ["area", "base", "br", "col", "embed", "hr", "img", "input", "link", "meta", "param", "source", "track", "wbr", "keygen", "menuitem"]
message = "a void element cannot have children; remove them"
'''

[[rules]]
id = "ward:typescript/no-void-type-return"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "node-void-type-return"
message = "A function with a void return type must not return a value."
'''
