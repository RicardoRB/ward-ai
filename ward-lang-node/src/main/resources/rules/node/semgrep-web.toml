# Web rules of the Semgrep p/javascript pack: HTML output, templates, redirects, outbound requests and file responses.
# Each rule is a taint check from request or browser data to the sink; upstream rule ids are in catalog/semgrep.toml.

[[rules]]
id = "ward:javascript/direct-response-write"
language = "JAVASCRIPT"
capability = "DATAFLOW"
severity = "WARNING"
category = "security"
presets = ["standard", "strict"]
body = '''
check = "taint"
specs = ["taint/node/sources.toml", "taint/node/xss.toml"]
message = "untrusted data from {source} reaches the response written by {sink}"
'''

