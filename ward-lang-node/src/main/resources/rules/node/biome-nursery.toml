[[rules]]
id = "ward:javascript/no-obsolete-tags"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "WARNING"
category = "nursery"
presets = ["strict"]
body = '''
check = "forbidden-node"
kinds = ["jsxElementName"]
text = '^(?:acronym|applet|basefont|bgsound|big|blink|center|dir|font|frame|frameset|isindex|keygen|listing|marquee|menuitem|multicol|nextid|nobr|noembed|noframes|plaintext|rb|rtc|spacer|strike|tt|xmp)$'
parent = ["jsxOpeningElement", "jsxSelfClosingElement"]
message = "avoid the obsolete element; use a current element instead"
'''

