message = "use Math.min or Math.max instead of a ternary comparison"
'''

[[rules]]
id = "ward:typescript/use-modern-math-apis"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "WARNING"
category = "nursery"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression"]
text = '^Math\.log\([^()]*\) *(\* *Math\.LOG10E|/ *Math\.LN10)\b|^Math\.log\([^()]*\) */ *Math\.LN2\b|^Math\.sqrt\(\s*[\w.]+ *\*\* *2 *\)'
message = "use the dedicated Math API (log10, log2, hypot or abs)"
'''

[[rules]]
id = "ward:javascript/use-modern-math-apis"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "WARNING"
category = "nursery"
