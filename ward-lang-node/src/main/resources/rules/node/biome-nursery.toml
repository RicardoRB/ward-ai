[[rules]]
id = "ward:typescript/use-dom-node-text-content"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "NOTE"
category = "nursery"
presets = ["standard", "strict"]
body = '''
check = "node-member-property"
kinds = ["identifier", "StringLiteral"]
text = '^(innerText|[\x22\x27]innerText[\x22\x27])$'
message = "use textContent instead of innerText; the two differ"
'''

