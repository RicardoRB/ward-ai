# Dead-code rules for TypeScript and JavaScript, replacing knip. Each body names a check; the
# project-wide checks read every file of the language at once.

[[rules]]
id = "ward:typescript/knip-unresolved"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "error"
category = "dead-code"
presets = ["standard", "strict"]
body = '''
check = "node-unresolved-import"
message = "unresolved import '{value}': no file of the project matches it"
'''

[[rules]]
id = "ward:javascript/knip-unresolved"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "error"
category = "dead-code"
presets = ["standard", "strict"]
body = '''
check = "node-unresolved-import"
message = "unresolved import '{value}': no file of the project matches it"
'''

[[rules]]
id = "ward:typescript/knip-unlisted"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "error"
category = "dead-code"
presets = ["standard", "strict"]
body = '''
check = "node-unlisted-import"
message = "unlisted dependency '{value}': not in the package.json of this package"
'''

[[rules]]
id = "ward:javascript/knip-unlisted"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "error"
category = "dead-code"
presets = ["standard", "strict"]
body = '''
check = "node-unlisted-import"
message = "unlisted dependency '{value}': not in the package.json of this package"
'''

[[rules]]
id = "ward:typescript/knip-dependencies"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "error"
category = "dead-code"
presets = ["standard", "strict"]
body = '''
check = "node-unused-dependency"
section = "dependencies"
message = "unused dependency '{value}': no file of the package imports it"
'''

[[rules]]
id = "ward:typescript/knip-dev-dependencies"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "error"
category = "dead-code"
presets = ["standard", "strict"]
body = '''
check = "node-unused-dependency"
section = "devDependencies"
message = "unused devDependency '{value}': no file of the package imports it"
'''

[[rules]]
id = "ward:typescript/knip-optional-peer-dependencies"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "error"
category = "dead-code"
presets = ["standard", "strict"]
body = '''
check = "node-optional-peer"
message = "referenced optional peer dependency '{value}': it is imported, so it is not optional"
'''

[[rules]]
id = "ward:typescript/knip-catalog"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "error"
category = "dead-code"
presets = ["standard", "strict"]
body = '''
check = "node-catalog"
message = "unused catalog entry '{value}': no package.json references it"
'''

[[rules]]
id = "ward:typescript/knip-catalog-references"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "error"
category = "dead-code"
presets = ["standard", "strict"]
body = '''
check = "node-catalog-reference"
message = "catalog reference '{value}' names an entry that pnpm-workspace.yaml does not define"
'''

