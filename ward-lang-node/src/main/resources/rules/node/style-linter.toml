[[rules]]
id = "ward:typescript/no-useless-constructor"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "linter"
presets = ["standard", "strict"]
body = '''
check = "node-useless-constructor"
message = "useless constructor"
'''

[[rules]]
id = "ward:javascript/no-useless-constructor"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "linter"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["methodDefinition"]
text = '^constructor\(\)\{\}$|^constructor\(([\w$,]*)\)\{super\(\1\);?\}$|^constructor\(\.\.\.([\w$]+)\)\{super\(\.\.\.\2\);?\}$'
message = "useless constructor"
'''
