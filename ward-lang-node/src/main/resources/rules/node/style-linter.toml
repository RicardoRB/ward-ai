# Style rules of the "linter" and "problem" categories for TypeScript and JavaScript, from ESLint core and typescript-eslint at their pinned versions. Each rule runs on the shared syntax tree.

[[rules]]
id = "ward:javascript/dot-notation"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "linter"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["StringLiteral"]
parent-path = "literal>singleExpression>expressionSequence>singleExpression"
text = '^(.)[A-Za-z_$][A-Za-z0-9_$]*\1$'
message = "[{value}] is better written in dot notation"
'''

[[rules]]
id = "ward:typescript/eqeqeq"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "linter"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["'=='", "'!='"]
message = "expected '===' or '!==' instead of '{value}'"
'''

[[rules]]
id = "ward:javascript/eqeqeq"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "linter"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["'=='", "'!='"]
message = "expected '===' or '!==' instead of '{value}'"
'''

[[rules]]
id = "ward:typescript/no-non-null-assertion"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "problem"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression"]
text = '^[\w$.()\[\]]+!$'
message = "forbidden non-null assertion"
'''

[[rules]]
id = "ward:typescript/no-extra-boolean-cast"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "linter"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression"]
parent-path = "expressionSequence>ifStatement|iterationStatement"
text = '^!!'
message = "redundant double negation in a boolean context"
'''

[[rules]]
id = "ward:javascript/no-extra-boolean-cast"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "linter"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression"]
parent-path = "expressionSequence>ifStatement|iterationStatement"
text = '^!!'
message = "redundant double negation in a boolean context"
'''

[[rules]]
id = "ward:typescript/no-useless-rename"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "linter"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["importAliasName", "exportAliasName"]
text = '^([\w$]+)as\1$'
message = "{value} is a useless rename"
'''

[[rules]]
id = "ward:javascript/no-useless-rename"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "linter"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["importAliasName", "exportAliasName"]
text = '^([\w$]+)as\1$'
message = "{value} is a useless rename"
'''

[[rules]]
id = "ward:typescript/no-useless-constructor"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "linter"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["constructorDeclaration"]
text = '^(?:\w+)?constructor\(\)\{\}$|^(?:\w+)?constructor\(\.\.\.(\w+)\)\{super\(\.\.\.\1\);?\}$'
message = "useless constructor"
'''

[[rules]]
id = "ward:typescript/no-else-return"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "linter"
presets = ["standard", "strict"]
options.allow-else-if = { type = "boolean" }
body = '''
check = "node-else-after-jump"
allow-else-if = true
message = "unnecessary 'else' after 'return'"
'''

[[rules]]
id = "ward:javascript/no-else-return"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "linter"
presets = ["standard", "strict"]
options.allow-else-if = { type = "boolean" }
body = '''
check = "node-else-after-jump"
allow-else-if = true
message = "unnecessary 'else' after 'return'"
'''

[[rules]]
id = "ward:typescript/prefer-const"
language = "TYPESCRIPT"
capability = "SCOPES"
severity = "ERROR"
category = "linter"
presets = ["standard", "strict"]
options.destructuring = { type = "enum", values = ["any", "all"], parameter = "destructuring" }
options.ignore-read-before-assign = { type = "boolean", parameter = "ignore-read-before-assign" }
body = '''
check = "node-prefer-const"
destructuring = "any"
ignore-read-before-assign = false
message = "'{value}' is never reassigned. Use 'const' instead."
'''

[[rules]]
id = "ward:javascript/prefer-const"
language = "JAVASCRIPT"
capability = "SCOPES"
severity = "ERROR"
category = "linter"
presets = ["standard", "strict"]
options.destructuring = { type = "enum", values = ["any", "all"], parameter = "destructuring" }
options.ignore-read-before-assign = { type = "boolean", parameter = "ignore-read-before-assign" }
body = '''
check = "node-prefer-const"
destructuring = "any"
ignore-read-before-assign = false
message = "'{value}' is never reassigned. Use 'const' instead."
'''

[[rules]]
id = "ward:typescript/prefer-template"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "linter"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression"]
text = '^(?:[\w$.()]+\+[\x27\x22\x60][^\x27\x22\x60]*[\x27\x22\x60]|[\x27\x22\x60][^\x27\x22\x60]*[\x27\x22\x60]\+[\w$.()]+)$'
message = "unexpected string concatenation; use a template literal"
'''

[[rules]]
id = "ward:typescript/prefer-arrow-callback"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "linter"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["anonymousFunction"]
parent-path = "singleExpression>argument"
text = '^function\((?![\s\S]*(this|arguments|super|new\.target))'
message = "unexpected function expression; use an arrow function"
'''

[[rules]]
id = "ward:javascript/prefer-template"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "linter"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression"]
text = '^(?:[\w$.()]+\+[\x27\x22\x60][^\x27\x22\x60]*[\x27\x22\x60]|[\x27\x22\x60][^\x27\x22\x60]*[\x27\x22\x60]\+[\w$.()]+)$'
message = "unexpected string concatenation; use a template literal"
'''

[[rules]]
id = "ward:javascript/prefer-arrow-callback"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "linter"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["anonymousFunction"]
parent-path = "singleExpression>argument"
text = '^function\((?![\s\S]*(this|arguments|super|new\.target))'
message = "unexpected function expression; use an arrow function"
'''
