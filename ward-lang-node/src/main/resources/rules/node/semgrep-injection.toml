# Injection rules of the Semgrep p/javascript pack: code, command, module, SQL, XML and deserialization sinks.
# Each rule is a taint check: request or event data that reaches the sink. Upstream rule ids are in catalog/semgrep.toml.

[[rules]]
id = "ward:javascript/code-string-concat"
language = "JAVASCRIPT"
capability = "DATAFLOW"
severity = "ERROR"
category = "security"
presets = ["standard", "strict"]
body = '''
check = "taint"
specs = ["taint/node/sources.toml", "taint/node/semgrep-code.toml"]
message = "untrusted data from {source} reaches the code evaluated by {sink}"
'''

