# Secret rules of the Semgrep p/javascript pack: credentials, and password hashing options, written in the source.
# shortcut: each rule matches the literal at the call or property, not a variable that holds the literal.

[[rules]]
id = "ward:javascript/hardcoded-jwt-secret"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "WARNING"
category = "security/secrets"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression"]
text = '^[\w$.]+\.(sign|verify)\([^,]+,\s*[\x27"][^\x27"]*[\x27"]'
message = "a hard-coded secret signs or verifies JWT tokens"
'''

[[rules]]
id = "ward:javascript/hardcoded-passport-secret"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "WARNING"
category = "security/secrets"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["propertyAssignment", "singleExpression"]
text = '^(?:[\w$.]+\.)?(clientSecret|secretOrKey|consumerSecret)\s*[:=]\s*[\x27"]'
message = "a hard-coded secret configures a Passport strategy"
'''

[[rules]]
id = "ward:javascript/unsafe-argon2-config"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "WARNING"
category = "security/secrets"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression"]
text = '^(?:[\w$]+\.)*[aA]rgon2[\w$]*\.hash\((?![\s\S]*\btype\s*:\s*[\w$.]*argon2id\b)'
message = "argon2 hashing without the argon2id type"
'''
