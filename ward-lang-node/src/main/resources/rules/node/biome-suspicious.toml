[[rules]]
id = "ward:typescript/use-default-switch-clause-last"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "WARNING"
category = "correctness"
presets = ["standard", "strict"]
body = '''
# shortcut: the finding sits on the case clauses after default, not on default itself (Biome reports default)
check = "order"
kinds = ["caseBlock"]
order = ["caseClauses", "defaultClause"]
message = "default clause should be the last clause of the switch"
'''
