# Biome rules of the suspicious group for TypeScript and JavaScript (catalog rows of #329). Each rule runs on the shared syntax tree.

[[rules]]
id = "ward:typescript/no-approximative-numeric-constant"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "WARNING"
category = "correctness"
presets = ["standard", "strict"]
body = '''
# Biome: the literal approximates a standard constant with at least three fraction digits.
check = "forbidden-node"
kinds = ["numericLiteral"]
text = '^(?:2\.(?:718(?:2(?:8(?:1(?:8(?:2(?:8(?:4(?:5(?:9(?:0(?:4(?:5)?)?)?)?)?)?)?)?)?)?)?)?|7183|718282|71828183|7182818285|71828182846|71828182845905)|2\.(?:302(?:5(?:8(?:5(?:0(?:9(?:2(?:9(?:9(?:4(?:0(?:4(?:6)?)?)?)?)?)?)?)?)?)?)?)?|303|3026|30259|3025851|302585093|30258509299405)|0?\.(?:693(?:1(?:4(?:7(?:1(?:8(?:0(?:5(?:5(?:9(?:9(?:4(?:5(?:3)?)?)?)?)?)?)?)?)?)?)?)?)?|69315|6931472|693147181|6931471806|69314718056|69314718055995)|0?\.(?:434(?:2(?:9(?:4(?:4(?:8(?:1(?:9(?:0(?:3(?:2(?:5(?:1(?:8)?)?)?)?)?)?)?)?)?)?)?)?)?|4343|4342945|434294482|4342944819033|434294481903252)|1\.(?:442(?:6(?:9(?:5(?:0(?:4(?:0(?:8(?:8(?:8(?:9(?:6(?:3(?:4)?)?)?)?)?)?)?)?)?)?)?)?)?|443|4427|442695041|4426950409|44269504089|442695040889)|3\.(?:141(?:5(?:9(?:2(?:6(?:5(?:3(?:5(?:8(?:9(?:7(?:9(?:3)?)?)?)?)?)?)?)?)?)?)?)?|142|1416|141593|1415927|141592654|1415926536|14159265359|1415926535898)|0?\.(?:707(?:1(?:0(?:6(?:7(?:8(?:1(?:1(?:8(?:6(?:5(?:4(?:7(?:6)?)?)?)?)?)?)?)?)?)?)?)?)?|70711|707107|7071068|7071067812|70710678119|707106781187|70710678118655|707106781186548)|1\.(?:414(?:2(?:1(?:3(?:5(?:6(?:2(?:3(?:7(?:3(?:0(?:9(?:5(?:1)?)?)?)?)?)?)?)?)?)?)?)?)?|414214|4142136|4142135624|4142135623731))0*$'
message = "prefer the constant from the standard library (Math)"
'''
