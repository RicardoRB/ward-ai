language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "WARNING"
category = "security"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression"]
text = '^(window\.intercomSettings\s*=\s*|Intercom\([\x27"]boot[\x27"],\s*)\{(?![\s\S]*\buser_hash\s*:)[\s\S]*\b(email|user_id)\s*:'
message = "Intercom identifies the user without a user_hash"
'''

[[rules]]
id = "ward:javascript/aws-cdk-bucket-enforcessl"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "security"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression"]
text = '^new([\w$]+\.)?Bucket\((?![\s\S]*\benforceSSL\s*:\s*true)'
message = "bucket does not enforce encryption in transit; set enforceSSL to true"
'''

[[rules]]
id = "ward:javascript/awscdk-bucket-encryption"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "security"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression"]
text = '^new([\w$]+\.)?Bucket\((?![\s\S]*\bencryption\s*:\s*([\w$]+\.)?BucketEncryption\.(KMS_MANAGED|KMS|S3_MANAGED)\b)'
message = "bucket has no encryption at rest; set encryption to KMS_MANAGED, KMS or S3_MANAGED"
'''

