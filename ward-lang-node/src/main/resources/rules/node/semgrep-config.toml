# Configuration rules of the Semgrep p/javascript pack: crypto modes, JWT and session options, TLS, CDK constructs and postMessage.
# Each rule matches the call or object literal by its text, with the callee named as the library usually binds it.
# shortcut: a callee matches by its conventional name (jwt, session, serveIndex), not by the require that binds it.

[[rules]]
id = "ward:javascript/create-de-cipher-no-iv"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "security"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression"]
text = '^[\w$.]+\.(createCipher|createDecipher)\('
message = "createCipher and createDecipher derive the key without an IV; use createCipheriv with a random IV"
'''

[[rules]]
id = "ward:javascript/gcm-no-tag-length"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "security"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression"]
text = '^[\w$.]+\.createDecipheriv\(\s*[\x27"][\w-]*-gcm[\x27"]\s*,[^,]*,[^,()]*\)'
message = "GCM decryption without an authTagLength allows truncated authentication tags"
'''

[[rules]]
id = "ward:javascript/bypass-tls-verification"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "WARNING"
category = "security"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression", "propertyAssignment"]
text = '^(process\.env\[[\x27"]NODE_TLS_REJECT_UNAUTHORIZED[\x27"]\]\s*=\s*[\x27"]?0[\x27"]?|rejectUnauthorized\s*:\s*false)'
message = "TLS certificate verification is disabled"
'''

[[rules]]
id = "ward:javascript/wildcard-postmessage-configuration"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "WARNING"
category = "security"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression"]
text = '^[\w$.]+\.postMessage\([\s\S]*?,\s*[\x27"]\*[\x27"]\s*[,)]'
message = "postMessage with the wildcard target origin lets any window receive the message"
'''

[[rules]]
id = "ward:javascript/react-insecure-request"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "security"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression"]
text = '^(axios\.(get|post|delete|head|patch|put|options)\(|fetch\(|axios\(\s*\{\s*url\s*:)\s*[\x27"]http://(?!localhost)'
message = "unencrypted request over HTTP"
'''

[[rules]]
id = "ward:javascript/detect-angular-sce-disabled"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "security"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression"]
text = '^\$sceProvider\.enabled\(\s*false\s*\)'
message = "AngularJS strict contextual escaping is disabled"
'''

[[rules]]
