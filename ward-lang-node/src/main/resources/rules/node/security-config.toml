[[rules]]
id = "ward:javascript/shell-option"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "WARNING"
category = "security"
presets = ["strict"]
body = '''
check = "forbidden-node"
kinds = ["propertyAssignment"]
text = '^shell:(?:true|[\"\x27`][^\"\x27`]+[\"\x27`])$'
message = "the shell option runs the command through a shell, where metacharacters in any argument are interpreted; pass the arguments as an array without it"
'''

