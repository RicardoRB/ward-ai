[[rules]]
id = "ward:javascript/prototype-pollution"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "security"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression"]
text = '^[\w.\[\]"\x27]*__proto__[\w.\[\]"\x27]*=|^[\w.]*\.constructor\.prototype\.\w+='
message = "this write changes the prototype shared by every object; build objects with Object.create(null) or a Map"
'''

[[rules]]
id = "ward:typescript/prototype-pollution"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
