[[rules]]
id = "ward:javascript/hard-coded-secret"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "security"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
sources = "main"
kinds = ["propertyAssignment", "singleExpression"]
text = '^secret:[\"\x27`][^"\x27`$]+[\"\x27`]$|^jwt\.(?:sign|verify)\(.*,[\"\x27`][^"\x27]+[\"\x27`](?:,\{[^{}]*\})?\)$'
message = "this secret is a string literal in the source; read it from the environment or a secret store"
'''

