[[rules]]
id = "ward:javascript/unsafe-framework-trust"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "security"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression"]
text = '^[\w.]+\.bypassSecurityTrust(?:Html|Script|Style|Url|ResourceUrl)\((?![\"\x27`][^"\x27`$]*[\"\x27`]\)$)(?:[^()]|\([^()]*\))*\)$'
message = "this call tells Angular to skip its sanitizer for a computed value; sanitize it or bind it as text"
'''

