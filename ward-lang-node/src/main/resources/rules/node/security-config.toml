[[rules]]
id = "ward:javascript/dom-xss"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "WARNING"
category = "security"
presets = ["strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression"]
text = '^\w+(?:\.\w+)*\.(?:innerHTML|outerHTML)=(?![\"\x27`][^"\x27`$]*[\"\x27`]$)(?:[^()]|\([^()]*\))*$|^document\.(?:write|writeln)\((?![\"\x27`][^"\x27`$]*[\"\x27`]\)$)(?:[^()]|\([^()]*\))*\)$|^[\w.]+\.insertAdjacentHTML\([^,()]+,(?![\"\x27`][^"\x27`$]*[\"\x27`]\)$)(?:[^()]|\([^()]*\))*\)$'
message = "this call writes a computed string as markup; use textContent, or sanitize the string first"
'''

[[rules]]
id = "ward:typescript/dom-xss"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "WARNING"
