# Configuration rules for JavaScript and TypeScript: options, settings and calls that are dangerous when set to the value they match.

[[rules]]
id = "ward:javascript/tls-verification-disabled"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "security"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["propertyAssignment", "singleExpression"]
text = '^(?:rejectUnauthorized|strictSSL):false$|^process\.env\.NODE_TLS_REJECT_UNAUTHORIZED=[\"\x27`]?0[\"\x27`]?$'
message = "this setting turns off certificate checks, so anyone can impersonate the server; keep verification on"
'''

[[rules]]
id = "ward:typescript/tls-verification-disabled"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "security"
presets = ["standard", "strict"]
