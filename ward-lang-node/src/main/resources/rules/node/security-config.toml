[[rules]]
id = "ward:javascript/wildcard-post-message"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "WARNING"
category = "security"
presets = ["strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression"]
text = '^(?:\w+\.)*postMessage\(.+,[\"\x27`]\*[\"\x27`](?:,\[[^\]]*\])?\)$'
message = "the target origin * sends the message to any page that holds the window; name the receiving origin"
'''

[[rules]]
id = "ward:typescript/wildcard-post-message"
