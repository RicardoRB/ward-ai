message = "this setting turns off certificate checks, so anyone can impersonate the server; keep verification on"
'''

[[rules]]
id = "ward:javascript/cleartext-transport"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "WARNING"
category = "security"
presets = ["strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression"]
text = '^(?:fetch|axios|got|(?:axios|got|http|ky)\.(?:get|post|put|patch|delete|head|request))\([\"\x27`]http://(?!localhost|127\.0\.0\.1|\[::1\])[^\"\x27`]*[\"\x27`](?:,(?:[^()]|\([^()]*\))*)?\)$|^newWebSocket\([\"\x27`]ws://(?!localhost|127\.0\.0\.1|\[::1\])[^\"\x27`]*[\"\x27`]\)$'
message = "this address uses http or ws, which send data in clear text; use https or wss"
'''

[[rules]]
id = "ward:typescript/cleartext-transport"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "WARNING"
category = "security"
