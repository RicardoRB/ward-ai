message = "this address uses http or ws, which send data in clear text; use https or wss"
'''

[[rules]]
id = "ward:javascript/jwt-without-verification"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "security"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["propertyAssignment"]
text = '^algorithms?:\[?[\"\x27`](?i:none)[\"\x27`]\]?$'
message = "the none algorithm skips the signature, so anyone can forge the token; name a real algorithm"
'''

