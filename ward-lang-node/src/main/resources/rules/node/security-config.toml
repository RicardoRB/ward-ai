kinds = ["singleExpression"]
text = '^(?:res|response)\.cookie\(.*\b(?:secure|httpOnly):false\b.*\)$|^(?:session|cookieSession)\(\{.*\bcookie:\{[^{}]*\b(?:secure|httpOnly):false\b[^{}]*\}.*\}\)$'
message = "this cookie is allowed over plain http or from scripts; set secure and httpOnly"
'''

[[rules]]
id = "ward:javascript/permissive-cors"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "WARNING"
category = "security"
presets = ["strict"]
body = '''
check = "forbidden-node"
kinds = ["singleExpression"]
text = '^cors\(\)$|^cors\(\{[^{}]*\borigin:(?:[\"\x27`]\*[\"\x27`]|true)(?:,|\})|^(?:\w+\.)+(?:setHeader|header|set|append)\([\"\x27`](?i:access-control-allow-origin)[\"\x27`],[\"\x27`]\*[\"\x27`]\)$'
message = "this setting lets every origin call the API from a browser; list the origins that need access"
'''

[[rules]]
id = "ward:typescript/permissive-cors"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "WARNING"
