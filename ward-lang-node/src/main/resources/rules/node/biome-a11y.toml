[[rules]]
id = "ward:javascript/use-button-type"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "a11y"
presets = ["standard", "strict"]
body = '''
check = "node-jsx-required-attribute"
elements = ["button"]
attribute = "type"
values = ["button", "submit", "reset"]
silent-on-spread = true
message = "a button needs a type of button, submit or reset"
'''

[[rules]]
id = "ward:typescript/use-button-type"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "a11y"
presets = ["standard", "strict"]
body = '''
check = "node-jsx-required-attribute"
elements = ["button"]
attribute = "type"
values = ["button", "submit", "reset"]
silent-on-spread = true
message = "a button needs a type of button, submit or reset"
'''

[[rules]]
id = "ward:javascript/use-alt-text"
language = "JAVASCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "a11y"
presets = ["standard", "strict"]
body = '''
check = "node-jsx-required-attribute"
elements = ["img", "area", "input[type=image]"]
attribute = "alt"
message = "an image needs an alt text; an empty alt text marks a decorative image"
'''

[[rules]]
id = "ward:typescript/use-alt-text"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "a11y"
presets = ["standard", "strict"]
body = '''
check = "node-jsx-required-attribute"
elements = ["img", "area", "input[type=image]"]
attribute = "alt"
message = "an image needs an alt text; an empty alt text marks a decorative image"
'''

