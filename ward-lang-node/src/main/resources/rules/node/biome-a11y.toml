id = "ward:typescript/no-positive-tabindex"
language = "TYPESCRIPT"
capability = "SYNTAX"
severity = "ERROR"
category = "a11y"
presets = ["standard", "strict"]
body = '''
check = "node-jsx-attribute-value"
attribute = "tabIndex"
text = '^(?:\{[1-9][0-9]*\}|"[1-9][0-9]*"|\{"[1-9][0-9]*"\})$'
message = "avoid positive tabIndex values; they change the keyboard focus order"
