# Ward's own secret rules and their tests hold fake secrets and the literal prefixes the rules
# match. Gitleaks, which still checks this repository until it migrates to Ward 0.8.0, would report
# every one of them, so those paths are not scanned.
[extend]
useDefault = true

[[allowlists]]
description = "Secret rule data, its fixtures and the tests of the secret rules"
paths = [
  '''ward-cli/src/main/resources/rules/secrets/''',
  '''ward-cli/src/test/resources/rules/secrets/''',
  '''ward-cli/src/test/resources/catalog/''',
  '''ward-cli/src/test/java/dev/ward/infrastructure/rule/SecretScan[A-Za-z]*Test\.java$''',
]
