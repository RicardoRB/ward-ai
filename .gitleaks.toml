# Test resources and tests hold rule ids and secret-shaped samples on purpose; none is a credential.
[extend]
useDefault = true

[allowlist]
description = "test resources and tests of the rule catalog and the secret rules"
paths = [
  '''ward-cli/src/test/resources/catalog/''',
  '''ward-cli/src/test/resources/rules/secrets/''',
  '''ward-cli/src/main/resources/rules/secrets/''',
  '''ward-cli/src/test/java/dev/ward/infrastructure/rule/SecretScan.*Test\.java''',
]
