# OpenAPI lint rules (owasp), ported from the vacuum 0.39.3 rules of the same id. Each rule is a project check over the loaded document model.

[[rules]]
id = "ward:openapi/owasp-no-http-basic"
language = "openapi"
capability = "SYNTAX"
severity = "error"
category = "security"
presets = ["standard", "strict"]
body = '''
check = "openapi-owasp-no-http-basic"
'''

