# OpenAPI lint rules (schemas), ported from the vacuum 0.39.3 rules of the same id. Each rule is a project check over the loaded document model.

[[rules]]
id = "ward:openapi/duplicated-entry-in-enum"
language = "openapi"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "openapi-duplicated-entry-in-enum"
'''

[[rules]]
id = "ward:openapi/typed-enum"
language = "openapi"
capability = "SYNTAX"
severity = "warning"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "openapi-typed-enum"
'''

[[rules]]
id = "ward:openapi/nullable-enum-contains-null"
language = "openapi"
capability = "SYNTAX"
severity = "warning"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "openapi-nullable-enum-contains-null"
'''

