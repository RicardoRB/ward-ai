# OpenAPI lint rules (validation), ported from the Spectral 6.17.1 rules of the same id. Each rule is a project check over the loaded document model.

[[rules]]
id = "ward:openapi/oas3-api-servers"
language = "openapi"
capability = "SYNTAX"
severity = "warning"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "openapi-oas3-api-servers"
'''

[[rules]]
id = "ward:openapi/no-eval-in-markdown"
language = "openapi"
capability = "SYNTAX"
severity = "warning"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "openapi-no-eval-in-markdown"
'''

[[rules]]
id = "ward:openapi/no-script-tags-in-markdown"
language = "openapi"
capability = "SYNTAX"
severity = "warning"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "openapi-no-script-tags-in-markdown"
'''
