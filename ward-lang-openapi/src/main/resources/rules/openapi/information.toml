# OpenAPI lint rules (information), ported from the Spectral 6.17.1 rules of the same id. Each rule is a project check over the loaded document model.

[[rules]]
id = "ward:openapi/contact-properties"
language = "openapi"
capability = "SYNTAX"
severity = "warning"
category = "docs"
presets = ["standard", "strict"]
body = '''
check = "openapi-contact-properties"
'''

