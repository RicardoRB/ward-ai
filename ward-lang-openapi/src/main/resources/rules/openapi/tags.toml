# OpenAPI lint rules (tags), ported from the Spectral 6.17.1 rules of the same id. Each rule is a project check over the loaded document model.

[[rules]]
id = "ward:openapi/openapi-tags"
language = "openapi"
capability = "SYNTAX"
severity = "warning"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "openapi-openapi-tags"
'''

[[rules]]
id = "ward:openapi/openapi-tags-alphabetical"
language = "openapi"
capability = "SYNTAX"
severity = "warning"
category = "docs"
presets = ["standard", "strict"]
body = '''
check = "openapi-openapi-tags-alphabetical"
'''

