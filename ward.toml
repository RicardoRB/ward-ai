version = 2

[checks.tests]
enabled = true
profiles = ["pre-push", "ci"]
command = "./mvnw test"

[checks.format]
enabled = true
profiles = ["default", "pre-commit", "pre-push", "ci"]
command = "./mvnw spotless:check"

[checks.format.paths]
match = ["ward-cli/src/**/*.java", "ward-analysis-api/src/**/*.java", "ward-lang-node/src/**/*.java", "ward-lang-python/src/**/*.java", "ward-lang-jvm/src/**/*.java", "ward-lang-swift/src/**/*.java"]
full = ["pom.xml", "ward-cli/pom.xml", "ward-analysis-api/pom.xml", "ward-lang-node/pom.xml", "ward-lang-python/pom.xml", "ward-lang-jvm/pom.xml", "ward-lang-swift/pom.xml"]
args = ["-DspotlessFiles={paths}"]
item = ".*/{path}"
separator = ","

[checks.checkstyle]
enabled = true
profiles = ["default", "pre-commit", "pre-push", "ci"]
command = "./mvnw checkstyle:check"

[checks.checkstyle.paths]
match = ["ward-cli/src/**/*.java", "ward-analysis-api/src/**/*.java", "ward-lang-node/src/**/*.java", "ward-lang-python/src/**/*.java", "ward-lang-jvm/src/**/*.java", "ward-lang-swift/src/**/*.java"]
full = ["config/checkstyle.xml", "pom.xml", "ward-cli/pom.xml", "ward-analysis-api/pom.xml", "ward-lang-node/pom.xml", "ward-lang-python/pom.xml", "ward-lang-jvm/pom.xml", "ward-lang-swift/pom.xml"]
args = ["-Dcheckstyle.includes={paths}"]
item = "**/{name}"
separator = ","

[checks.pmd]
enabled = true
profiles = ["default", "pre-commit", "pre-push", "ci"]
command = "./mvnw -DskipTests package pmd:check"

[checks.pmd.paths]
match = ["ward-cli/src/**/*.java", "ward-analysis-api/src/**/*.java", "ward-lang-node/src/**/*.java", "ward-lang-python/src/**/*.java", "ward-lang-jvm/src/**/*.java", "ward-lang-swift/src/**/*.java"]
full = ["config/pmd-ruleset.xml", "pom.xml", "ward-cli/pom.xml", "ward-analysis-api/pom.xml", "ward-lang-node/pom.xml", "ward-lang-python/pom.xml", "ward-lang-jvm/pom.xml", "ward-lang-swift/pom.xml"]

[checks.spotbugs]
enabled = true
profiles = ["pre-push", "ci"]
command = "./mvnw -DskipTests package spotbugs:check"

[checks.coverage]
enabled = true
profiles = ["pre-push", "ci"]
command = "./mvnw -DskipTests package jacoco:check"

[checks.archunit]
enabled = true
# Not in pre-push: the tests gate already runs these classes.
profiles = ["ci"]
command = "./mvnw -Dsurefire.failIfNoSpecifiedTests=false -Dtest=ArchitectureAnalysisApiTest,ArchitectureBoundaryTest,ArchitectureFeatureGraphTest,ArchitectureLangJvmTest,ArchitectureLangNodeTest,ArchitectureLangPythonTest,ArchitectureLangSwiftTest,ArchitecturePlacementTest,ArchitectureRuleFixturesTest,ArchitectureToolchainTest,NativeCommandMetadataTest,NativeImageCompatibilityTest,NativeJsonCodecMetadataTest,NativeResourceGlobsTest,WardCliContract4Test test"

[checks.enforcer]
enabled = true
profiles = ["pre-push", "ci"]
command = "./mvnw -DskipTests package enforcer:enforce"

[checks.mutation]
enabled = true
profiles = ["ci"]
command = "./mvnw -DskipTests package pitest:mutationCoverage"

# Native goals resolve only in ward-cli, which declares the GraalVM plugin.
[checks.native]
enabled = true
profiles = ["pre-push", "ci"]
command = "./mvnw -B -q -Pnative -pl ward-cli -am -DskipTests package native:compile"

[checks.gitleaks]
enabled = true
profiles = ["default", "pre-commit", "pre-push", "ci"]
command = "gitleaks detect --no-banner --redact --report-format sarif --report-path target/gitleaks.sarif"

# History scans miss uncommitted and staged edits, so edited and staged files are scanned directly.
[checks.gitleaks.paths]
match = ["**"]
full = [".gitleaks*"]
args = ["--no-git", "--source={paths}"]

[checks.semgrep]
enabled = true
profiles = ["ci"]
command = "semgrep scan --config p/java --error"

[checks.semgrep.paths]
match = ["**"]
full = [".semgrep*"]
args = ["{paths}"]

# Disabled: trivy already scans Maven dependencies without an NVD API key.
[checks.dependency-check]
enabled = false
profiles = ["ci"]
command = "./mvnw -DskipTests package dependency-check:check"

[checks.trivy]
enabled = true
profiles = ["ci"]
# Offline: resolve Maven POMs from ~/.m2 (filled by earlier gates); Maven Central rate-limits CI runners.
command = "trivy fs --offline-scan --exit-code 1 ."

[checks.license]
enabled = true
uses = "license"
profiles = ["pre-push", "ci"]
# The shipped set: runtime dependencies only. JNA is dual Apache-2.0 OR LGPL-2.1-or-later.
allow = ["Apache-2.0", "MIT", "BSD-3-Clause", "EPL-2.0", "LGPL-2.1-or-later"]
scopes = ["runtime"]

# Regenerate the SBOM and the third-party notice of the shipped ward-cli into ward-cli/target/compliance; the drift check below compares them.
# Drop --output to print one to stdout, and write it to compliance/ to refresh the committed copy.
[checks.compliance-sbom]
enabled = true
profiles = ["pre-push", "ci"]
command = ["ward", "sbom", "--directory", "ward-cli", "--scopes", "runtime", "--output", "ward-cli/target/compliance/sbom.json"]

[checks.compliance-notice]
enabled = true
profiles = ["pre-push", "ci"]
command = ["ward", "licenses", "--directory", "ward-cli", "--scopes", "runtime", "--output", "ward-cli/target/compliance/THIRD-PARTY-LICENSES"]

# Fails when the committed compliance files differ from the regenerated ones, and names the stale file.
[checks.license-drift]
enabled = true
profiles = ["pre-push", "ci"]
command = ["git", "diff", "--no-index", "--exit-code", "ward-cli/target/compliance", "compliance"]

# Disabled until openspec/ is tracked in Git; it is gitignored, so CI has no specs to validate.
[checks.openspec]
enabled = false
profiles = ["ci"]
command = "openspec validate --all --strict --no-interactive"
