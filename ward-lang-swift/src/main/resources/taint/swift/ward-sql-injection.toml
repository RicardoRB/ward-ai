# SQL statements of Swift code, written for Ward from the SQLite C interface documentation, which prepares statement text
# and binds values apart from it, and from the FMDB, GRDB and SQLite.swift documentation of the same calls. Statement text
# is argument 0 or 1; a bound value is not text, so sqlite3_bind_* calls are no sinks.

[[sinks]]
kind = "call"
name = "sqlite3_prepare"
arguments = [1]

[[sinks]]
kind = "call"
name = "sqlite3_prepare_v2"
arguments = [1]

[[sinks]]
kind = "call"
name = "sqlite3_prepare_v3"
arguments = [1]

[[sinks]]
kind = "call"
name = "sqlite3_prepare16"
arguments = [1]

[[sinks]]
kind = "call"
name = "sqlite3_prepare16_v2"
arguments = [1]

[[sinks]]
kind = "call"
name = "sqlite3_prepare16_v3"
arguments = [1]

[[sinks]]
kind = "call"
name = "sqlite3_exec"
arguments = [1]

