# Documentation rules for Swift, the standard preset's Checkstyle JavadocMethod. A documented
# function must document each parameter, its return value and its thrown errors.

[[rules]]
id = "ward:swift/javadoc-method"
language = "swift"
capability = "SYNTAX"
severity = "error"
category = "javadoc"
presets = ["standard", "strict"]
body = '''
check = "javadoc-method"
message = "documentation of the function has no {value} tag"
'''

[[rules]]
id = "ward:swift/constructors-declaration-grouping"
language = "swift"
capability = "SYNTAX"
severity = "error"
category = "coding"
presets = ["standard", "strict"]
body = '''
check = "constructor-group"
message = "initializer is declared after other members; group the initializers together"
'''

[[rules]]
id = "ward:swift/custom-import-order"
language = "swift"
capability = "SYNTAX"
severity = "error"
category = "imports"
presets = ["standard", "strict"]
body = '''
check = "import-sort"
message = "import '{value}' is out of order; sort the imports by name"
'''

[[rules]]
id = "ward:swift/unused-imports"
language = "swift"
capability = "SYNTAX"
severity = "warning"
category = "imports"
presets = ["standard", "strict"]
body = '''
check = "unused-import"
message = "import '{value}' is not referenced in this file"
'''
