# PosixRawTerminal calls libc through the FFM Linker; grant native access so
# restricted-method warnings are not printed at run time.
# Fory 1.7.8 and later need nothing here: its GraalVM Feature generates and
# registers the JSON codecs of the @JsonType holders at image build time.
# The serial collector's default policy keeps the heap close to the live set and collects fully
# every couple of seconds; BySpaceAndTime sizes the generations from the time spent collecting
# (#601). It sets no heap size, so Ward still starts on a small machine.
Args=--enable-native-access=ALL-UNNAMED \
  -R:InitialCollectionPolicy=BySpaceAndTime
