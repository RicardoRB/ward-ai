scope = "text"
capability = "TEXT"
severity = "error"
category = "secrets"
options.entropy = { type = "number", min = 0 }
body = '''
check = "secret-scan"
description = 'Sourcegraph is a code search and navigation engine.'
message = "Potential secret detected by rule sourcegraph-access-token. Remove it and rotate the credential."
regex = "(?i)\\b(\\b(sgp_(?:[a-fA-F0-9]{16}|local)_[a-fA-F0-9]{40}|sgp_[a-fA-F0-9]{40}|[a-fA-F0-9]{40})\\b)(?:[\\x60'\"\\s;]|\\\\[nr]|$)"
keywords = ['sgp_', 'sourcegraph']
entropy = 3.0
allowlist = "default"
'''

