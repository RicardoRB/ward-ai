# Rules of pmd-7.29.0 that Ward does not implement, with the reason for each group.

[[group]]
reason = "deprecated upstream"
rules = [
  "AvoidCatchingNPE",
  "AvoidCatchingThrowable",
  "AvoidLosingExceptionInformation",
  "AvoidProtectedFieldInFinalClass",
  "AvoidProtectedMethodInFinalClassNotExtending",
  "CheckSkipResult",
  "DefaultLabelNotLastInSwitchStmt",
  "GenericsNaming",
  "JUnit4TestShouldUseAfterAnnotation",
  "JUnit4TestShouldUseBeforeAnnotation",
  "JUnit4TestShouldUseTestAnnotation",
  "JUnit5TestShouldBePackagePrivate",
  "JUnitAssertionsShouldIncludeMessage",
  "JUnitTestContainsTooManyAsserts",
  "JUnitTestsShouldIncludeAssert",
  "NonCaseLabelInSwitchStatement",
  "ReplaceVectorWithList",
  "TooFewBranchesForASwitchStatement",
  "UnnecessaryLocalBeforeReturn",
  "UseArrayListInsteadOfVector",
  "UseObjectForClearerAPI",
  "UselessOperationOnImmutable",
  "UselessPureMethodCall",
]

[[group]]
reason = "the name is a Java keyword (assert since 1.4, enum since 5), so source that uses it as an identifier does not parse on any Java release Ward supports (8 and later)"
rules = [
  "AvoidAssertAsIdentifier",
  "AvoidEnumAsIdentifier",
]
