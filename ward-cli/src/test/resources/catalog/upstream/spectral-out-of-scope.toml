# Rules of Spectral 6.17.1 (spectral:oas with "all" and the OWASP ruleset 2.0.1) that Ward does not implement, with the reason for each group.

[[group]]
reason = "Swagger 2.0 documents are not supported: the gate ends with an execution error on them"
rules = [
  "oas2-anyOf",
  "oas2-api-host",
  "oas2-api-schemes",
  "oas2-discriminator",
  "oas2-host-not-example",
  "oas2-host-trailing-slash",
  "oas2-oneOf",
  "oas2-operation-formData-consume-check",
  "oas2-operation-security-defined",
  "oas2-parameter-description",
  "oas2-schema",
  "oas2-unused-definition",
  "oas2-valid-media-example",
  "oas2-valid-schema-example",
  "owasp:api8:2023-no-scheme-http",
]

[[group]]
reason = "OpenAPI 3.2 documents are not supported: the gate ends with an execution error on them"
rules = [
  "oas3_2-no-deprecated-xml-attribute",
]
