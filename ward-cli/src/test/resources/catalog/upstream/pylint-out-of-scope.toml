# Rules of pylint-4.1.3 that Ward does not implement, with the reason for each group.

[[group]]
reason = "Pylint run failure, not a check of user code"
rules = [
  "astroid-error",
  "config-parse-error",
  "fatal",
  "method-check-failed",
  "parse-error",
]

[[group]]
reason = "formatting: covered by ward format"
rules = [
  "bad-indentation",
  "missing-final-newline",
  "mixed-line-endings",
  "multiple-statements",
  "superfluous-parens",
  "trailing-newlines",
  "unexpected-line-ending-format",
]

[[group]]
reason = "suppression: Ward has no inline suppressions"
rules = [
  "bad-inline-option",
  "deprecated-pragma",
  "file-ignored",
  "locally-disabled",
  "suppressed-message",
  "use-symbolic-message-instead",
  "useless-suppression",
]

[[group]]
reason = "informational message of the Pylint run, not a check"
rules = [
  "c-extension-no-member",
  "raw-checker-failed",
]

[[group]]
reason = "needs inference of the format argument's attributes: pylint checks the attribute chain of an inferred object, which Ward does not infer"
rules = [
  "missing-format-attribute",
]

[[group]]
reason = "a raw carriage return cannot reach a string literal of a parsed Python unit: the tokenizer ends the line at a CR, so no fixture or unit can show the finding"
rules = [
  "invalid-character-carriage-return",
]
