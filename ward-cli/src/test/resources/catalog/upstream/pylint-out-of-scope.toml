# Rules of pylint-4.1.3 that Ward does not implement, with the reason for each group.

[[group]]
reason = "Pylint run failure, not a check of user code"
rules = [
  "astroid-error",
  "config-parse-error",
  "fatal",
  "method-check-failed",
  "parse-error",
]

[[group]]
reason = "formatting: covered by ward format"
rules = [
  "bad-indentation",
  "missing-final-newline",
  "mixed-line-endings",
  "multiple-statements",
  "superfluous-parens",
  "trailing-newlines",
  "unexpected-line-ending-format",
]

[[group]]
reason = "suppression: Ward has no inline suppressions"
rules = [
  "bad-inline-option",
  "deprecated-pragma",
  "file-ignored",
  "locally-disabled",
  "suppressed-message",
  "use-symbolic-message-instead",
  "useless-suppression",
]

[[group]]
reason = "informational message of the Pylint run, not a check"
rules = [
  "c-extension-no-member",
  "raw-checker-failed",
]

[[group]]
reason = "Pylint configuration and pragma checks; Ward has no Pylint configuration"
rules = [
  "unknown-option-value",
  "unrecognized-option",
  "useless-option-value",
  "unrecognized-inline-option",
]

[[group]]
reason = "reports only modules listed in the preferred-modules option, empty by default"
rules = [
  "preferred-module",
]

[[group]]
reason = "needs operand type inference"
rules = [
  "unsupported-binary-operation",
  "wrong-exception-operation",
]

[[group]]
reason = "needs the package root"
rules = [
  "relative-beyond-top-level",
]

[[group]]
reason = "the configured Python version is enforced by the type checker (mypy stays a gate)"
rules = [
  "using-assignment-expression-in-unsupported-version",
  "using-comprehension-unpacking-in-unsupported-version",
  "using-exception-groups-in-unsupported-version",
  "using-f-string-in-unsupported-version",
  "using-final-decorator-in-unsupported-version",
  "using-generic-type-syntax-in-unsupported-version",
  "using-positional-only-args-in-unsupported-version",
]

[[group]]
reason = "parse failures are reported by Ward's analysis itself"
rules = [
  "syntax-error",
]
