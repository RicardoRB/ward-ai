# Rules of pylint-4.1.3 that Ward does not implement, with the reason for each group.

[[group]]
reason = "Pylint run failure, not a check of user code"
rules = [
  "astroid-error",
  "config-parse-error",
  "fatal",
  "method-check-failed",
  "parse-error",
]

[[group]]
reason = "formatting: covered by ward format"
rules = [
  "bad-indentation",
  "missing-final-newline",
  "mixed-line-endings",
  "multiple-statements",
  "superfluous-parens",
  "trailing-newlines",
  "unexpected-line-ending-format",
]

[[group]]
reason = "suppression: Ward has no inline suppressions"
rules = [
  "bad-inline-option",
  "deprecated-pragma",
  "file-ignored",
  "locally-disabled",
  "suppressed-message",
  "use-symbolic-message-instead",
  "useless-suppression",
]

[[group]]
reason = "informational message of the Pylint run, not a check"
rules = [
  "c-extension-no-member",
  "raw-checker-failed",
]

[[group]]
reason = "needs inference of the format argument's attributes: pylint checks the attribute chain of an inferred object, which Ward does not infer"
rules = [
  "missing-format-attribute",
]

[[group]]
reason = "a raw carriage return cannot reach a string literal of a parsed Python unit: the tokenizer ends the line at a CR, so no fixture or unit can show the finding"
rules = [
  "invalid-character-carriage-return",
]

[[group]]
reason = "needs the type of the callee, operand, iterable, mapping or subscripted object, which Ward does not infer"
rules = [
  "invalid-sequence-index",
  "invalid-slice-index",
  "invalid-slice-step",
  "invalid-unary-operand-type",
  "kwarg-superseded-by-positional-arg",
  "looping-through-iterator",
  "missing-kwoa",
  "modified-iterating-dict",
  "modified-iterating-list",
  "no-member",
  "no-name-in-module",
  "no-value-for-parameter",
  "non-iterator-returned",
  "not-a-mapping",
  "not-an-iterable",
  "not-async-context-manager",
  "not-callable",
  "not-context-manager",
  "positional-only-arguments-expected",
]


[[group]]
reason = "needs class hierarchy inference (base classes, metaclasses, inherited or hidden attributes), which Ward does not infer"
rules = [
  "invalid-enum-extension",
  "invalid-metaclass",
  "invalid-overridden-method",
  "method-hidden",
  "non-parent-init-called",
  "overridden-final-method",
]


[[group]]
reason = "the rule input is a parsed unit without its file name, so the file name cannot be checked"
rules = [
  "non-ascii-file-name",
]


[[group]]
reason = "needs inference of the statement's value as an exception instance"
rules = [
  "pointless-exception-statement",
]

[[group]]
reason = "needs Pylint's inference of the receiver or of the called function's result; Ward does not infer expression types"
rules = [
  "misplaced-format-function",
  "missing-parentheses-for-call-in-test",
]
