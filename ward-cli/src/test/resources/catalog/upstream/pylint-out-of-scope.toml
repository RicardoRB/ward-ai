# Rules of pylint-4.1.3 that Ward does not implement, with the reason for each group.

[[group]]
reason = "Pylint run failure, not a check of user code"
rules = [
  "astroid-error",
  "config-parse-error",
  "fatal",
  "method-check-failed",
  "parse-error",
]

[[group]]
reason = "formatting: covered by ward format"
rules = [
  "bad-indentation",
  "missing-final-newline",
  "mixed-line-endings",
  "multiple-statements",
  "superfluous-parens",
  "trailing-newlines",
  "unexpected-line-ending-format",
]

[[group]]
reason = "suppression: Ward has no inline suppressions"
rules = [
  "bad-inline-option",
  "deprecated-pragma",
  "file-ignored",
  "locally-disabled",
  "suppressed-message",
  "use-symbolic-message-instead",
  "useless-suppression",
]

[[group]]
reason = "informational message of the Pylint run, not a check"
rules = [
  "c-extension-no-member",
  "raw-checker-failed",
]

[[group]]
reason = "Ward reads sources as UTF-8; a non-UTF-8 source encoding is not analyzed"
rules = [
  "bad-file-encoding",
]

[[group]]
reason = "needs a spelling dictionary (pyenchant); Pylint disables it unless one is configured"
rules = [
  "invalid-characters-in-docstring",
  "wrong-spelling-in-comment",
  "wrong-spelling-in-docstring",
]
