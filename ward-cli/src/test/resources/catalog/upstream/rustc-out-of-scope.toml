[[group]]
reason = "reported when a project moves to another edition; `cargo fix --edition` applies the fix"
rules = [
  "array-into-iter",
  "boxed-slice-into-iter",
  "closure-returning-async-block",
  "dependency-on-unit-never-type-fallback",
  "deprecated-in-future",
