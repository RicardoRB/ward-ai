# Rules of angular-eslint-22.6.0 that Ward does not implement, with the reason for each group.

[[group]]
reason = "Angular HTML templates are not an engine language"
rules = [
  "alt-text",
  "attributes-order",
  "banana-in-box",
  "button-has-type",
  "click-events-have-key-events",
  "conditional-complexity",
  "cyclomatic-complexity",
  "elements-content",
  "eqeqeq",
  "i18n",
  "interactive-supports-focus",
  "label-has-associated-control",
  "mouse-events-have-key-events",
  "no-any",
  "no-autofocus",
  "no-call-expression",
  "no-distracting-elements",
  "no-duplicate-attributes",
  "no-empty-control-flow",
  "no-inline-styles",
  "no-interpolation-in-attributes",
  "no-negated-async",
  "no-nested-tags",
  "no-non-null-assertion",
  "no-outerhtml",
  "no-positive-tabindex",
  "prefer-at-else",
  "prefer-at-empty",
  "prefer-built-in-pipes",
  "prefer-class-binding",
  "prefer-contextual-for-variables",
  "prefer-control-flow",
  "prefer-ngsrc",
  "prefer-self-closing-tags",
  "prefer-static-string-properties",
  "prefer-style-binding",
  "prefer-template-literal",
  "require-switch-default",
  "role-has-required-aria",
  "table-scope",
  "use-track-by-function",
  "valid-aria",
]
