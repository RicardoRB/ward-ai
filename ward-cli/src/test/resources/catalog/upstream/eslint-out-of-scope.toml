# Rules of eslint-10.12.0 that Ward does not implement, with the reason for each group.

[[group]]
reason = "formatting: covered by ward format"
rules = [
  "array-bracket-newline",
  "array-bracket-spacing",
  "array-element-newline",
  "arrow-parens",
  "arrow-spacing",
  "block-spacing",
  "brace-style",
  "comma-dangle",
  "comma-spacing",
  "comma-style",
  "computed-property-spacing",
  "dot-location",
  "eol-last",
  "func-call-spacing",
  "function-call-argument-newline",
  "function-paren-newline",
  "generator-star-spacing",
  "implicit-arrow-linebreak",
  "indent",
  "indent-legacy",
  "jsx-quotes",
  "key-spacing",
  "keyword-spacing",
  "line-comment-position",
  "linebreak-style",
  "lines-around-comment",
  "lines-around-directive",
  "lines-between-class-members",
  "max-statements-per-line",
  "multiline-comment-style",
  "multiline-ternary",
  "new-parens",
  "newline-after-var",
  "newline-before-return",
  "newline-per-chained-call",
  "no-confusing-arrow",
  "no-extra-parens",
  "no-extra-semi",
  "no-floating-decimal",
  "no-mixed-operators",
  "no-mixed-spaces-and-tabs",
  "no-multi-spaces",
  "no-multiple-empty-lines",
  "no-spaced-func",
  "no-tabs",
  "no-trailing-spaces",
  "no-whitespace-before-property",
  "nonblock-statement-body-position",
  "object-curly-newline",
  "object-curly-spacing",
  "object-property-newline",
  "one-var-declaration-per-line",
  "operator-linebreak",
  "padded-blocks",
  "padding-line-between-statements",
  "quote-props",
  "quotes",
  "rest-spread-spacing",
  "semi",
  "semi-spacing",
  "semi-style",
  "space-before-blocks",
  "space-before-function-paren",
  "space-in-parens",
  "space-infix-ops",
  "space-unary-ops",
  "spaced-comment",
  "switch-colon-spacing",
  "template-curly-spacing",
  "template-tag-spacing",
  "unicode-bom",
  "wrap-iife",
  "wrap-regex",
  "yield-star-spacing",
]

[[group]]
reason = "deprecated upstream"
rules = [
  "callback-return",
  "global-require",
  "handle-callback-err",
  "id-blacklist",
  "no-buffer-constructor",
  "no-catch-shadow",
  "no-mixed-requires",
  "no-native-reassign",
  "no-negated-in-lhs",
  "no-new-object",
  "no-new-require",
  "no-new-symbol",
  "no-path-concat",
  "no-process-env",
  "no-process-exit",
  "no-restricted-modules",
  "no-return-await",
  "no-sync",
  "prefer-reflect",
]
