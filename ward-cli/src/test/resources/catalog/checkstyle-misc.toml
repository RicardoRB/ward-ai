# Rule catalog rows, one [[rule]] per Ward rule concept. Edit by hand; the reference page website/src/content/docs/reference/rules.mdx is generated from these files.

[[rule]]
name = "array-type-style"
category = "misc"
presets = ["standard", "strict"]
status = { java = "planned", kotlin = "planned", typescript = "not-applicable", javascript = "not-applicable", python = "not-applicable", swift = "planned" }
not-applicable = { typescript = "C-style array declarators such as a[] after the name do not exist in JavaScript or TypeScript", javascript = "C-style array declarators such as a[] after the name do not exist in JavaScript or TypeScript", python = "Java array declaration syntax; Python has no array declarations" }
issues = { java = "#293", kotlin = "#294", swift = "#298" }
typescript-eslint = ["array-type"]
checkstyle = ["ArrayTypeStyle"]

