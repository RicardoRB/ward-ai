# Rule catalog rows, one [[rule]] per Ward rule concept. Edit by hand; the reference page website/src/content/docs/reference/rules.mdx is generated from these files.

[[rule]]
name = "array-type-style"
category = "misc"
presets = ["standard", "strict"]
status = { java = "planned", kotlin = "planned", typescript = "planned", javascript = "planned", python = "not-applicable", swift = "not-applicable" }
not-applicable = { python = "Java array declaration syntax; Python has no array declarations", swift = "Swift has one array syntax, [Element], so there is no C-style declarator to flag" }
issues = { java = "#293", kotlin = "#294", typescript = "#296", javascript = "#296" }
typescript-eslint = ["array-type"]
checkstyle = ["ArrayTypeStyle"]

