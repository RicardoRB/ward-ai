# Rule catalog rows, one [[rule]] per Ward rule concept. Edit by hand; the reference page website/src/content/docs/reference/rules.mdx is generated from these files.

[[rule]]
name = "cognitive-complexity"
pmd = ["CognitiveComplexity"]

[[rule]]
name = "naming"
eslint = ["camelcase"]

[[rule]]
name = "nesting-depth"
detekt = ["NestedBlockDepth"]
eslint = ["max-depth"]

[[rule]]
name = "type-body-length"
swiftlint = ["type_body_length"]

[[rule]]
name = "unused-assignment"
pmd = ["UnusedAssignment"]
eslint = ["no-useless-assignment"]

[[rule]]
name = "sql-injection"
spotbugs = ["SQL_NONCONSTANT_STRING_PASSED_TO_EXECUTE", "SQL_PREPARED_STATEMENT_GENERATED_FROM_NONCONSTANT_STRING"]
cwe = ["CWE-89"]
sources = ["https://sidorares.github.io/node-mysql2/docs", "https://node-postgres.com/features/queries", "https://sequelize.org/docs/v6/core-concepts/raw-queries/", "https://www.prisma.io/docs/orm/prisma-client/queries/raw-database-access/raw-queries", "https://cwe.mitre.org/data/definitions/89.html", "https://peps.python.org/pep-0249/#paramstyle", "https://docs.python.org/3/library/sqlite3.html#sqlite3-placeholders", "https://docs.djangoproject.com/en/5.1/topics/db/sql/#passing-parameters-into-raw", "https://bandit.readthedocs.io/en/latest/plugins/b608_hardcoded_sql_expressions.html"]

[[rule]]
name = "command-injection"

[[rule]]
name = "path-traversal"
ids = { java = "ward:java/path-injection", kotlin = "ward:kotlin/path-injection" }
spotbugs = ["PT_ABSOLUTE_PATH_TRAVERSAL", "PT_RELATIVE_PATH_TRAVERSAL"]
cwe = ["CWE-22"]
sources = ["https://docs.python.org/3/library/tarfile.html#extraction-filters", "https://flask.palletsprojects.com/en/stable/api/#flask.send_from_directory", "https://cwe.mitre.org/data/definitions/22.html"]

[[rule]]
name = "xss"
ids = { java = "ward:java/cross-site-scripting", kotlin = "ward:kotlin/cross-site-scripting" }
spotbugs = ["XSS_REQUEST_PARAMETER_TO_SERVLET_WRITER", "XSS_REQUEST_PARAMETER_TO_JSP_WRITER", "XSS_REQUEST_PARAMETER_TO_SEND_ERROR"]
cwe = ["CWE-79"]
sources = ["https://cwe.mitre.org/data/definitions/79.html", "https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/io/PrintWriter.html", "https://jakarta.ee/specifications/servlet/6.0/apidocs/jakarta.servlet/jakarta/servlet/servletoutputstream"]

[[rule]]
name = "no-field-di"

[[rule]]
name = "no-standard-streams"
