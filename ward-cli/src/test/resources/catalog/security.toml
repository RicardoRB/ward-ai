sources = ["https://docs.oracle.com/en/java/javase/21/docs/specs/security/standard-names.html", "https://docs.oracle.com/en/java/javase/21/docs/api/java.base/javax/crypto/Cipher.html", "https://cwe.mitre.org/data/definitions/327.html", "https://nodejs.org/docs/latest-v22.x/api/crypto.html#cryptocreatecipherivalgorithm-key-iv-options", "https://developer.apple.com/documentation/security/1399291-cccrypt", "https://developer.apple.com/documentation/cryptokit/aes/gcm"]

[[rule]]
name = "weak-gcm-tag-length"
cwe = ["CWE-328", "CWE-353"]
sources = ["https://nodejs.org/docs/latest-v22.x/api/crypto.html#ccm-mode", "https://nodejs.org/docs/latest-v22.x/api/crypto.html#cryptocreatedecipherivalgorithm-key-iv-options", "https://cwe.mitre.org/data/definitions/353.html"]

[[rule]]
name = "weak-hash"
cwe = ["CWE-328", "CWE-327"]
sources = ["https://docs.oracle.com/en/java/javase/21/docs/specs/security/standard-names.html", "https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/security/MessageDigest.html", "https://commons.apache.org/proper/commons-codec/apidocs/org/apache/commons/codec/digest/DigestUtils.html", "https://cwe.mitre.org/data/definitions/328.html", "https://cwe.mitre.org/data/definitions/327.html", "https://nodejs.org/docs/latest-v22.x/api/crypto.html#cryptocreatehashalgorithm-options", "https://developer.mozilla.org/en-US/docs/Web/API/SubtleCrypto/digest", "https://developer.apple.com/documentation/cryptokit/insecure", "https://developer.apple.com/documentation/cryptokit/sha256"]

[[rule]]
name = "weak-key-size"
cwe = ["CWE-326"]
sources = ["https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/security/KeyPairGenerator.html", "https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/security/spec/RSAKeyGenParameterSpec.html", "https://cwe.mitre.org/data/definitions/326.html", "https://nodejs.org/docs/latest-v22.x/api/crypto.html#cryptogeneratekeypairsynctype-options"]

[[rule]]
name = "weak-password-hash"
cwe = ["CWE-916", "CWE-328"]
sources = ["https://docs.python.org/3/library/hashlib.html#key-derivation", "https://docs.djangoproject.com/en/5.1/topics/auth/passwords/#included-hashers", "https://cwe.mitre.org/data/definitions/916.html", "https://cwe.mitre.org/data/definitions/328.html"]

[[rule]]
name = "weak-random"
cwe = ["CWE-338"]
sources = ["https://developer.apple.com/documentation/swift/systemrandomnumbergenerator", "https://developer.apple.com/documentation/security/1399291-secrandomcopybytes", "https://cwe.mitre.org/data/definitions/338.html"]

[[rule]]
name = "weak-tls-protocol"
cwe = ["CWE-327", "CWE-326"]
sources = ["https://docs.oracle.com/en/java/javase/21/docs/api/java.base/javax/net/ssl/SSLContext.html", "https://docs.oracle.com/en/java/javase/21/docs/specs/security/standard-names.html#sslcontext-algorithms", "https://cwe.mitre.org/data/definitions/327.html", "https://cwe.mitre.org/data/definitions/326.html"]

[[rule]]
name = "wildcard-post-message"
cwe = ["CWE-345", "CWE-346"]
sources = ["https://developer.mozilla.org/en-US/docs/Web/API/Window/postMessage#security_concerns", "https://cwe.mitre.org/data/definitions/345.html", "https://cwe.mitre.org/data/definitions/346.html"]

[[rule]]
name = "xml-external-entities"
cwe = ["CWE-611"]
sources = ["https://docs.oracle.com/en/java/javase/21/docs/api/java.xml/javax/xml/parsers/DocumentBuilderFactory.html", "https://docs.oracle.com/en/java/javase/21/docs/api/java.xml/javax/xml/stream/XMLInputFactory.html", "https://cwe.mitre.org/data/definitions/611.html", "https://github.com/libxmljs/libxmljs/wiki/Parsing-XML", "https://owasp.org/www-community/vulnerabilities/XML_External_Entity_(XXE)_Processing", "https://lxml.de/parsing.html#parser-options", "https://docs.python.org/3/library/xml.sax.handler.html#xml.sax.handler.feature_external_ges"]

[[rule]]
name = "xpath-injection"
cwe = ["CWE-643"]
sources = ["https://docs.oracle.com/en/java/javase/21/docs/api/java.xml/javax/xml/xpath/XPath.html", "https://dom4j.github.io/javadoc/2.1.4/org/dom4j/Node.html", "https://cwe.mitre.org/data/definitions/643.html"]
