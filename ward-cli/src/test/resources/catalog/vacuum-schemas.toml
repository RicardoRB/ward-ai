# Rule catalog rows, one [[rule]] per Ward rule concept. Edit by hand; the reference page website/src/content/docs/reference/rules.mdx is generated from these files.

[[rule]]
name = "allof-conflicts"
vacuum = ["allof-conflicts"]

[[rule]]
name = "camel-case-properties"
vacuum = ["camel-case-properties"]

[[rule]]
name = "duplicated-entry-in-enum"
vacuum = ["duplicated-entry-in-enum"]

[[rule]]
name = "no-unnecessary-combinator"
vacuum = ["no-unnecessary-combinator"]

[[rule]]
name = "nullable-enum-contains-null"
vacuum = ["nullable-enum-contains-null"]

[[rule]]
name = "oas-missing-type"
vacuum = ["oas-missing-type"]

[[rule]]
name = "oas-schema-check"
presets = ["standard", "strict"]
category = "correctness"
vacuum = ["oas-schema-check"]

[[rule]]
name = "oas3-schema"
presets = ["standard", "strict"]
category = "correctness"
vacuum = ["oas3-schema"]

[[rule]]
name = "oas3-unused-component"
vacuum = ["oas3-unused-component"]

[[rule]]
name = "required-fields-defined"
vacuum = ["required-fields-defined"]

[[rule]]
name = "typed-enum"
vacuum = ["typed-enum"]
