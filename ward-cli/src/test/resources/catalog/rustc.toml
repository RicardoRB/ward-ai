# Rule catalog rows of the rustc lints for Rust, one [[rule]] per Ward rule concept. Edit by hand; the status of each row is in status/rust/rustc.toml.

[[rule]]
name = "absolute-paths-not-starting-with-crate"
category = "style"
rustc = ["absolute-paths-not-starting-with-crate"]

[[rule]]
name = "anonymous-parameters"
category = "style"
rustc = ["anonymous-parameters"]

[[rule]]
name = "break-with-label-and-loop"
category = "style"
rustc = ["break-with-label-and-loop"]

[[rule]]
name = "confusable-idents"
category = "style"
rustc = ["confusable-idents"]

[[rule]]
name = "dead-code"
category = "style"
rustc = ["dead-code"]

[[rule]]
name = "double-negations"
rustc = ["double-negations"]

[[rule]]
name = "duplicate-macro-attributes"
category = "style"
rustc = ["duplicate-macro-attributes"]

[[rule]]
name = "elided-lifetimes-in-paths"
category = "style"
rustc = ["elided-lifetimes-in-paths"]

[[rule]]
name = "ellipsis-inclusive-range-patterns"
category = "style"
rustc = ["ellipsis-inclusive-range-patterns"]

[[rule]]
name = "explicit-outlives-requirements"
category = "style"
rustc = ["explicit-outlives-requirements"]

[[rule]]
name = "irrefutable-let-patterns"
category = "style"
rustc = ["irrefutable-let-patterns"]

[[rule]]
name = "macro-use-extern-crate"
category = "style"
rustc = ["macro-use-extern-crate"]

[[rule]]
name = "missing-docs"
category = "style"
rustc = ["missing-docs"]

[[rule]]
name = "mixed-script-confusables"
category = "style"
rustc = ["mixed-script-confusables"]

[[rule]]
name = "named-arguments-used-positionally"
