rustc = ["named-arguments-used-positionally"]

[[rule]]
name = "no-mangle-const-items"
category = "style"
rustc = ["no-mangle-const-items"]

[[rule]]
name = "no-mangle-generic-items"
category = "style"
rustc = ["no-mangle-generic-items"]

[[rule]]
name = "non-ascii-idents"
rustc = ["non-ascii-idents"]

[[rule]]
name = "non-camel-case-types"
