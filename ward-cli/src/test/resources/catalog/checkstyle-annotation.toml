# Rule catalog rows, one [[rule]] per Ward rule concept. Edit by hand; the reference page website/src/content/docs/reference/rules.mdx is generated from these files.

[[rule]]
name = "annotation-location"
category = "annotation"
presets = ["standard", "strict"]
not-applicable = { python = "Java annotation placement; Python decorators have no Checkstyle counterpart" }
checkstyle = ["AnnotationLocation"]

[[rule]]
name = "annotation-on-same-line"
