[[rule]]
name = "missing-deprecated"
category = "annotation"
presets = ["strict"]
not-applicable = { python = "Java @Deprecated annotation; Python uses warnings for deprecation" }
checkstyle = ["MissingDeprecated"]

[[rule]]
name = "missing-override"
category = "annotation"
presets = ["strict"]
not-applicable = { python = "Java @Override annotation; Python has no override keyword" }
pmd = ["MissingOverride"]
checkstyle = ["MissingOverride"]
errorprone = ["MissingOverride"]

