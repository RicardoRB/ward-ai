# Rule catalog rows, one [[rule]] per Ward rule concept. Edit by hand; the reference page website/src/content/docs/reference/rules.mdx is generated from these files.

[[rule]]
name = "avoid-nested-blocks"
category = "blocks"
presets = ["strict"]
not-applicable = { python = "Java block statements; Python has no bare nested blocks" }
checkstyle = ["AvoidNestedBlocks"]
eslint = ["no-lone-blocks"]

[[rule]]
name = "empty-block"
category = "blocks"
presets = ["strict"]
not-applicable = { python = "Python requires a statement in every block, and pass is one; there is no empty block to report" }
detekt = ["EmptyFunctionBlock"]
pmd = ["EmptyControlStatement"]
checkstyle = ["EmptyBlock"]
ktlint = ["no-empty-class-body"]
eslint = ["no-empty"]
biome = ["noEmptyBlockStatements"]

[[rule]]
name = "empty-catch-block"
category = "blocks"
presets = ["standard", "strict"]
detekt = ["EmptyCatchBlock"]
pmd = ["EmptyCatchBlock"]
checkstyle = ["EmptyCatchBlock"]
ruff = ["S110"]

[[rule]]
name = "google-right-curly"
category = "blocks"
presets = ["standard", "strict"]
not-applicable = { python = "Python blocks are indentation-based, so there are no braces to place" }
checkstyle = ["GoogleRightCurly"]

[[rule]]
name = "left-curly"
category = "blocks"
presets = ["standard", "strict"]
not-applicable = { python = "Python blocks are indentation-based, so there are no braces to place" }
checkstyle = ["LeftCurly"]

[[rule]]
name = "need-braces"
category = "blocks"
presets = ["standard", "strict"]
not-applicable = { python = "Python blocks are indentation-based, so there are no braces to omit" }
detekt = ["BracesOnIfStatements"]
checkstyle = ["NeedBraces"]
ktlint = ["if-else-bracing"]
eslint = ["curly"]
biome = ["useBlockStatements"]

[[rule]]
name = "right-curly"
category = "blocks"
presets = ["strict"]
not-applicable = { python = "Python blocks are indentation-based, so there are no braces to place" }
checkstyle = ["RightCurly"]
