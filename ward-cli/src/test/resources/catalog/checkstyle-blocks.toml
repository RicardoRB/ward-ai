# Rule catalog rows, one [[rule]] per Ward rule concept. Edit by hand; the reference page website/src/content/docs/reference/rules.mdx is generated from these files.

[[rule]]
name = "avoid-nested-blocks"
category = "blocks"
presets = ["strict"]
status = { java = "planned", kotlin = "planned", typescript = "planned", javascript = "planned", python = "planned", swift = "planned" }
issues = { java = "#286", kotlin = "#294", typescript = "#296", javascript = "#296", python = "#297", swift = "#298" }
checkstyle = ["AvoidNestedBlocks"]
eslint = ["no-lone-blocks"]

