openapi: 3.0.3
info:
  title: T
  version: "1"
paths:
  /pets:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [id, name]
              properties:
                id: {type: integer, readOnly: true}
                name: {type: string}
            example:
              name: 5
      responses:
        "200":
          description: ok
          headers:
            X-Count:
              schema: {type: integer}
              example: many
          content:
            application/json:
              schema:
                type: object
                required: [id, secret]
                properties:
                  id: {type: integer}
                  secret: {type: string, writeOnly: true}
              examples:
                bad:
                  value: {id: x}
                good:
                  value: {id: 1}
                external:
                  externalValue: https://example.org/e.json
                missing:
                  summary: nothing
    get:
      parameters:
        - name: limit
          in: query
          schema: {type: integer}
          example: ten
        - name: tags
          in: query
          schema: {type: array, items: {type: string}}
          examples:
            one:
              value: [a, 1]
      responses:
        "200":
          description: ok
