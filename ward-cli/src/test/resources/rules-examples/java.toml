# One example rule per generic check kind, for Java. They are test data: no bundled rule file lists
# them, so they never run on a user's project. The grammar node names are the ANTLR Java rule names.

[[rules]]
id = "ward:java/example-constant-name"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "naming"
presets = ["standard", "strict"]
options.pattern = { type = "regex" }
body = '''
check = "identifier-pattern"
kinds = ["fieldDeclaration"]
modifiers = ["static", "final"]
name = "identifier"
skip = ["annotation", "typeType"]
pattern = "[A-Z][A-Z0-9_]*"
message = "constant '{value}' must match [A-Z][A-Z0-9_]*"
'''

[[rules]]
id = "ward:java/example-inline-conditional"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "coding"
presets = ["standard", "strict"]
options.text = { type = "regex" }
body = '''
check = "forbidden-node"
kinds = ["expression"]
with-child = ["'?'"]
message = "avoid the inline conditional"
'''

[[rules]]
id = "ward:java/example-switch-default"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "coding"
presets = ["standard", "strict"]
body = '''
check = "required-node"
kinds = ["statement>'switch'"]
descendant = ["'default'"]
skip = ["blockStatement"]
message = "switch needs a default label"
'''

[[rules]]
id = "ward:java/example-method-count"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "sizes"
presets = ["standard", "strict"]
options.max = { type = "integer", min = 0 }
body = '''
check = "count"
kinds = ["classBody"]
counted = ["methodDeclaration"]
skip = ["classBody"]
max = 2
message = "class has {value} methods; the limit is {max}"
'''

[[rules]]
id = "ward:java/example-nested-if"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "sizes"
presets = ["standard", "strict"]
options.max = { type = "integer", min = 0 }
body = '''
check = "depth"
kinds = ["statement>'if'"]
reset = ["methodDeclaration"]
max = 1
message = "if is nested {value} deep; the limit is {max}"
'''

[[rules]]
id = "ward:java/example-todo-comment"
language = "java"
capability = "SYNTAX"
severity = "warning"
category = "comments"
presets = ["standard", "strict"]
options.pattern = { type = "regex" }
options.limit = { type = "integer", min = 0 }
body = '''
check = "text-pattern"
target = "comments"
pattern = "TODO:"
message = "resolve the TODO: {value}"
'''

[[rules]]
id = "ward:java/example-modifier-order"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "modifiers"
presets = ["standard", "strict"]
options.order = { type = "string-list" }
body = '''
check = "order"
kinds = ["classBodyDeclaration"]
order = ["public", "protected", "private", "abstract", "static", "final"]
message = "modifier '{value}' is out of order"
'''

[[rules]]
id = "ward:java/example-magic-number"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "coding"
presets = ["standard", "strict"]
options.ignore = { type = "string-list" }
options.ignore-contexts = { type = "string-list" }
options.max-repeats = { type = "integer", min = -1 }
body = '''
check = "literal"
kinds = ["integerLiteral"]
ignore = ["-1", "0", "1", "2"]
ignore-contexts = ["fieldDeclaration"]
message = "'{value}' is a magic number"
'''

[[rules]]
id = "ward:java/example-redundant-import"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "imports"
presets = ["standard", "strict"]
body = '''
check = "duplicate"
kinds = ["compilationunit"]
items = ["importDeclaration"]
key = "qualifiedName"
message = "duplicate import {value}"
'''

[[rules]]
id = "ward:java/example-overload-order"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "coding"
presets = ["standard", "strict"]
body = '''
check = "order"
kinds = ["classBody"]
order = ["classBodyDeclaration>memberDeclaration"]
group-by = "identifier"
group-skip = ["modifier", "annotation", "typeTypeOrVoid", "typeType", "formalParameters", "methodBody"]
message = "overload '{value}' must stay with the other methods of that name"
'''
