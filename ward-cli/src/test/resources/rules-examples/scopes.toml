# Example rules of the scope and binding analysis (#361): an undefined-name rule and an
# unused-binding rule for each language. Test data, like java.toml and python.toml.

[[rules]]
id = "ward:python/example-undefined-name"
language = "python"
capability = "SCOPES"
severity = "error"
category = "coding"
presets = ["strict"]
body = '''
check = "undefined-name"
message = "undefined name '{value}'"
'''

[[rules]]
id = "ward:python/example-unused-binding"
language = "python"
capability = "SCOPES"
severity = "error"
category = "coding"
presets = ["strict"]
body = '''
check = "unused-binding"
message = "local variable '{value}' is assigned to but never used"
'''

[[rules]]
id = "ward:javascript/example-undefined-name"
language = "javascript"
capability = "SCOPES"
severity = "error"
category = "coding"
presets = ["strict"]
options.env = { type = "string-list" }
body = '''
check = "undefined-name"
env = ["es2024", "browser", "node"]
message = "'{value}' is not defined"
'''

[[rules]]
id = "ward:javascript/example-unused-binding"
language = "javascript"
capability = "SCOPES"
severity = "error"
category = "coding"
presets = ["strict"]
body = '''
check = "unused-binding"
message = "'{value}' is assigned a value but never used"
'''

