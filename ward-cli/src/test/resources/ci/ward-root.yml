name: Ward

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Ward ci profile
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install gate tools
        run: |
          set -eu
          pip install semgrep==1.181.0
          npm install -g @fission-ai/openspec@1.14.1
      - name: Install Ward
        env:
          WARD_VERSION: v0.1.1
          WARD_INSTALL_DIR: ${{ runner.temp }}/ward/bin
        run: |
          curl -fsSL https://raw.githubusercontent.com/RicardoRB/ward-ai/main/install.sh | sh
          echo "$WARD_INSTALL_DIR" >> "$GITHUB_PATH"
      - name: Run quality gates
        run: ward check --profile ci --format sarif --output ward.sarif
      - name: Upload SARIF to code scanning
        if: >-
          always()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && hashFiles('ward.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ward.sarif
          category: ward
