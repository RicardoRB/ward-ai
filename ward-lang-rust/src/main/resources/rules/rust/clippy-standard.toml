# Rust rules mapped to Clippy lints of the groups that Clippy enables by default. Each rule is a generic check over
# the syntax tree; a regular expression matches the compact text of a node (its tokens without spaces).
# shortcut: a rule that Clippy decides with types matches the shape of the code only; upgrade it when Rust has type facts.

[[rules]]
id = "ward:rust/approx-constant"
language = "rust"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["FLOAT_LITERAL"]
text = '^(3\.14(1(59?)?)?|3\.142|3\.1416|3\.14159(2|3)?|2\.718(2|3)?|2\.7183|6\.28(3|32)?|6\.2832)(f32|f64)?$'
message = "the literal approximates a constant of std::f64::consts; use the constant"
'''

[[rules]]
id = "ward:rust/bool-comparison"
language = "rust"
capability = "SYNTAX"
severity = "warning"
category = "complexity"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["expression"]
text = '^([A-Za-z_][\w.]*(==|!=)(true|false)|(true|false)(==|!=)[A-Za-z_][\w.]*)$'
message = "comparing a boolean with a literal; use the value or its negation"
'''

[[rules]]
id = "ward:rust/box-default"
language = "rust"
capability = "SYNTAX"
severity = "warning"
category = "style"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["expression"]
text = '^Box::new\((Default::default\(\)|[A-Za-z_][\w.]*::default\(\))\)$'
message = "use Box::default instead of boxing a default value"
'''

[[rules]]
id = "ward:rust/bytes-nth"
language = "rust"
capability = "SYNTAX"
severity = "warning"
category = "style"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["expression"]
text = '\.bytes\(\)\.nth\((?:[^()]++|\((?:[^()]++|\([^()]*+\))*+\))*+\)$'
message = "index the bytes instead of walking an iterator"
'''

[[rules]]
id = "ward:rust/char-lit-as-u8"
language = "rust"
capability = "SYNTAX"
severity = "warning"
category = "complexity"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["expression"]
text = '^\x27(\\[nrt0\\\x27\x22]|[ -&(-\[\]-~])\x27asu8$'
message = "use a byte literal instead of casting a character"
'''

[[rules]]
id = "ward:rust/chars-next-cmp"
language = "rust"
capability = "SYNTAX"
severity = "warning"
category = "style"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["expression"]
text = '\.chars\(\)\.next\(\)==Some\(\x27(?:\\.|[^\x27\\])+\x27\)$'
message = "use starts_with instead of comparing the first character"
'''

[[rules]]
