# Operating-system commands of C# code, written for Ward from the System.Diagnostics Process and ProcessStartInfo
# documentation: the program and its argument string are fixed by the code or by whoever supplies them. Process and
# ProcessStartInfo are found by the type of their receiver (see CSharpFlowSites).

[[sinks]]
kind = "call"
name = "Start"
receiver = "Process"
arguments = [0, 1]

[[sinks]]
kind = "call"
name = "ProcessStartInfo"
arguments = [0, 1]

[[sinks]]
kind = "member-write"
name = "FileName"
receiver = "ProcessStartInfo"
arguments = [0]

[[sinks]]
kind = "member-write"
name = "Arguments"
receiver = "ProcessStartInfo"
arguments = [0]

