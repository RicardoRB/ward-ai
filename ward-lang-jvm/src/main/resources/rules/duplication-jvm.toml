# Duplicate-code rules for Java and Kotlin, replacing PMD CPD. The body is read by the whole-run
# duplicate detector, which compares the tokens of every file of the language.

[[rules]]
id = "ward:java/duplicate-code"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "duplication"
presets = ["standard", "strict"]
options.min-tokens = { type = "integer", min = 1 }
options.ignore-literals = { type = "boolean" }
options.ignore-identifiers = { type = "boolean" }
options.ignore-annotations = { type = "boolean" }
body = '''
check = "duplicate-code"
min-tokens = 100
ignore-literals = false
ignore-identifiers = false
ignore-annotations = false
'''

[[rules]]
id = "ward:kotlin/duplicate-code"
language = "kotlin"
capability = "SYNTAX"
severity = "error"
category = "duplication"
presets = ["standard", "strict"]
options.min-tokens = { type = "integer", min = 1 }
options.ignore-literals = { type = "boolean" }
options.ignore-identifiers = { type = "boolean" }
options.ignore-annotations = { type = "boolean" }
body = '''
check = "duplicate-code"
min-tokens = 100
ignore-literals = false
ignore-identifiers = false
ignore-annotations = false
'''
