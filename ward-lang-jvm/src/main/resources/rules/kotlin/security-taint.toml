# Injection rules for Kotlin. Each follows untrusted input from a web request, a Spring handler
# parameter or a Ktor call to a sink within one function, with the taint specifications of Java
# (the types are the same JDK, Servlet and Spring types) and taint/kotlin/sources.toml.

[[rules]]
id = "ward:kotlin/sql-injection"
language = "kotlin"
capability = "TAINT"
severity = "error"
category = "security"
presets = ["standard", "strict"]
body = '''
check = "taint"
specs = ["taint/java/sources.toml", "taint/kotlin/sources.toml", "taint/java/sql.toml"]
message = "untrusted data from {source} reaches the SQL query of {sink}"
'''

