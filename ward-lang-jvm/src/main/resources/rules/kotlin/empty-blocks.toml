# Empty-block rules for Kotlin, the detekt empty-blocks set. A block is empty when it has no code
# and no comment; a commented block is not reported. Each rule names the owner kinds it checks.

[[rules]]
id = "ward:kotlin/empty-class-block"
language = "kotlin"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["standard", "strict"]
body = '''
check = "kotlin-empty-block"
kinds = ["classDeclaration", "objectDeclaration"]
message = "the class or object is empty and can be removed"
'''

[[rules]]
id = "ward:kotlin/empty-default-constructor"
language = "kotlin"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["standard", "strict"]
body = '''
check = "kotlin-empty-constructor"
message = "an empty default constructor can be removed"
'''

[[rules]]
id = "ward:kotlin/empty-do-while-block"
language = "kotlin"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["standard", "strict"]
body = '''
check = "kotlin-empty-block"
kinds = ["doWhileExpression"]
after = "'do'"
message = "this do-while block is empty and can be removed"
'''

[[rules]]
id = "ward:kotlin/empty-else-block"
language = "kotlin"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["standard", "strict"]
body = '''
check = "kotlin-empty-block"
kinds = ["ifExpression"]
after = "'else'"
message = "this else block is empty and can be removed"
'''

