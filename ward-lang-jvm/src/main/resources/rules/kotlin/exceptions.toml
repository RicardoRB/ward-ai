# Exception rules for Kotlin, from detekt's exceptions set (standard preset). Each rule is one
# check over the syntax tree. Exception names are detekt's defaults: the options that take a
# list are not declared, because the generic checks have no list parameter.

[[rules]]
id = "ward:kotlin/print-stack-trace"
language = "kotlin"
capability = "SYNTAX"
severity = "error"
category = "error-handling"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["postfixUnaryExpression"]
text = '^printStackTrace\s*\(\s*\)$'
message = "printStackTrace() writes to the standard error; log the exception instead"
'''

[[rules]]
id = "ward:kotlin/return-from-finally"
language = "kotlin"
capability = "SYNTAX"
severity = "error"
category = "error-handling"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["jumpExpression"]
inside = ["finallyBlock"]
text = '^return'
message = "return inside a finally block discards the exception of the try block"
'''

[[rules]]
id = "ward:kotlin/throwing-exception-from-finally"
language = "kotlin"
capability = "SYNTAX"
severity = "error"
category = "error-handling"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["jumpExpression"]
inside = ["finallyBlock"]
text = '^throw'
message = "throw inside a finally block hides the exception of the try block"
'''

[[rules]]
id = "ward:kotlin/rethrow-caught-exception"
language = "kotlin"
capability = "SYNTAX"
severity = "error"
category = "error-handling"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["catchBlock"]
text = '^catch\s*\(\s*(\w+)\s*:[^)]*\)\s*\{\s*throw\s*\1\s*\}$'
message = "the caught exception is only rethrown; remove the catch block"
'''

[[rules]]
id = "ward:kotlin/throwing-exceptions-without-message-or-cause"
language = "kotlin"
capability = "SYNTAX"
severity = "error"
category = "error-handling"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["jumpExpression"]
text = '^throw\s*(ArrayIndexOutOfBoundsException|Exception|IllegalArgumentException|IllegalMonitorStateException|IllegalStateException|IndexOutOfBoundsException|NullPointerException|RuntimeException|Throwable)\s*\(\s*\)$'
message = "exception is thrown without a message or a cause"
'''

[[rules]]
id = "ward:kotlin/object-extends-throwable"
language = "kotlin"
capability = "SYNTAX"
severity = "error"
category = "error-handling"
presets = ["strict"]
body = '''
check = "forbidden-node"
kinds = ["objectDeclaration"]
text = '^object\w*:(?:[\w.]+\.)?(\w*Exception|\w*Error|Throwable)\('
message = "object extends Throwable; declare a class instead"
'''

[[rules]]
id = "ward:kotlin/not-implemented-declaration"
language = "kotlin"
capability = "SYNTAX"
severity = "error"
category = "error-handling"
presets = ["strict"]
body = '''
check = "forbidden-node"
kinds = ["postfixUnaryExpression"]
text = '^TODO\('
message = "TODO() call left in the code; implement it or remove it"
'''

[[rules]]
id = "ward:kotlin/throwing-new-instance-of-same-exception"
language = "kotlin"
capability = "SYNTAX"
severity = "error"
category = "error-handling"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["catchBlock"]
text = '^catch\s*\(\s*(\w+)\s*:\s*(\w+)\s*\)\s*\{[\s\S]*throw\2\(\1\)'
message = "a new instance of the caught exception type is thrown; rethrow the caught one"
'''

[[rules]]
id = "ward:kotlin/instance-of-check-for-exception"
language = "kotlin"
capability = "SYNTAX"
severity = "error"
category = "error-handling"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["catchBlock"]
text = '^catch\s*\(\s*(\w+)\s*:[^)]*\)\s*\{[\s\S]*(?:(?<![A-Za-z0-9_.])\1!?is[A-Z]|when\(\1\)\{[^}]*is[A-Z])'
message = "the caught exception is checked with is; use one catch block per exception type"
'''

[[rules]]
id = "ward:kotlin/swallowed-exception"
language = "kotlin"
capability = "SYNTAX"
severity = "error"
category = "error-handling"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["catchBlock"]
text = '^catch\s*\(\s*(?!_|ignore|expected)(\w+)\s*:\s*(?!(?:InterruptedException|MalformedURLException|NumberFormatException|ParseException)\))[\w.]+\s*\)\s*\{(?![\s\S]*(?:(?<![A-Za-z0-9_])|throw)\1(?![A-Za-z0-9_]))[\s\S]+\}$'
message = "the caught exception is swallowed; log it, pass it as a cause, or rethrow it"
'''

[[rules]]
id = "ward:kotlin/exception-raised-in-unexpected-location"
language = "kotlin"
capability = "SYNTAX"
severity = "error"
category = "error-handling"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["functionDeclaration"]
text = 'fun(?:equals|finalize|hashCode|toString)\([^)]*\)[^{=]*[{=][\s\S]*throw'
message = "this method should not throw an exception"
'''
