# Coroutine rules for Kotlin, from detekt's coroutines set (standard preset).

[[rules]]
id = "ward:kotlin/inject-dispatcher"
language = "kotlin"
capability = "SYNTAX"
severity = "error"
category = "coroutines"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["postfixUnaryExpression"]
not-inside = ["functionValueParameter", "classParameter"]
text = '^Dispatchers\s*\.\s*(IO|Default|Unconfined)\b'
message = "dispatcher is hard-coded; inject it so that tests can replace it"
'''

[[rules]]
id = "ward:kotlin/suspend-fun-with-flow-return-type"
language = "kotlin"
capability = "SYNTAX"
severity = "error"
category = "coroutines"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["functionDeclaration"]
text = 'suspendfun[^{=]*:(?:[\w.]+\.)?Flow<'
message = "suspend function returns a Flow; a Flow is cold, so drop the suspend modifier"
'''

[[rules]]
id = "ward:kotlin/global-coroutine-usage"
language = "kotlin"
capability = "SYNTAX"
severity = "error"
category = "coroutines"
presets = ["strict"]
body = '''
check = "forbidden-node"
kinds = ["postfixUnaryExpression"]
text = '^GlobalScope\.'
message = "GlobalScope starts a coroutine that nothing cancels; use a structured scope"
'''

[[rules]]
id = "ward:kotlin/suspend-fun-with-coroutine-scope-receiver"
language = "kotlin"
capability = "SYNTAX"
severity = "error"
category = "coroutines"
presets = ["strict"]
body = '''
check = "forbidden-node"
kinds = ["functionDeclaration"]
text = 'suspendfun(?:<[^>]*>)?(?:[\w.]+\.)?CoroutineScope\.'
message = "suspend function takes a CoroutineScope receiver; use coroutineScope instead"
'''

[[rules]]
id = "ward:kotlin/sleep-instead-of-delay"
language = "kotlin"
capability = "SYNTAX"
severity = "error"
category = "coroutines"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["functionDeclaration"]
text = 'suspendfun[\s\S]*Thread\.sleep\('
message = "Thread.sleep blocks the thread of a suspend function; use delay"
'''

[[rules]]
id = "ward:kotlin/redundant-suspend-modifier"
language = "kotlin"
capability = "TYPES"
severity = "error"
category = "coroutines"
presets = ["standard", "strict"]
body = '''
check = "kotlin-redundant-suspend"
message = "suspend modifier is redundant; the function has no suspension point"
'''
