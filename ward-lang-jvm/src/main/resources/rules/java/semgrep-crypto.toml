# Insecure cryptography and transport rules for Java, from the Semgrep p/java pack. Each matches one call or construction on its text.

[[rules]]
id = "ward:java/use-of-md5"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "security"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["expression"]
text = '^(?:java\.security\.)?MessageDigest\.getInstance\("(?i:md5)"(?:,[^()]*)?\)$'
message = "MD5 is a broken hash; use SHA-256 or stronger"
'''

[[rules]]
id = "ward:java/use-of-sha1"
