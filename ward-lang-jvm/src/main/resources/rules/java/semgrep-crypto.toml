'''

[[rules]]
id = "ward:java/no-static-initialization-vector"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "security"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["expression"]
text = '^new(?:javax\.crypto\.spec\.)?IvParameterSpec\((?:"[^"]*"\.getBytes\([^()]*\)|newbyte\[(?:\d+)?\](?:\{[^}]*\})?)\)$'
message = "the initialization vector is a constant; generate a random one for each message"
'''
