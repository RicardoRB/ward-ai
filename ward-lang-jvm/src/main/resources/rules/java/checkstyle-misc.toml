# Java rules for the Checkstyle miscellaneous checks.

[[rules]]
id = "ward:java/upper-ell"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["integerLiteral"]
text = 'l$'
message = "long literal ends with a lowercase l; use an uppercase L"
'''

[[rules]]
id = "ward:java/avoid-escaped-unicode-characters"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["STRING_LITERAL", "CHAR_LITERAL", "TEXT_BLOCK"]
text = '(?<!\\)(\\\\)*\\u+[0-9a-fA-F]{4}'
message = "literal uses a Unicode escape; write the character itself"
'''

[[rules]]
id = "ward:java/array-type-style"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["variableDeclaratorId"]
text = '\]$'
message = "array brackets follow the name; put them on the type"
'''

[[rules]]
id = "ward:java/todo-comment"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["standard", "strict"]
options.pattern = { type = "regex" }
body = '''
check = "text-pattern"
target = "comments"
pattern = "TODO:"
message = "resolve the TODO: comment before merging"
'''

[[rules]]
id = "ward:java/multiline-comment-leading-asterisk-presence"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["standard", "strict"]
body = '''
check = "multiline-comment-leading-asterisk-presence"
message = "every row of a multi-line comment starts with an asterisk"
'''

[[rules]]
id = "ward:java/outer-type-filename"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["standard", "strict"]
body = '''
check = "outer-type-filename"
message = "the type '{value}' must be declared in a file named after it, '{max}.java'"
'''

[[rules]]
id = "ward:java/final-parameters"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["strict"]
body = '''
check = "final-parameters"
message = "parameter '{value}' is never assigned; declare it final"
'''
