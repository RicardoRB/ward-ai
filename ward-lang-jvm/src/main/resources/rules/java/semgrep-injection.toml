[[rules]]
id = "ward:java/documentbuilderfactory-disallow-doctype-decl-false"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "security/injection"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["expression"]
text = '^[\w.]+\.setFeature\("http://apache\.org/xml/features/disallow-doctype-decl",false\)$'
message = "DOCTYPE declarations are allowed, which opens the parser to XXE; set the feature to true"
'''

[[rules]]
id = "ward:java/documentbuilderfactory-external-general-entities-true"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "security/injection"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["expression"]
text = '^[\w.]+\.setFeature\("http://xml\.org/sax/features/external-general-entities",true\)$'
message = "external general entities are enabled, which opens the parser to XXE; set the feature to false"
'''

[[rules]]
id = "ward:java/documentbuilderfactory-external-parameter-entities-true"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "security/injection"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["expression"]
text = '^[\w.]+\.setFeature\("http://xml\.org/sax/features/external-parameter-entities",true\)$'
message = "external parameter entities are enabled, which opens the parser to XXE; set the feature to false"
'''

[[rules]]
id = "ward:java/documentbuilderfactory-disallow-doctype-decl-missing"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "security/injection"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["methodDeclaration"]
text = '^(?=[\s\S]*DocumentBuilderFactory\.newInstance\(\))(?![\s\S]*disallow-doctype-decl",true)'
message = "the DocumentBuilderFactory does not disable DOCTYPE declarations, which opens it to XXE"
'''

[[rules]]
id = "ward:java/saxparserfactory-disallow-doctype-decl-missing"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "security/injection"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["methodDeclaration"]
text = '^(?=[\s\S]*SAXParserFactory\.newInstance\(\))(?![\s\S]*disallow-doctype-decl",true)'
message = "the SAXParserFactory does not disable DOCTYPE declarations, which opens it to XXE"
'''

[[rules]]
id = "ward:java/transformerfactory-dtds-not-disabled"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "security/injection"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["methodDeclaration"]
text = '^(?=[\s\S]*TransformerFactory\.newInstance\(\))(?![\s\S]*ACCESS_EXTERNAL_DTD)'
message = "the TransformerFactory does not restrict external DTDs, which opens it to XXE"
'''

[[rules]]
id = "ward:java/xmlinputfactory-possible-xxe"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "security/injection"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["methodDeclaration"]
text = '^(?=[\s\S]*XMLInputFactory\.new(?:Instance|Factory)\(\))(?![\s\S]*(?:SUPPORT_DTD|IS_SUPPORTING_EXTERNAL_ENTITIES))'
message = "the XMLInputFactory does not disable DTDs or external entities, which opens it to XXE"
'''

[[rules]]
id = "ward:java/blowfish-insufficient-key-size"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "security/injection"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["methodDeclaration"]
text = 'KeyGenerator\.getInstance\("(?i:blowfish)"\)[\s\S]*\.init\((?:\d{1,2}|1[01]\d|12[0-7])\)'
message = "a Blowfish key shorter than 128 bits is too weak; use at least 128"
'''

[[rules]]
id = "ward:java/use-of-weak-rsa-key"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "security/injection"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["methodDeclaration"]
text = 'KeyPairGenerator\.getInstance\("(?i:rsa)"\)[\s\S]*\.initialize\((?:\d{1,3}|1\d{3})\)'
message = "an RSA key shorter than 2048 bits is too weak; use at least 2048"
'''

[[rules]]
id = "ward:java/md5-used-as-password"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "security/injection"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["methodDeclaration"]
text = 'MessageDigest\.getInstance\("(?i:md5)"\)[\s\S]*\.setPassword\('
message = "an MD5 digest is stored as a password; use a password hash such as bcrypt or Argon2"
'''

[[rules]]
id = "ward:java/insecure-smtp-connection"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "security/injection"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["methodDeclaration"]
text = '^(?=[\s\S]*new(?:SimpleEmail|HtmlEmail|MultiPartEmail|ImageHtmlEmail)\(\))(?![\s\S]*setSSLOnConnect\(true\))'
message = "the SMTP connection is not encrypted; call setSSLOnConnect(true)"
'''

[[rules]]
id = "ward:java/insecure-jms-deserialization"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "security/injection"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["methodDeclaration"]
text = 'ObjectMessage[\s\S]*\.getObject\(\)'
message = "getObject deserializes the message body, which lets the sender run code; read a text or byte message instead"
'''

[[rules]]
id = "ward:java/gcm-nonce-reuse"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "security/injection"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["expression"]
text = '^new(?:javax\.crypto\.spec\.)?GCMParameterSpec\(\d+,(?:"[^"]*"\.getBytes\([^()]*\)|newbyte\[(?:\d+)?\](?:\{[^}]*\})?)\)$'
message = "the GCM nonce is a constant; reusing a nonce breaks GCM, so generate a new one for each message"
'''

[[rules]]
id = "ward:java/no-direct-response-writer"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "security/injection"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["expression"]
text = '^[\w.]+\.getWriter\(\)\.(?:write|print|println|printf|format|append)\(.*\)$'
message = "the response writer is used directly; write through a template engine that escapes output"
'''

[[rules]]
id = "ward:java/java-jwt-decode-without-verify"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "security/injection"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["expression"]
text = '^(?:com\.auth0\.jwt\.)?JWT\.decode\(.*\)$'
message = "JWT.decode does not verify the signature; use a JWTVerifier"
'''

[[rules]]
id = "ward:java/formatted-sql-string"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "security/injection"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["expression"]
text = '^String\.format\("(?i:select|insert|update|delete)[^"]*"(?:,.*)?\)$'
message = "the SQL text is built with String.format; use a prepared statement with parameters"
'''

[[rules]]
id = "ward:java/find-sql-string-concatenation"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "security/injection"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["expression"]
text = '^[\w.]+\.(?:createSQLQuery|createQuery|createNativeQuery)\("(?i:select|insert|update|delete)[^"]*"\+.*\)$'
message = "the query text is built by concatenation; bind parameters instead"
'''
