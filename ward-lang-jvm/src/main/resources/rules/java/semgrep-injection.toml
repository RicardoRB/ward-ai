# Injection, XXE and weak-key rules for Java, from the Semgrep p/java pack.

[[rules]]
id = "ward:java/tainted-sql-string"
language = "java"
capability = "DATAFLOW"
severity = "error"
category = "security/injection"
presets = ["standard", "strict"]
body = '''
check = "taint"
specs = ["taint/java/sources.toml", "taint/java/sql.toml"]
message = "untrusted data from {source} reaches the SQL text of {sink}"
'''

