# Design rules for Java, mirroring PMD 7's design category. Each rule is a generic check over the
# syntax tree; a few are approximations that match on the text of a node, noted in the PR.

[[rules]]
id = "ward:java/abstract-class-without-any-method"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
body = '''
check = "required-node"
kinds = ["classDeclaration"]
modifiers = ["abstract"]
descendant = ["methodDeclaration", "constructorDeclaration"]
skip = ["classDeclaration", "interfaceDeclaration", "enumDeclaration", "recordDeclaration"]
message = "abstract class declares no method or constructor"
'''

[[rules]]
id = "ward:java/avoid-rethrowing-exception"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["catchClause"]
text = '(?s)^catch\((?:final)?[\w.<>?,&|]+?(\w+)\)\{throw\1;\}$'
message = "catch block only rethrows the exception; remove the catch or handle the exception"
'''

[[rules]]
id = "ward:java/avoid-throwing-new-instance-of-same-exception"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["catchClause"]
text = '(?s)^catch\((?:final)?([\w.]+?)(\w+)\)\{thrownew\1\([^;]*\b\2\b[^;]*\);\}$'
message = "catch block throws a new instance of the same exception; rethrow it or add context"
'''

[[rules]]
id = "ward:java/avoid-throwing-null-pointer-exception"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["statement"]
text = '^thrownew(java\.lang\.)?NullPointerException\('
message = "throws a NullPointerException manually; use Objects.requireNonNull or IllegalArgumentException"
'''

[[rules]]
id = "ward:java/avoid-unchecked-exceptions-in-signatures"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["qualifiedNameList"]
parent = ["methodDeclaration"]
text = '(^|,)\s*(java\.lang\.)?(RuntimeException|IllegalArgumentException|IllegalStateException|NullPointerException|IndexOutOfBoundsException|UnsupportedOperationException|ClassCastException|ArithmeticException|NumberFormatException)\s*($|,)'
message = "method declares an unchecked exception in its throws clause; document it in the Javadoc instead"
'''

[[rules]]
id = "ward:java/collapsible-if-statements"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["statement"]
text = '(?s)^if\s*\([^{]*\)\s*\{\s*if\s*\([^{]*\)\s*\{[^{}]*\}\s*\}$'
message = "nested if statements without else can be merged with &&"
'''

[[rules]]
id = "ward:java/do-not-extend-java-lang-error"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["typeType"]
parent = ["classDeclaration"]
text = '^(java\.lang\.)?Error$'
message = "class extends java.lang.Error; extend Exception or RuntimeException instead"
'''

[[rules]]
id = "ward:java/excessive-imports"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
options.minimum = { type = "integer", min = 0 }
body = '''
check = "import-count"
minimum = 30
message = "file has {value} imports; the limit is {max}"
'''

[[rules]]
id = "ward:java/excessive-parameter-list"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
options.minimum = { type = "integer", min = 0 }
body = '''
check = "parameter-limit"
minimum = 10
message = "method declares {value} parameters; the limit is {max}"
'''

[[rules]]
id = "ward:java/final-field-could-be-static"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["fieldDeclaration"]
modifiers = ["final"]
not-modifiers = ["static"]
text = '(?s)=\s*(?:"[^"\\]*+(?:\\.[^"\\]*+)*+"|\x27[^\x27\\]*+(?:\\.[^\x27\\]*+)*+\x27|-?\d[\w.]*|true|false)\s*;\s*$'
message = "final field initialized with a constant could be static"
'''

[[rules]]
id = "ward:java/logic-inversion"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["expression"]
text = '(?s)^!\((?!.*(&&|\|\|)).*(==|!=|<=|>=|<|>).*\)$'
message = "negated comparison; use the opposite operator instead of !"
'''

[[rules]]
id = "ward:java/mutable-static-state"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["fieldDeclaration"]
modifiers = ["static"]
not-modifiers = ["private", "final"]
message = "static field that is neither private nor final; keep static state private or immutable"
'''

[[rules]]
id = "ward:java/signature-declare-throws-exception"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["qualifiedNameList"]
parent = ["methodDeclaration"]
text = '(^|,)\s*(java\.lang\.)?(Exception|Throwable)\s*($|,)'
message = "method declares Exception or Throwable in its throws clause; declare the specific exception"
'''

[[rules]]
id = "ward:java/simplified-ternary"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["expression"]
text = '^[^?]*\?\s*(true|false)\s*:|^[^?]*\?[^:]*:\s*(true|false)\s*$'
message = "conditional expression with a boolean literal can be simplified with && or ||"
'''

[[rules]]
id = "ward:java/simplify-conditional"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["expression"]
text = '^(\w+)!=null&&\1instanceof'
message = "null check before instanceof is redundant; instanceof already returns false for null"
'''

[[rules]]
id = "ward:java/useless-overriding-method"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["methodDeclaration"]
text = '(?s)^(?![^{]*@)[^{(]*?(\w+)\([^)]*\)[^{]*\{(?:return)?super\.\1\([^)]*\);?\}$'
message = "method only calls the overridden method with the same name; remove the override"
'''

[[rules]]
id = "ward:java/avoid-deeply-nested-if-stmts"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
options.problem-depth = { type = "integer", min = 1 }
body = '''
check = "nested-if"
problem-depth = 3
message = "if statement nested {max} levels deep; extract a method or return early"
'''

[[rules]]
id = "ward:java/too-many-fields"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
options.max-fields = { type = "integer", min = 0, parameter = "max" }
body = '''
check = "field-limit"
max = 15
message = "class declares {value} fields that are not final or static; the limit is {max}"
'''

[[rules]]
id = "ward:java/too-many-methods"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
options.max-methods = { type = "integer", min = 0, parameter = "max" }
body = '''
check = "method-limit"
max = 10
message = "class declares {value} methods that are not simple accessors; the limit is {max}"
'''

[[rules]]
id = "ward:java/excessive-public-count"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
options.minimum = { type = "integer", min = 0 }
body = '''
check = "public-count"
minimum = 45
message = "class has {value} public methods and fields; the limit is {max}"
'''

[[rules]]
id = "ward:java/protected-member-in-final-class"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
body = '''
check = "protected-in-final"
message = "protected member in a final class; use private or package access"
'''

[[rules]]
id = "ward:java/public-member-in-non-public-type"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
body = '''
check = "public-in-non-public"
message = "public member in a type that is not public; drop the public modifier"
'''

[[rules]]
id = "ward:java/switch-density"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
options.minimum = { type = "integer", min = 0 }
body = '''
check = "switch-density"
minimum = 10
message = "switch has a density of {value} statements per label; the limit is {max}"
'''

[[rules]]
id = "ward:java/exception-as-flow-control"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
body = '''
check = "exception-flow"
message = "exception thrown and caught in the same method; use a control structure instead"
'''

[[rules]]
id = "ward:java/immutable-field"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
body = '''
check = "immutable-field"
message = "private field is never assigned after construction; declare it final"
'''

[[rules]]
id = "ward:java/singular-field"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
body = '''
check = "singular-field"
message = "private field is only used in one method; make it a local variable"
'''

[[rules]]
id = "ward:java/instantiable-utility-class"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
body = '''
check = "utility-class"
message = "utility class has no private constructor; add one"
'''

[[rules]]
id = "ward:java/loose-package-coupling"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
options.packages = { type = "string-list" }
body = '''
check = "package-coupling"
packages = []
message = "use of {value} outside its package hierarchy is not recommended"
'''


# Class design rules for Java (Checkstyle design group).
[[rules]]
id = "ward:java/one-top-level-class"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
body = '''
check = "one-top-level-class"
message = "file declares more than one top-level type; move '{value}' to its own file"
'''

[[rules]]
id = "ward:java/final-class"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["strict"]
body = '''
check = "final-class"
message = "class '{value}' has only private constructors and should be final"
'''

[[rules]]
id = "ward:java/hide-utility-class-constructor"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["strict"]
options.ignore-annotated-by = { type = "string-list" }
body = '''
check = "hide-utility-class-constructor"
ignore-annotated-by = []
message = "utility class '{value}' should hide its constructor"
'''

[[rules]]
id = "ward:java/inner-type-last"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["strict"]
body = '''
check = "inner-type-last"
message = "inner type '{value}' must be declared after the other members"
'''

[[rules]]
id = "ward:java/interface-is-type"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["strict"]
options.allow-marker-interfaces = { type = "boolean" }
body = '''
check = "interface-is-type"
allow-marker-interfaces = true
message = "interface '{value}' declares constants only and is not a type"
'''

[[rules]]
id = "ward:java/mutable-exception"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["strict"]
options.format = { type = "regex" }
options.extended-class-name-format = { type = "regex" }
body = '''
check = "mutable-exception"
format = '^.*Exception$|^.*Error$|^.*Throwable$'
extended-class-name-format = '^.*Exception$|^.*Error$|^.*Throwable$'
message = "exception field '{value}' must be final"
'''

[[rules]]
id = "ward:java/sealed-should-have-permits-list"
language = "java"
min-java-release = 17
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["strict"]
body = '''
check = "sealed-should-have-permits-list"
message = "sealed type '{value}' has no permits clause"
'''

[[rules]]
id = "ward:java/throws-count"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["strict"]
options.max = { type = "integer", min = 0 }
options.ignore-private-methods = { type = "boolean" }
body = '''
check = "throws-count"
max = 4
ignore-private-methods = true
message = "method declares {value} exceptions in its throws clause; the limit is {max}"
'''

[[rules]]
id = "ward:java/visibility-modifier"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["strict"]
options.allow-public-final-fields = { type = "boolean" }
options.allow-public-immutable-fields = { type = "boolean" }
options.package-allowed = { type = "boolean" }
options.protected-allowed = { type = "boolean" }
options.public-member-pattern = { type = "regex" }
options.ignore-annotation-canonical-names = { type = "string-list" }
options.immutable-class-canonical-names = { type = "string-list" }
body = '''
check = "visibility-modifier"
allow-public-final-fields = false
allow-public-immutable-fields = false
package-allowed = false
protected-allowed = false
public-member-pattern = '^serialVersionUID$'
ignore-annotation-canonical-names = ["VisibleForTesting", "ClassRule", "Rule"]
immutable-class-canonical-names = ["File", "Boolean", "Byte", "Character", "Double", "Float", "Integer", "Long", "Short", "StackTraceElement", "String", "BigDecimal", "BigInteger", "Inet4Address", "Inet6Address", "InetSocketAddress", "URI", "URL", "Locale", "UUID"]
message = "field '{value}' must be private"
'''

[[rules]]
id = "ward:java/design-for-extension"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["strict"]
options.ignored-annotations = { type = "string-list" }
options.required-javadoc-phrase = { type = "regex" }
body = '''
check = "design-for-extension"
ignored-annotations = ["After", "AfterClass", "Before", "BeforeClass", "Test"]
required-javadoc-phrase = '.*'
message = "method '{value}' is designed for extension and has no Javadoc comment"
'''

[[rules]]
id = "ward:java/god-class"
language = "java"
capability = "TYPES"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
body = '''
check = "god-class"
message = "class is a god class ({value}); split its responsibilities"
'''

[[rules]]
id = "ward:java/data-class"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
body = '''
check = "data-class"
message = "class is a data class ({value}); move the behaviour next to its data"
'''

[[rules]]
id = "ward:java/law-of-demeter"
language = "java"
capability = "TYPES"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
body = '''
check = "law-of-demeter"
message = "call reaches through an object of another class; talk only to your friends"
'''

[[rules]]
id = "ward:java/invalid-java-bean"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "complexity"
presets = ["strict"]
options.packages = { type = "string-list" }
body = '''
check = "invalid-java-bean"
packages = []
message = "bean field {value} needs a getter and a setter of its type"
'''

[[rules]]
id = "ward:java/internal-api-usage"
language = "java"
capability = "TYPES"
severity = "error"
category = "complexity"
presets = ["standard", "strict"]
body = '''
check = "internal-api-usage"
message = "internal JDK API {value} must not be used"
'''
