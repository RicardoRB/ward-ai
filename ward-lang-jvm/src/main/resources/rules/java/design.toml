# Design rules for Java, mirroring PMD 7's design category. Each rule is a generic check over the
# syntax tree; a few are approximations that match on the text of a node, noted in the PR.

[[rules]]
id = "ward:java/abstract-class-without-any-method"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "design"
presets = ["standard", "strict"]
body = '''
check = "required-node"
kinds = ["classDeclaration"]
modifiers = ["abstract"]
descendant = ["methodDeclaration", "constructorDeclaration"]
skip = ["classDeclaration", "interfaceDeclaration", "enumDeclaration", "recordDeclaration"]
message = "abstract class declares no method or constructor"
'''

[[rules]]
id = "ward:java/avoid-rethrowing-exception"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "design"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["catchClause"]
text = '(?s)^catch\((?:final)?[\w.<>?,&|]+?(\w+)\)\{throw\1;\}$'
message = "catch block only rethrows the exception; remove the catch or handle the exception"
'''

[[rules]]
id = "ward:java/avoid-throwing-new-instance-of-same-exception"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "design"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["catchClause"]
text = '(?s)^catch\((?:final)?([\w.]+?)(\w+)\)\{thrownew\1\([^;]*\b\2\b[^;]*\);\}$'
message = "catch block throws a new instance of the same exception; rethrow it or add context"
'''

[[rules]]
id = "ward:java/avoid-throwing-null-pointer-exception"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "design"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["statement"]
text = '^thrownew(java\.lang\.)?NullPointerException\('
message = "throws a NullPointerException manually; use Objects.requireNonNull or IllegalArgumentException"
'''

[[rules]]
id = "ward:java/avoid-unchecked-exceptions-in-signatures"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "design"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["qualifiedNameList"]
parent = ["methodDeclaration"]
text = '(^|,)\s*(java\.lang\.)?(RuntimeException|IllegalArgumentException|IllegalStateException|NullPointerException|IndexOutOfBoundsException|UnsupportedOperationException|ClassCastException|ArithmeticException|NumberFormatException)\s*($|,)'
message = "method declares an unchecked exception in its throws clause; document it in the Javadoc instead"
'''

[[rules]]
id = "ward:java/collapsible-if-statements"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "design"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["statement"]
text = '(?s)^if\s*\([^{]*\)\s*\{\s*if\s*\([^{]*\)\s*\{[^{}]*\}\s*\}$'
message = "nested if statements without else can be merged with &&"
'''

[[rules]]
id = "ward:java/do-not-extend-java-lang-error"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "design"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["typeType"]
parent = ["classDeclaration"]
text = '^(java\.lang\.)?Error$'
message = "class extends java.lang.Error; extend Exception or RuntimeException instead"
'''

[[rules]]
id = "ward:java/excessive-imports"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "design"
presets = ["standard", "strict"]
options.minimum = { type = "integer", min = 0 }
body = '''
check = "import-count"
minimum = 30
message = "file has {value} imports; the limit is {max}"
'''

[[rules]]
id = "ward:java/excessive-parameter-list"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "design"
presets = ["standard", "strict"]
options.minimum = { type = "integer", min = 0 }
body = '''
check = "parameter-limit"
minimum = 10
message = "method declares {value} parameters; the limit is {max}"
'''

[[rules]]
id = "ward:java/final-field-could-be-static"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "design"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["fieldDeclaration"]
modifiers = ["final"]
not-modifiers = ["static"]
text = '(?s)=\s*(?:"(?:[^"\\]|\\.)*"|\x27(?:[^\x27\\]|\\.)*\x27|-?\d[\w.]*|true|false)\s*;\s*$'
message = "final field initialized with a constant could be static"
'''

[[rules]]
id = "ward:java/logic-inversion"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "design"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["expression"]
text = '(?s)^!\((?!.*(&&|\|\|)).*(==|!=|<=|>=|<|>).*\)$'
message = "negated comparison; use the opposite operator instead of !"
'''

[[rules]]
id = "ward:java/mutable-static-state"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "design"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["fieldDeclaration"]
modifiers = ["static"]
not-modifiers = ["private", "final"]
message = "static field that is neither private nor final; keep static state private or immutable"
'''

[[rules]]
id = "ward:java/signature-declare-throws-exception"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "design"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["qualifiedNameList"]
parent = ["methodDeclaration"]
text = '(^|,)\s*(java\.lang\.)?(Exception|Throwable)\s*($|,)'
message = "method declares Exception or Throwable in its throws clause; declare the specific exception"
'''

[[rules]]
id = "ward:java/simplified-ternary"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "design"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["expression"]
text = '^[^?]*\?\s*(true|false)\s*:|^[^?]*\?[^:]*:\s*(true|false)\s*$'
message = "conditional expression with a boolean literal can be simplified with && or ||"
'''

[[rules]]
id = "ward:java/simplify-conditional"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "design"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["expression"]
text = '^(\w+)!=null&&\1instanceof'
message = "null check before instanceof is redundant; instanceof already returns false for null"
'''

[[rules]]
id = "ward:java/useless-overriding-method"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "design"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["methodDeclaration"]
text = '(?s)^(?![^{]*@)[^{(]*?(\w+)\([^)]*\)[^{]*\{(?:return)?super\.\1\([^)]*\);?\}$'
message = "method only calls the overridden method with the same name; remove the override"
'''

[[rules]]
id = "ward:java/avoid-deeply-nested-if-stmts"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "design"
presets = ["standard", "strict"]
options.problem-depth = { type = "integer", min = 1 }
body = '''
check = "nested-if"
problem-depth = 3
message = "if statement nested {max} levels deep; extract a method or return early"
'''

[[rules]]
id = "ward:java/too-many-fields"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "design"
presets = ["standard", "strict"]
options.max-fields = { type = "integer", min = 0, parameter = "max" }
body = '''
check = "field-limit"
max = 15
message = "class declares {value} fields that are not final or static; the limit is {max}"
'''

[[rules]]
id = "ward:java/too-many-methods"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "design"
presets = ["standard", "strict"]
options.max-methods = { type = "integer", min = 0, parameter = "max" }
body = '''
check = "method-limit"
max = 10
message = "class declares {value} methods that are not simple accessors; the limit is {max}"
'''

[[rules]]
id = "ward:java/excessive-public-count"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "design"
presets = ["standard", "strict"]
options.minimum = { type = "integer", min = 0 }
body = '''
check = "public-count"
minimum = 45
message = "class has {value} public methods and fields; the limit is {max}"
'''

[[rules]]
id = "ward:java/protected-member-in-final-class"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "design"
presets = ["standard", "strict"]
body = '''
check = "protected-in-final"
message = "protected member in a final class; use private or package access"
'''

[[rules]]
id = "ward:java/public-member-in-non-public-type"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "design"
presets = ["standard", "strict"]
body = '''
check = "public-in-non-public"
message = "public member in a type that is not public; drop the public modifier"
'''

[[rules]]
id = "ward:java/switch-density"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "design"
presets = ["standard", "strict"]
options.minimum = { type = "integer", min = 0 }
body = '''
check = "switch-density"
minimum = 10
message = "switch has a density of {value} statements per label; the limit is {max}"
'''

[[rules]]
id = "ward:java/exception-as-flow-control"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "design"
presets = ["standard", "strict"]
body = '''
check = "exception-flow"
message = "exception thrown and caught in the same method; use a control structure instead"
'''

[[rules]]
id = "ward:java/immutable-field"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "design"
presets = ["standard", "strict"]
body = '''
check = "immutable-field"
message = "private field is never assigned after construction; declare it final"
'''

[[rules]]
id = "ward:java/singular-field"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "design"
presets = ["standard", "strict"]
body = '''
check = "singular-field"
message = "private field is only used in one method; make it a local variable"
'''

[[rules]]
id = "ward:java/instantiable-utility-class"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "design"
presets = ["standard", "strict"]
body = '''
check = "utility-class"
message = "utility class has no private constructor; add one"
'''

[[rules]]
id = "ward:java/loose-package-coupling"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "design"
presets = ["standard", "strict"]
options.packages = { type = "string-list" }
body = '''
check = "package-coupling"
packages = []
message = "use of {value} outside its package hierarchy is not recommended"
'''


[[rules]]
id = "ward:java/god-class"
language = "java"
capability = "TYPES"
severity = "error"
category = "design"
presets = ["standard", "strict"]
body = '''
check = "god-class"
message = "class is a god class ({value}); split its responsibilities"
'''

[[rules]]
id = "ward:java/data-class"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "design"
presets = ["standard", "strict"]
body = '''
check = "data-class"
message = "class is a data class ({value}); move the behaviour next to its data"
