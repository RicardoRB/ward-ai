'''

[[rules]]
id = "ward:java/sing-singleton-implements-cloneable"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["classDeclaration"]
text = '^class(\w+)(?=[^{]*Cloneable)(?=[\s\S]*private\1\()(?=[\s\S]*static(?:final|volatile)*\1\w+[=;])'
message = "singleton implements Cloneable, so clone() can create a second instance"
'''

