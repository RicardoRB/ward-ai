# Coding rules for Java. Each rule mirrors one Checkstyle 14.3.0 check of the coding group, with the
# same option names in kebab-case and Checkstyle's defaults. The standard preset keeps the settings
# of google_checks.xml and this repository's config/checkstyle.xml, so presets follow that file.

[[rules]]
id = "ward:java/package-declaration"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["standard", "strict"]
body = '''
check = "required-node"
kinds = ["compilationunit", "compactCompilationUnit"]
child = ["packageDeclaration"]
message = "file has no package declaration"
'''

[[rules]]
id = "ward:java/multiple-variable-declarations"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["standard", "strict"]
body = '''
check = "count"
kinds = ["localVariableDeclaration", "fieldDeclaration"]
counted = ["variableDeclarator"]
not-inside = ["forInit"]
skip = ["block", "classBody"]
max = 1
message = "declaration of {value} variables; declare each variable in its own statement"
'''

[[rules]]
id = "ward:java/illegal-token-text"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["standard", "strict"]
# Checkstyle's format option is named text here: the first standard module forbids whitespace other
# than the ASCII space, and the second the octal and unicode escapes of the same literal tokens.
options.text = { type = "regex" }
body = '''
check = "forbidden-node"
kinds = ["STRING_LITERAL", "CHAR_LITERAL", "TEXT_BLOCK"]
text = '[\t\x0B\f\x85\xA0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]|\\u00(08|09|0[aA]|0[cC]|0[dD]|20|22|27|5[cC])|\\(0(10|11|12|14|15|40|42|47)|134)'
message = "literal contains whitespace or an escape that must be spelled out with a special escape"
'''

[[rules]]
id = "ward:java/one-statement-per-line"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["standard", "strict"]
options.treat-try-resources-as-statement = { type = "boolean" }
body = '''
check = "one-statement-per-line"
treat-try-resources-as-statement = false
message = "more than one statement on a line; put each statement on its own line"
'''

[[rules]]
id = "ward:java/constructors-declaration-grouping"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["standard", "strict"]
options.order-by-increasing-parameter-count = { type = "boolean" }
body = '''
check = "constructors-declaration-grouping"
order-by-increasing-parameter-count = false
message = "constructor is not grouped with the other constructors, or is out of parameter-count order"
'''

[[rules]]
id = "ward:java/overload-methods-declaration-order"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["standard", "strict"]
options.order-by-increasing-parameter-count = { type = "boolean" }
body = '''
check = "overload-methods-declaration-order"
order-by-increasing-parameter-count = false
message = "overloaded method is not declared next to the other overloads, or is out of parameter-count order"
'''

[[rules]]
id = "ward:java/magic-number"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["strict"]
options.ignore-numbers = { type = "string-list" }
options.ignore-field-declaration = { type = "boolean" }
options.ignore-annotation = { type = "boolean" }
options.ignore-hash-code-method = { type = "boolean" }
body = '''
check = "magic-number"
ignore-numbers = ["-1", "0", "1", "2"]
ignore-field-declaration = false
ignore-annotation = false
ignore-hash-code-method = false
message = "'{value}' is a magic number; declare it as a named constant"
'''

[[rules]]
id = "ward:java/multiple-string-literals"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["strict"]
options.ignore = { type = "string-list" }
options.ignore-contexts = { type = "string-list" }
options.max-repeats = { type = "integer", min = 0 }
options.min-length = { type = "integer", min = 0 }
body = '''
check = "literal"
kinds = ["STRING_LITERAL"]
ignore = ['""']
ignore-contexts = ["annotation"]
max-repeats = 1
min-length = 3
message = "string literal {value} is repeated; declare it as a constant"
'''

[[rules]]
id = "ward:java/explicit-initialization"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["strict"]
options.only-object-references = { type = "boolean" }
body = '''
check = "explicit-initialization"
only-object-references = false
message = "field is explicitly initialized to the default value of its type; remove the initializer"
'''

[[rules]]
id = "ward:java/array-trailing-comma"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["strict"]
options.always-demand-trailing-comma = { type = "boolean" }
body = '''
check = "array-trailing-comma"
always-demand-trailing-comma = false
message = "array initializer is closed on a new line without a trailing comma"
'''

[[rules]]
id = "ward:java/no-array-trailing-comma"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["strict"]
body = '''
check = "forbidden-node"
kinds = ["arrayInitializer"]
text = ',\}$'
message = "array initializer has a trailing comma; remove it"
'''

[[rules]]
id = "ward:java/no-enum-trailing-comma"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["strict"]
body = '''
check = "no-enum-trailing-comma"
message = "enum declares a trailing comma after its constants; remove it"
'''

[[rules]]
id = "ward:java/illegal-token"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["strict"]
body = '''
check = "forbidden-node"
kinds = ["statement"]
# shortcut: a label named assert* is not reported, since the text of a statement has no spaces
text = '^(?!assert)[A-Za-z_$][\w$]*:'
message = "labeled statement is illegal; restructure the code without a label"
'''

[[rules]]
id = "ward:java/text-block-google-style-formatting"
language = "java"
min-java-release = 15
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["standard", "strict"]
body = '''
check = "text-block-google-style-formatting"
message = "text block format problem: {value}"
'''

[[rules]]
id = "ward:java/unused-local-variable"
language = "java"
capability = "SCOPES"
severity = "error"
category = "style"
presets = ["standard", "strict"]
body = '''
check = "unused-binding"
message = "local variable '{value}' is never read"
'''
