language = "java"
capability = "SYNTAX"
severity = "error"
category = "bad-practice"
presets = ["standard", "strict"]
body = '''
check = "transient-field-not-restored"
message = "transient field '{value}' is written in several places but not restored by readObject or readResolve, so a deserialized object keeps the default"
'''

[[rules]]
id = "ward:java/se-bad-field"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "bad-practice"
presets = ["standard", "strict"]
body = '''
check = "bad-serializable-field"
message = "non-transient field of type {value} is not serializable but its class is; make it transient or give the class custom serialization"
'''

