# SpotBugs rules for Java (issue 316) that read class shape, casts and dead stores.

[[rules]]
id = "ward:java/aa-assertion-of-arguments"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "assert-on-parameter"
message = "the argument of a public method is checked with assert; throw an exception instead"
'''

[[rules]]
id = "ward:java/bc-bad-cast-to-abstract-collection"
language = "java"
capability = "TYPES"
severity = "error"
category = "style"
presets = ["standard", "strict"]
body = '''
check = "cast-types"
from = ["java.util.Collection"]
to = ["List", "Set", "SortedSet", "NavigableSet", "Queue", "Deque"]
message = "a Collection is cast to a more specific abstract collection type"
'''

[[rules]]
id = "ward:java/bc-bad-cast-to-concrete-collection"
language = "java"
capability = "TYPES"
severity = "error"
category = "style"
presets = ["standard", "strict"]
body = '''
check = "cast-types"
from = ["java.util.Collection", "java.util.List", "java.util.Set", "java.util.SortedSet", "java.util.NavigableSet", "java.util.Queue", "java.util.Deque", "java.util.Map", "java.util.SortedMap", "java.util.NavigableMap"]
to = ["ArrayList", "LinkedList", "Vector", "Stack", "HashSet", "LinkedHashSet", "TreeSet", "ArrayDeque", "PriorityQueue", "HashMap", "LinkedHashMap", "TreeMap", "Hashtable"]
message = "an abstract collection is cast to a concrete implementation"
'''

[[rules]]
id = "ward:java/bx-boxing-immediately-unboxed-to-perform-coercion"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "performance"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["expression"]
text = '^(?:(?:newInteger\(|Integer\.valueOf\()(?:[^()]|\([^()]*\))*\)\.(?!intValue)\w+Value\(\)|(?:newLong\(|Long\.valueOf\()(?:[^()]|\([^()]*\))*\)\.(?!longValue)\w+Value\(\)|(?:newShort\(|Short\.valueOf\()(?:[^()]|\([^()]*\))*\)\.(?!shortValue)\w+Value\(\)|(?:newByte\(|Byte\.valueOf\()(?:[^()]|\([^()]*\))*\)\.(?!byteValue)\w+Value\(\)|(?:newDouble\(|Double\.valueOf\()(?:[^()]|\([^()]*\))*\)\.(?!doubleValue)\w+Value\(\)|(?:newFloat\(|Float\.valueOf\()(?:[^()]|\([^()]*\))*\)\.(?!floatValue)\w+Value\(\))$'
message = "a value is boxed and unboxed only to convert it to another primitive type; cast it instead"
'''

[[rules]]
id = "ward:java/co-abstract-self"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "covariant-compare-to"
abstract-class = true
message = "abstract class defines compareTo with its own type but not compareTo(Object)"
'''

[[rules]]
id = "ward:java/co-self-no-object"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "covariant-compare-to"
message = "class defines compareTo with its own type but not compareTo(Object)"
'''

[[rules]]
id = "ward:java/ct-constructor-throw"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "constructor-throw"
message = "a constructor of a non-final class throws; a subclass can capture the partly built object"
'''

[[rules]]
id = "ward:java/dls-dead-local-store-of-null"
language = "java"
capability = "DATAFLOW"
severity = "error"
category = "style"
presets = ["standard", "strict"]
body = '''
check = "dead-store"
kind = "null"
message = "null is stored in local '{value}' and never read"
'''

[[rules]]
id = "ward:java/dls-dead-local-store-shadows-field"
language = "java"
capability = "DATAFLOW"
severity = "error"
category = "style"
presets = ["standard", "strict"]
body = '''
check = "dead-store"
kind = "shadows_field"
message = "the value stored in local '{value}' is never read, and a field has the same name"
'''

[[rules]]
id = "ward:java/bx-unboxed-and-coerced-for-ternary-operator"
language = "java"
capability = "TYPES"
severity = "error"
category = "performance"
presets = ["standard", "strict"]
body = '''
check = "ternary-coercion"
message = "a boxed number is unboxed and converted to the other branch's type in a conditional; cast one branch"
'''

[[rules]]
id = "ward:java/co-compareto-incorrect-floating"
language = "java"
capability = "TYPES"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "floating-compare-to"
message = "compareTo orders float or double values with comparison operators; use Double.compare"
'''

[[rules]]
id = "ward:java/bc-equals-method-should-work-for-all-objects"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "unchecked-equals-cast"
message = "equals casts its argument without checking its class first"
'''

[[rules]]
id = "ward:java/bc-unconfirmed-cast"
language = "java"
capability = "TYPES"
severity = "error"
category = "style"
presets = ["standard", "strict"]
body = '''
check = "unconfirmed-cast"
message = "a variable is cast to a subtype without an instanceof check in this method"
'''

[[rules]]
id = "ward:java/bc-unconfirmed-cast-of-return-value"
language = "java"
capability = "TYPES"
severity = "error"
category = "style"
presets = ["standard", "strict"]
body = '''
check = "unconfirmed-cast"
call-result = true
message = "the result of a call is cast to a subtype without an instanceof check in this method"
'''

[[rules]]
id = "ward:java/dmi-entry-sets-may-reuse-entry-objects"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "entry-set-reuse"
message = "the loop variable of an entrySet() loop is stored; a map may reuse the entry object"
'''

[[rules]]
id = "ward:java/dmi-nonserializable-object-written"
language = "java"
capability = "TYPES"
severity = "error"
category = "style"
presets = ["standard", "strict"]
body = '''
check = "non-serializable-write"
message = "an object of a final class that is not Serializable is written to an object output"
'''

[[rules]]
id = "ward:java/dl-synchronization-on-unshared-boxed-primitive"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "concurrency"
presets = ["standard", "strict"]
body = '''
check = "unshared-boxed-lock"
message = "synchronized on a field initialised with a boxed constructor; lock a plain Object"
'''

[[rules]]
id = "ward:java/dmi-misleading-substring"
language = "java"
capability = "TYPES"
severity = "error"
category = "style"
presets = ["standard", "strict"]
body = '''
check = "call-facts"
declaring-types = ["java.lang.String"]
names = ["substring"]
text = '\.substring\(0\)$'
message = "substring(0) returns the same string; remove the call"
'''
