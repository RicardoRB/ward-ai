# SpotBugs null-pointer (NP), redundant-comparison (RCN) and type-qualifier (TQ) rules for Java that read the
# nullness data flow of each method body. A variable with an unknown value is never reported.

[[rules]]
id = "ward:java/np-always-null"
language = "java"
capability = "DATAFLOW"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "np-always-null"
message = "'{value}' is null on every path here, so dereferencing it throws a NullPointerException"
'''

[[rules]]
id = "ward:java/np-always-null-exception"
language = "java"
capability = "DATAFLOW"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "np-always-null-exception"
message = "'{value}' is null on an exception path here, so dereferencing it throws a NullPointerException"
'''

