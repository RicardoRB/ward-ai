# Error Prone checks at ERROR severity for Java, fifth batch: syntax patterns, Flogger calls, and calls judged by the facts of their target. Each is on by default in Error Prone.

[[rules]]
id = "ward:java/dereference-with-null-branch"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "errorprone"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["expression"]
text = '^\((?:[^()?:]+\?null:[^()?:]+|[^()?:]+\?[^()?:]+:null)\)\.\w+'
message = "a conditional with a null branch is dereferenced; the null branch throws a NullPointerException"
'''

[[rules]]
id = "ward:java/duration-to-long-time-unit"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "errorprone"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["expression"]
text = '^(?:[\w.]+\.)?\w+\((?:[^(),]+,)*?[\w.()]*\.(?:toMillis\(\),(?:[\w.]*\.)?TimeUnit\.(?!MILLISECONDS\b)|(?:toSeconds|getSeconds)\(\),(?:[\w.]*\.)?TimeUnit\.(?!SECONDS\b)|toNanos\(\),(?:[\w.]*\.)?TimeUnit\.(?!NANOSECONDS\b)|toMinutes\(\),(?:[\w.]*\.)?TimeUnit\.(?!MINUTES\b)|toHours\(\),(?:[\w.]*\.)?TimeUnit\.(?!HOURS\b)|toDays\(\),(?:[\w.]*\.)?TimeUnit\.(?!DAYS\b))\w+\)'
message = "the long comes from a Duration in one unit but the TimeUnit passed with it is another; use matching units or the Duration overload"
'''

[[rules]]
id = "ward:java/flogger-log-string"
language = "java"
capability = "TYPES"
severity = "error"
category = "errorprone"
presets = ["standard", "strict"]
body = '''
check = "call-facts"
declaring-types = ["com.google.common.flogger.LoggingApi"]
names = ["log"]
text = '\.log\((?!")(?![A-Z][A-Z0-9_]*\))[^,>]*\)$'
message = "log() is given a string that is not a constant; use log(\"%s\", value) so the text is not treated as a format string"
'''

[[rules]]
id = "ward:java/flogger-log-varargs"
language = "java"
capability = "TYPES"
severity = "error"
category = "errorprone"
presets = ["standard", "strict"]
body = '''
check = "call-facts"
declaring-types = ["com.google.common.flogger.LoggingApi"]
names = ["log"]
text = '\.log\([^,()]+,new[\w.]*\[\w*\]'
message = "an array is passed to log(String, Object...); use logVarargs(String, Object[]) to pass it as the arguments"
'''

[[rules]]
id = "ward:java/flogger-split-log-statement"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "errorprone"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["localVariableDeclaration"]
text = '=(?:[\w.]+\.)?at(?:Severe|Warning|Info|Config|Fine|Finer|Finest)\(\)(?:\.\w+\([^()]*\))*;?$'
message = "a Flogger log statement is split across statements; write logger.atInfo().log(...) as one chain"
'''

