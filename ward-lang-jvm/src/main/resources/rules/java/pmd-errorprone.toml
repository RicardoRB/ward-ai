'''

[[rules]]
id = "ward:java/avoid-literals-in-if-condition"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "errorprone"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["statement"]
text = '^if\([^{};]*?(?:(?<![\w.-])(?!0(?![\w.]))\d[\w.]*|(?<![\w.])-(?!1(?![\w.]))\d[\w.]*)'
message = "literal in an if condition; name it as a constant"
'''

[[rules]]
id = "ward:java/avoid-instanceof-checks-in-catch-clause"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "errorprone"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["expression"]
inside = ["catchClause"]
text = '^\w+instanceof\w+$'
message = "instanceof check in a catch clause; catch each exception type in its own clause"
'''

[[rules]]
id = "ward:java/avoid-multiple-unary-operators"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "errorprone"
presets = ["standard", "strict"]
body = '''
check = "forbidden-node"
kinds = ["expression"]
text = '^(?!--|\+\+)(?:[!~][!~+-]|[+-][!~+-])'
message = "multiple unary operators are confusing; simplify the expression"
'''

[[rules]]
id = "ward:java/do-not-terminate-vm"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "errorprone"
presets = ["strict"]
body = '''
check = "forbidden-node"
kinds = ["expression"]
text = '^(?:(?:java\.lang\.)?System|Runtime\.getRuntime\(\))\.(?:exit|halt)\([^()]*\)$'
message = "System.exit terminates the JVM; only the application entry point should do it"
'''

