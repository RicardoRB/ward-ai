# Error Prone standard rules for Java (issue 319): calls that always fail, argument orders.

[[rules]]
id = "ward:java/always-throws"
language = "java"
capability = "TYPES"
severity = "error"
category = "severity-error"
presets = ["standard", "strict"]
body = '''
check = "always-throws"
message = "{value}"
'''

[[rules]]
id = "ward:java/auto-value-constructor-order-checker"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "severity-error"
presets = ["standard", "strict"]
body = '''
check = "auto-value-order"
message = "Arguments to the AutoValue constructor are in the wrong order"
'''

[[rules]]
id = "ward:java/bundle-deserialization-cast"
language = "java"
capability = "TYPES"
severity = "error"
category = "severity-error"
presets = ["standard", "strict"]
body = '''
check = "bundle-deserialization-cast"
message = "When serialized in Bundle, {value} may be transformed into an arbitrary subclass of {max}. Please cast to {max}."
'''

[[rules]]
id = "ward:java/chaining-constructor-ignores-parameter"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "severity-error"
presets = ["standard", "strict"]
body = '''
check = "chaining-constructor"
message = "The called constructor accepts a parameter with the same name and type as one of its caller's parameters, but its caller doesn't pass that parameter to it. It's likely that it was intended to."
'''
