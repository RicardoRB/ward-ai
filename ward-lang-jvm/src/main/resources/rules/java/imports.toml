# Import and documentation rules for Java. They mirror Checkstyle's AvoidStarImport, UnusedImports
# and MissingJavadocType / MissingJavadocMethod with scope public.

[[rules]]
id = "ward:java/star-import"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "imports"
presets = ["standard", "strict"]
body = '''
check = "descendant-count"
kinds = ["importDeclaration"]
counted = ["'*'"]
max = 0
message = "wildcard import is not allowed; import the names it uses"
'''

[[rules]]
id = "ward:java/unused-import"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "imports"
presets = ["standard", "strict"]
body = '''
check = "unreferenced-name"
message = "import of '{value}' is never used"
'''

[[rules]]
id = "ward:java/missing-javadoc"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "javadoc"
presets = ["standard", "strict"]
body = '''
check = "preceding-comment"
kinds = ["classDeclaration", "interfaceDeclaration", "enumDeclaration", "recordDeclaration", "methodDeclaration", "constructorDeclaration"]
modifiers = ["modifier", "classOrInterfaceModifier", "variableModifier", "annotation"]
required = "public"
exempt-annotation = "Override"
message = "public declaration has no Javadoc comment"
'''

[[rules]]
id = "ward:java/static-import"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "imports"
presets = ["strict"]
options.excludes = { type = "string-list" }
body = '''
check = "static-import"
excludes = []
message = "static import of '{value}' is not allowed"
'''

[[rules]]
id = "ward:java/illegal-import"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "imports"
presets = ["strict"]
options.illegal-pkgs = { type = "string-list" }
options.illegal-classes = { type = "string-list" }
options.regexp = { type = "boolean" }
body = '''
check = "illegal-import"
illegal-pkgs = ["sun"]
illegal-classes = []
regexp = false
message = "import of '{value}' is illegal"
'''

[[rules]]
id = "ward:java/redundant-import"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "imports"
presets = ["strict"]
body = '''
check = "redundant-import"
message = "import of '{value}' is redundant"
'''

[[rules]]
id = "ward:java/unnecessary-fully-qualified-type"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "imports"
presets = ["strict"]
body = '''
check = "unnecessary-qualified-type"
message = "type '{value}' is written fully qualified but its simple name is in scope"
'''

[[rules]]
id = "ward:java/import-order"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "imports"
presets = ["strict"]
options.groups = { type = "string-list" }
options.ordered = { type = "boolean" }
options.separated = { type = "boolean" }
options.case-sensitive = { type = "boolean" }
body = '''
check = "import-order"
groups = []
ordered = true
separated = false
case-sensitive = true
message = "import of '{value}' is out of order"
'''

[[rules]]
id = "ward:java/custom-import-order"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "imports"
presets = ["standard", "strict"]
options.custom-import-order-rules = { type = "string" }
options.sort-imports-in-group-alphabetically = { type = "boolean" }
options.separate-line-between-groups = { type = "boolean" }
options.special-imports-regexp = { type = "regex" }
options.standard-package-regexp = { type = "regex" }
options.third-party-package-regexp = { type = "regex" }
body = '''
check = "custom-import-order"
custom-import-order-rules = "STATIC###THIRD_PARTY_PACKAGE"
sort-imports-in-group-alphabetically = true
separate-line-between-groups = true
special-imports-regexp = '^$'
standard-package-regexp = '^(java|javax)\.'
third-party-package-regexp = '.*'
message = "import of '{value}' is out of the custom import order"
'''

[[rules]]
id = "ward:java/import-control"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "imports"
presets = ["strict"]
options.rules = { type = "string-list" }
options.path = { type = "regex" }
body = '''
check = "import-control"
rules = []
path = '.*'
message = "import of '{value}' is not allowed by the import control rules"
'''

[[rules]]
id = "ward:java/module-directive-order"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "imports"
presets = ["standard", "strict"]
options.order = { type = "string-list" }
options.validate-block-separation = { type = "boolean" }
body = '''
check = "module-directive-order"
order = ["requires", "exports", "opens", "uses", "provides"]
validate-block-separation = true
message = "module directive '{value}' is out of order, ungrouped or badly separated"
'''

[[rules]]
id = "ward:java/module-import-order"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "imports"
presets = ["strict"]
options.option = { type = "string" }
options.separated = { type = "boolean" }
body = '''
check = "module-import-order"
option = "top"
separated = false
message = "module import of '{value}' is out of place or order"
'''

[[rules]]
id = "ward:java/avoid-module-import"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "imports"
presets = ["standard", "strict"]
options.excludes = { type = "string-list" }
options.max-allowed-module-imports = { type = "integer", min = 0 }
body = '''
check = "avoid-module-import"
excludes = []
max-allowed-module-imports = 0
message = "module import of '{value}' is not allowed"
'''
