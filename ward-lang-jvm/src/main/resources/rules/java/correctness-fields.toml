# SpotBugs CORRECTNESS patterns for Java that follow how a class reads and writes its own fields.

[[rules]]
id = "ward:java/uwf-unwritten-field"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "field-access"
mode = "unwritten"
message = "field {value} is read but never written"
'''

[[rules]]
id = "ward:java/uwf-null-field"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "field-access"
mode = "null-only"
message = "field {value} is only ever set to null"
'''

[[rules]]
id = "ward:java/np-unwritten-field"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "field-access"
mode = "dereferenced"
message = "field {value} is never written, so selecting a member of it throws NullPointerException"
'''

[[rules]]
id = "ward:java/ur-uninit-read"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "field-access"
mode = "uninitialized-read"
message = "constructor reads field {value} before it writes it"
'''
