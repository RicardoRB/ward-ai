# Declaration rules for Java. Each rule mirrors one Checkstyle 14.3.0 check, with the same option
# names in kebab-case and Checkstyle's defaults. The standard preset keeps the settings of this
# repository's config/checkstyle.xml, so presets follow that file.

[[rules]]
id = "ward:java/hidden-field"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "coding"
presets = ["strict"]
options.ignore-constructor-parameter = { type = "boolean" }
options.ignore-setter = { type = "boolean" }
body = '''
check = "hidden-field"
message = "'{value}' hides a field"
'''

[[rules]]
id = "ward:java/parameter-assignment"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "coding"
presets = ["strict"]
body = '''
check = "parameter-assignment"
message = "parameter {value} should not be assigned"
'''

[[rules]]
id = "ward:java/variable-declaration-usage-distance"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "coding"
presets = ["standard", "strict"]
options.allowed-distance = { type = "integer" }
options.ignore-finals = { type = "boolean" }
body = '''
check = "variable-declaration-usage-distance"
message = "distance between declaration of {value} and its first usage is more than {max}"
'''
