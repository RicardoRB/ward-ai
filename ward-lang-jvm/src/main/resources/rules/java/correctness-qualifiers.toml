# SpotBugs type qualifier patterns for Java, from a data-flow of the JSR-305 qualifiers a file declares.

[[rules]]
id = "ward:java/tq-always-value-used-where-never-required"
language = "java"
capability = "TYPES"
severity = "error"
category = "correctness"
presets = ["standard", "strict"]
body = '''
check = "type-qualifier"
mode = "always-value-used-where-never-required"
message = "a value that always has the type qualifier reaches a place that requires that it never has it"
'''

