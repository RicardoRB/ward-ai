# NullAway-style nullness rules for Java. They read the annotations and syntax of one file, so a
# declaration in another file is unknown and nothing is reported about it.

[[rules]]
id = "ward:java/return-nullable"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "nullness"
presets = ["standard", "strict"]
body = '''
check = "return-nullable"
message = "{value} may be null, but this method must not return null"
'''

[[rules]]
id = "ward:java/unbox-nullable"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "nullness"
presets = ["standard", "strict"]
body = '''
check = "unbox-nullable"
message = "{value} may be null and is unboxed here"
'''

