message = "this override makes a parameter @Nonnull or @Nullable where the overridden method has @CheckForNull"
'''

[[rules]]
id = "ward:java/np-method-return-relaxing-annotation"
language = "java"
capability = "TYPES"
severity = "error"
category = "style"
presets = ["standard", "strict"]
body = '''
check = "override-nullness"
mode = "return-relaxes"
nullable = ["javax.annotation.Nullable", "javax.annotation.CheckForNull"]
nonnull = ["javax.annotation.Nonnull"]
message = "this override may return null, but the overridden method is annotated @Nonnull"
'''

