[[rules]]
id = "ward:java/np-unwritten-public-or-protected-field"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "style"
presets = ["standard", "strict"]
body = '''
check = "unwritten-public-field"
message = "the public or protected field {value} is dereferenced but no file of the project ever writes a non-null value to it"
