[[rules]]
id = "ward:java/dc-partially-constructed"
language = "java"
capability = "SYNTAX"
severity = "error"
category = "concurrency"
presets = ["standard", "strict"]
body = '''
check = "partial-construction"
message = "the volatile field {value} is published and then still modified inside the lock; build the object fully before assigning it"
