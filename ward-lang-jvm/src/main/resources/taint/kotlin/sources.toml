# Untrusted input that only Kotlin code reads: console input of the Kotlin standard library and
# the request of a Ktor handler, whose `call` is the receiver of the route lambda and so has no
# declared type. The Servlet and Spring sources of taint/java/sources.toml apply to Kotlin as they
# are.

