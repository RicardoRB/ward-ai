# Session sinks: the attribute name and value stored in an HTTP session.

[[sinks]]
kind = "call"
name = "setAttribute"
receiver = "javax.servlet.http.HttpSession"
arguments = [0, 1]

[[sinks]]
kind = "call"
name = "putValue"
receiver = "javax.servlet.http.HttpSession"
arguments = [0, 1]

