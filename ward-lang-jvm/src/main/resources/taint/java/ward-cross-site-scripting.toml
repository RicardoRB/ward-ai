# Written for Ward from the API documentation named in the catalog row of the rule; sources: taint/java/sources.toml.
# HTML sinks: the writers that a servlet response gives. PrintWriter is matched by type, so any writer is a sink.

[[sinks]]
kind = "call"
name = "print"
receiver = "java.io.PrintWriter"
arguments = [0]

[[sinks]]
kind = "call"
name = "println"
receiver = "java.io.PrintWriter"
arguments = [0]

[[sinks]]
kind = "call"
name = "write"
receiver = "java.io.PrintWriter"
arguments = [0]

[[sinks]]
kind = "call"
name = "append"
receiver = "java.io.PrintWriter"
arguments = [0]

[[sinks]]
kind = "call"
name = "printf"
receiver = "java.io.PrintWriter"
arguments = [0, 1, 2]

[[sinks]]
kind = "call"
name = "format"
receiver = "java.io.PrintWriter"
arguments = [0, 1, 2]

[[sinks]]
kind = "call"
name = "print"
receiver = "javax.servlet.ServletOutputStream"
arguments = [0]

[[sinks]]
kind = "call"
name = "print"
receiver = "jakarta.servlet.ServletOutputStream"
arguments = [0]

[[sinks]]
kind = "call"
name = "println"
receiver = "javax.servlet.ServletOutputStream"
arguments = [0]

[[sinks]]
kind = "call"
name = "println"
receiver = "jakarta.servlet.ServletOutputStream"
arguments = [0]

[[sinks]]
kind = "call"
name = "write"
receiver = "javax.servlet.ServletOutputStream"
arguments = [0]

[[sinks]]
kind = "call"
name = "write"
receiver = "jakarta.servlet.ServletOutputStream"
arguments = [0]


# A chained receiver has no known type, so it is matched by the text of its qualifier.

[[sinks]]
kind = "call"
name = "print"
qualifier = "*.getWriter()"
arguments = [0]

[[sinks]]
kind = "call"
name = "println"
qualifier = "*.getWriter()"
arguments = [0]

[[sinks]]
kind = "call"
name = "write"
qualifier = "*.getWriter()"
arguments = [0]

[[sinks]]
kind = "call"
name = "append"
qualifier = "*.getWriter()"
arguments = [0]

[[sinks]]
kind = "call"
name = "printf"
qualifier = "*.getWriter()"
arguments = [0, 1, 2]

[[sinks]]
kind = "call"
name = "format"
qualifier = "*.getWriter()"
arguments = [0, 1, 2]

[[sinks]]
kind = "call"
name = "print"
qualifier = "*.getOutputStream()"
arguments = [0]

[[sinks]]
kind = "call"
name = "println"
qualifier = "*.getOutputStream()"
arguments = [0]

[[sinks]]
kind = "call"
name = "write"
qualifier = "*.getOutputStream()"
arguments = [0]


