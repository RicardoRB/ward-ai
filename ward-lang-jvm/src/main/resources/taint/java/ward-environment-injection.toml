# Written for Ward from the API documentation named in the catalog row of the rule; sources: taint/java/sources.toml.
# Environment sinks: the variables that a started process receives. Runtime.exec takes them as the
# array in argument 1; ProcessBuilder.environment() returns a map that is written with put, so the
# call is matched by the end of its qualifier.

[[sinks]]
kind = "call"
name = "exec"
receiver = "java.lang.Runtime"
arguments = [1]

[[sinks]]
kind = "call"
name = "exec"
receiver = "java.lang.Runtime"
qualifier = "Runtime.getRuntime()"
arguments = [1]

[[sinks]]
kind = "call"
name = "put"
qualifier = "*.environment()"
arguments = [0, 1]

[[sanitizers]]
kind = "call"
name = "parseInt"
receiver = "java.lang.Integer"

[[sanitizers]]
kind = "call"
name = "valueOf"
receiver = "java.lang.Integer"

[[sanitizers]]
kind = "call"
name = "parseLong"
receiver = "java.lang.Long"

[[sanitizers]]
kind = "call"
name = "valueOf"
receiver = "java.lang.Long"
