# Written for Ward from the API documentation named in the catalog row of the rule; sources: taint/java/sources.toml.
# JNDI sinks: the name that a context looks up, which is argument 0.

[[sinks]]
kind = "call"
name = "lookup"
receiver = "javax.naming.Context"
arguments = [0]

