# LDAP sinks: the base name and filter of a directory search.

[[sinks]]
kind = "call"
name = "search"
receiver = "javax.naming.directory.DirContext"
arguments = [0, 1]

[[sinks]]
kind = "call"
name = "search"
receiver = "javax.naming.directory.InitialDirContext"
arguments = [0, 1]

[[sinks]]
kind = "call"
name = "search"
receiver = "javax.naming.ldap.LdapContext"
arguments = [0, 1]

[[sinks]]
kind = "call"
name = "search"
receiver = "javax.naming.ldap.InitialLdapContext"
arguments = [0, 1]

