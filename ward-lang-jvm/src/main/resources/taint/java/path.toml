# Path sinks: the file names that java.io and java.nio.file open. A constructor is named <init>.
# RandomAccessFile takes its mode as argument 1, so only argument 0 is guarded there.
[[sinks]]
kind = "call"
name = "<init>"
receiver = "java.io.File"
arguments = [0, 1]

[[sinks]]
kind = "call"
name = "<init>"
receiver = "java.io.FileInputStream"
arguments = [0, 1]

[[sinks]]
kind = "call"
name = "<init>"
receiver = "java.io.FileOutputStream"
arguments = [0, 1]

[[sinks]]
kind = "call"
name = "<init>"
receiver = "java.io.FileReader"
arguments = [0, 1]

[[sinks]]
kind = "call"
name = "<init>"
receiver = "java.io.FileWriter"
arguments = [0, 1]

[[sinks]]
kind = "call"
name = "<init>"
receiver = "java.io.RandomAccessFile"
arguments = [0]

[[sinks]]
kind = "call"
name = "get"
receiver = "java.nio.file.Paths"
arguments = [0, 1, 2, 3]

[[sinks]]
kind = "call"
name = "of"
receiver = "java.nio.file.Path"
arguments = [0, 1, 2, 3]

[[sinks]]
kind = "call"
name = "resolve"
receiver = "java.nio.file.Path"
arguments = [0]

[[sanitizers]]
kind = "call"
name = "getName"
receiver = "org.apache.commons.io.FilenameUtils"

[[sanitizers]]
kind = "call"
name = "parseInt"
receiver = "java.lang.Integer"

[[sanitizers]]
kind = "call"
name = "valueOf"
receiver = "java.lang.Integer"

[[sanitizers]]
kind = "call"
name = "parseLong"
receiver = "java.lang.Long"

[[sanitizers]]
kind = "call"
name = "valueOf"
receiver = "java.lang.Long"
