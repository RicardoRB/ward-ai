# getRequestURI returns the path as sent, without percent-decoding, and a servlet container rejects a
# raw line break in the request line. The Java frontend names the site of that call <undecoded-uri>
# and covers the call, so the getRequestURI source does not apply here. A decoded form of it is not
# followed: taint entries have no labels, so a decode step cannot be tied to this one source.

[[sanitizers]]
kind = "call"
name = "<undecoded-uri>"


[[sanitizers]]
kind = "call"
name = "parseInt"
receiver = "java.lang.Integer"

[[sanitizers]]
kind = "call"
name = "valueOf"
receiver = "java.lang.Integer"

[[sanitizers]]
kind = "call"
name = "parseLong"
receiver = "java.lang.Long"

[[sanitizers]]
kind = "call"
name = "valueOf"
receiver = "java.lang.Long"

[[sanitizers]]
kind = "call"
name = "parseDouble"
receiver = "java.lang.Double"


# A chain of String.replace or replaceAll calls with literal arguments that removes both carriage
# returns and line feeds (the Java frontend names its site <line-breaks-removed>); its receiver is clean.
[[sanitizers]]
kind = "call"
name = "<line-breaks-removed>"


# A call on a String that returns a number or a boolean (the Java frontend names its site
# <primitive-value>), and the numeric java.lang.Math calls: a number cannot carry a line break or markup.
[[sanitizers]]
kind = "call"
name = "<primitive-value>"

[[sanitizers]]
kind = "call"
name = "max"
receiver = "java.lang.Math"

[[sanitizers]]
kind = "call"
name = "min"
receiver = "java.lang.Math"

[[sanitizers]]
kind = "call"
name = "abs"
receiver = "java.lang.Math"
