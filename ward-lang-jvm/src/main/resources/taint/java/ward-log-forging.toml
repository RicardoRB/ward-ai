# Written for Ward from the API documentation named in the catalog row of the rule; sources: taint/java/sources.toml.
# Log sinks: the message of java.util.logging, SLF4J, Log4j 2 and Commons Logging; the message and its first two arguments are guarded.

[[sinks]]
kind = "call"
name = "info"
receiver = "java.util.logging.Logger"
arguments = [0]

