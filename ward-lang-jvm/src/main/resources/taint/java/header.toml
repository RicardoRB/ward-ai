# Header sinks: the name and value of a response header or cookie, where a line break splits the response.

[[sinks]]
kind = "call"
name = "setHeader"
receiver = "javax.servlet.http.HttpServletResponse"
arguments = [0, 1]

[[sinks]]
kind = "call"
name = "addHeader"
receiver = "javax.servlet.http.HttpServletResponse"
arguments = [0, 1]

[[sinks]]
kind = "call"
name = "<init>"
receiver = "javax.servlet.http.Cookie"
arguments = [0, 1]

[[sinks]]
