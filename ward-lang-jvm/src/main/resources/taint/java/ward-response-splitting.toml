# Written for Ward from the API documentation named in the catalog row of the rule; sources: taint/java/sources.toml.
# Header sinks: the name and the value of a servlet header and of Spring HttpHeaders.

[[sinks]]
kind = "call"
name = "setHeader"
receiver = "javax.servlet.http.HttpServletResponse"
arguments = [0, 1]

[[sinks]]
kind = "call"
name = "setHeader"
receiver = "jakarta.servlet.http.HttpServletResponse"
arguments = [0, 1]

[[sinks]]
kind = "call"
name = "addHeader"
receiver = "javax.servlet.http.HttpServletResponse"
arguments = [0, 1]

[[sinks]]
kind = "call"
name = "addHeader"
receiver = "jakarta.servlet.http.HttpServletResponse"
arguments = [0, 1]

[[sinks]]
kind = "call"
name = "add"
receiver = "org.springframework.http.HttpHeaders"
arguments = [0, 1]

[[sinks]]
kind = "call"
name = "set"
receiver = "org.springframework.http.HttpHeaders"
arguments = [0, 1]


[[sanitizers]]
kind = "call"
name = "parseInt"
receiver = "java.lang.Integer"

[[sanitizers]]
kind = "call"
name = "valueOf"
receiver = "java.lang.Integer"

[[sanitizers]]
kind = "call"
name = "parseLong"
receiver = "java.lang.Long"

[[sanitizers]]
kind = "call"
name = "valueOf"
receiver = "java.lang.Long"

[[sanitizers]]
kind = "call"
name = "parseDouble"
receiver = "java.lang.Double"

